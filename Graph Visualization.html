<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>MSOT Graph Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — topic rail by course Part on the left; workbench (canvas + adjacency list + state) on top, code + notes below.
   Node colours borrow Codeforces rating colours: cyan = in queue/stack, red = current, blue = visited, violet = finished, orange = gray/in-progress, green = answer/path. */
:root {
  --bg: #eef1f5; --panel: #ffffff; --panel-2: #f4f6f9; --ink: #142030; --muted: #566375; --faint: #8792a2;
  --line: #d6dce5; --line-2: #e7ebf0;
  --accent: #1d5fd1; --accent-ink: #ffffff; --accent-soft: #e2ebfb;
  --canvas: #fbfcfd; --dot: #dde3eb;
  --n-idle-fill: #ffffff; --n-idle-stroke: #3a4657; --on-fill: #ffffff;
  --n-frontier: #039b8f; --n-cur: #dc3127; --n-visited: #1d5fd1; --n-done: #9419a1; --n-gray: #e78200; --n-path: #15843a; --n-bad: #a8102a;
  --c0: #1d5fd1; --c1: #dc3127; --c2: #15843a; --c3: #e78200; --c4: #9419a1; --c5: #039b8f; --c6: #8a5a2b; --c7: #c0185a;
  --e-idle: #9ba6b5;
  --hl: #fff1b8; --hl-ink: #142030;
  --warn-bg: #fff2df; --warn-ink: #8a4700;
  --shadow: 0 1px 2px rgba(20, 32, 48, .06), 0 4px 16px rgba(20, 32, 48, .05);
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --font-display: 'Archivo', 'IBM Plex Sans', system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1218; --panel: #151b23; --panel-2: #1a212b; --ink: #e3e8ef; --muted: #9aa5b3; --faint: #6d7787;
    --line: #29323e; --line-2: #212934;
    --accent: #6f9ffc; --accent-ink: #0a1220; --accent-soft: #1b2944;
    --canvas: #10161d; --dot: #222b36;
    --n-idle-fill: #151b23; --n-idle-stroke: #b8c2cf; --on-fill: #0a1018;
    --n-frontier: #2fc4b6; --n-cur: #ff6157; --n-visited: #6f9ffc; --n-done: #cf7ddc; --n-gray: #ffab42; --n-path: #48c56c; --n-bad: #ff5574;
    --c0: #6f9ffc; --c1: #ff6157; --c2: #48c56c; --c3: #ffab42; --c4: #cf7ddc; --c5: #2fc4b6; --c6: #c99a6a; --c7: #f06aa0;
    --e-idle: #56616f;
    --hl: #3b3417; --hl-ink: #f3ead0;
    --warn-bg: #3a2a12; --warn-ink: #ffc98a;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1218; --panel: #151b23; --panel-2: #1a212b; --ink: #e3e8ef; --muted: #9aa5b3; --faint: #6d7787;
  --line: #29323e; --line-2: #212934;
  --accent: #6f9ffc; --accent-ink: #0a1220; --accent-soft: #1b2944;
  --canvas: #10161d; --dot: #222b36;
  --n-idle-fill: #151b23; --n-idle-stroke: #b8c2cf; --on-fill: #0a1018;
  --n-frontier: #2fc4b6; --n-cur: #ff6157; --n-visited: #6f9ffc; --n-done: #cf7ddc; --n-gray: #ffab42; --n-path: #48c56c; --n-bad: #ff5574;
  --c0: #6f9ffc; --c1: #ff6157; --c2: #48c56c; --c3: #ffab42; --c4: #cf7ddc; --c5: #2fc4b6; --c6: #c99a6a; --c7: #f06aa0;
  --e-idle: #56616f;
  --hl: #3b3417; --hl-ink: #f3ead0;
  --warn-bg: #3a2a12; --warn-ink: #ffc98a;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
code, kbd, pre, textarea { font-family: var(--font-mono); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }

/* ---------- sidebar ---------- */
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-left: max(0px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; gap: 10px; align-items: center; padding: 18px 18px 14px; border-bottom: 1px solid var(--line-2); }
.brand-mark { width: 34px; height: 34px; color: var(--accent); flex: none; }
.brand-mark circle { fill: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 800; font-stretch: 80%; font-size: 21px; letter-spacing: .01em; line-height: 1; }
.brand-sub { font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: .02em; }
nav { padding: 10px 8px 16px; flex: 1; }
.nav-part { display: grid; grid-template-columns: 30px 1fr; gap: 0 4px; margin-top: 6px; }
.nav-num { font-family: var(--font-mono); font-size: 11px; color: var(--faint); padding: 8px 0 0 8px; }
.nav-part-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 6px 3px; font-weight: 600; }
.nav-links { grid-column: 2; display: flex; flex-direction: column; }
.nav-link { display: block; text-decoration: none; color: var(--ink); padding: 5px 8px; border-radius: 7px; font-size: 13.5px; }
.nav-link:hover { background: var(--panel-2); }
.nav-link.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-foot { padding: 12px 18px 18px; border-top: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 5px; color: var(--muted); font-size: 12px; }
kbd { font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; margin-right: 3px; background: var(--panel-2); color: var(--ink); }
.scrim { display: none; }

/* ---------- main ---------- */
.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; gap: 14px; align-items: flex-start; }
.titles { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
h1 { font-family: var(--font-display); font-weight: 800; font-stretch: 78%; font-size: clamp(24px, 3vw, 34px); line-height: 1.05; margin: 2px 0 4px; text-wrap: balance; letter-spacing: -.005em; }
.titles p { margin: 0; color: var(--muted); max-width: 72ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 40%; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.chip.acc { border-color: transparent; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-toggle { display: inline-flex; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card h3 { margin: 0; padding: 10px 14px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h3 code { text-transform: none; letter-spacing: 0; font-size: 11.5px; color: var(--faint); font-weight: 400; }
.card h3 .muted { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); font-size: 12px; }
.card h3 .btn { margin-left: auto; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.tb-group { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.field select, .field input { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; min-width: 0; }
.field input[type=number] { width: 62px; font-family: var(--font-mono); }
.field input[type=text] { width: 120px; font-family: var(--font-mono); }
.field.tiny input { width: 52px; padding: 3px 6px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg.small button { padding: 3px 9px; font-size: 12px; }
.fixed-chip { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.fixed-chip:empty { display: none; }

.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 7px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { padding: 2px 9px; font-size: 12px; }
.btn:hover { filter: brightness(1.06); }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 16px; height: 16px; fill: currentColor; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
.icon-btn.play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); width: 42px; }
.icon-btn:hover { border-color: var(--accent); }

/* ---------- stage ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 12px; align-items: start; }
.stage-left, .stage-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.canvas-card { overflow: hidden; }
.canvas-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line-2); }
.tool-hint { font-size: 12px; color: var(--faint); }
.gsvg { display: block; width: 100%; height: clamp(340px, 60vh, 640px); background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; touch-action: none; user-select: none; -webkit-user-select: none; }
.main-custom { background: var(--canvas); min-height: 300px; overflow: auto; padding: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--muted); }
.legend:empty { display: none; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg svg { width: 22px; height: 16px; overflow: visible; }
.extra-card #extra { padding: 4px 12px 12px; overflow-x: auto; }
.extra-card svg.gsvg { height: clamp(220px, 34vh, 380px); border-radius: 8px; }

/* graph svg */
.edge { fill: none; stroke: var(--e-idle); stroke-width: 2.2; stroke-linecap: round; transition: stroke .18s, stroke-width .18s, opacity .18s; }
.arrow { fill: var(--e-idle); stroke: none; transition: fill .18s; }
.ehit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.st-tree.edge, .st-visited.edge { stroke: var(--n-visited); stroke-width: 4; } .st-tree.arrow, .st-visited.arrow { fill: var(--n-visited); }
.st-cur.edge { stroke: var(--n-cur); stroke-width: 4.5; } .st-cur.arrow { fill: var(--n-cur); }
.st-back.edge { stroke: var(--n-gray); stroke-width: 3.5; stroke-dasharray: 7 5; } .st-back.arrow { fill: var(--n-gray); }
.st-cross.edge { stroke: var(--n-done); stroke-width: 3; stroke-dasharray: 2 5; } .st-cross.arrow { fill: var(--n-done); }
.st-path.edge, .st-mst.edge { stroke: var(--n-path); stroke-width: 5; } .st-path.arrow, .st-mst.arrow { fill: var(--n-path); }
.st-relax.edge, .st-frontier.edge { stroke: var(--n-frontier); stroke-width: 4; } .st-relax.arrow, .st-frontier.arrow { fill: var(--n-frontier); }
.st-skip.edge, .st-rejected.edge { stroke: var(--e-idle); stroke-width: 2; stroke-dasharray: 3 6; opacity: .65; }
.st-bad.edge, .st-bridge.edge { stroke: var(--n-bad); stroke-width: 5; } .st-bad.arrow, .st-bridge.arrow { fill: var(--n-bad); }
.st-done.edge { stroke: var(--n-done); stroke-width: 3.5; } .st-done.arrow { fill: var(--n-done); }
.st-dim.edge { opacity: .22; } .st-dim.arrow { opacity: .22; }
.st-c0.edge{stroke:var(--c0);stroke-width:4} .st-c1.edge{stroke:var(--c1);stroke-width:4} .st-c2.edge{stroke:var(--c2);stroke-width:4} .st-c3.edge{stroke:var(--c3);stroke-width:4}
.st-c4.edge{stroke:var(--c4);stroke-width:4} .st-c5.edge{stroke:var(--c5);stroke-width:4} .st-c6.edge{stroke:var(--c6);stroke-width:4} .st-c7.edge{stroke:var(--c7);stroke-width:4}
.elabel rect { fill: var(--canvas); stroke: var(--line); stroke-width: 1; }
.elabel text { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.elabel.hot rect { stroke: var(--n-cur); stroke-width: 1.5; }

.node { fill: var(--n-idle-fill); stroke: var(--n-idle-stroke); stroke-width: 2.2; transition: fill .18s, stroke .18s; }
.nid { font-family: var(--font-mono); font-weight: 600; font-size: 14px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.nlab, .ntop { font-family: var(--font-mono); font-size: 12px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.ntop { fill: var(--accent); }
.vg { cursor: grab; }
.vg.sel .node { stroke: var(--accent); stroke-width: 4; }
.vg .ring { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 3 3; }
.node.st-frontier { fill: var(--n-frontier); stroke: var(--n-frontier); }
.node.st-cur { fill: var(--n-cur); stroke: var(--n-cur); }
.node.st-visited { fill: var(--n-visited); stroke: var(--n-visited); }
.node.st-done { fill: var(--n-done); stroke: var(--n-done); }
.node.st-gray { fill: var(--n-gray); stroke: var(--n-gray); }
.node.st-path { fill: var(--n-path); stroke: var(--n-path); }
.node.st-bad { fill: var(--n-bad); stroke: var(--n-bad); }
.node.st-src { stroke: var(--accent); stroke-width: 4; }
.node.st-dim { opacity: .3; }
.node.st-side0, .node.st-c3 { fill: var(--c3); stroke: var(--c3); }
.node.st-side1, .node.st-c5 { fill: var(--c5); stroke: var(--c5); }
.node.st-c0 { fill: var(--c0); stroke: var(--c0); } .node.st-c1 { fill: var(--c1); stroke: var(--c1); } .node.st-c2 { fill: var(--c2); stroke: var(--c2); }
.node.st-c4 { fill: var(--c4); stroke: var(--c4); } .node.st-c6 { fill: var(--c6); stroke: var(--c6); } .node.st-c7 { fill: var(--c7); stroke: var(--c7); }
.vg.filled .nid { fill: var(--on-fill); }
.vg.dimmed { opacity: .35; }

/* ---------- adjacency list ---------- */
.adj { padding: 2px 8px 10px; font-family: var(--font-mono); font-size: 13px; max-height: 330px; overflow: auto; }
.adj-row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; min-height: 30px; }
.adj-row.hi { background: var(--hl); color: var(--hl-ink); }
.adj-u { flex: none; width: 26px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-weight: 600; border: 2px solid var(--n-idle-stroke); font-size: 12.5px; }
.adj-u.filled { color: var(--on-fill); }
.adj-arrow { color: var(--faint); flex: none; }
.adj-items { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.adj-it { border: 1px solid var(--line); background: var(--panel-2); border-radius: 5px; padding: 0 6px; line-height: 22px; white-space: nowrap; }
.adj-it small { color: var(--muted); font-size: 11px; }
.adj-it.hi { border-color: var(--n-cur); background: var(--n-cur); color: #fff; font-weight: 600; }
.adj-it.hi small { color: #fff; }
.adj-it.done { opacity: .5; }
.adj-empty { color: var(--faint); font-style: italic; font-family: var(--font-ui); font-size: 12px; }
.adj-sub { font-family: var(--font-ui); font-size: 12px; color: var(--muted); padding: 2px 6px 6px; }
.adj-row.hi .adj-it:not(.hi) { background: var(--panel); }

/* swatch backgrounds shared by adjacency chips and panel chips */
.sw-frontier { background: var(--n-frontier) !important; border-color: var(--n-frontier) !important; color: var(--on-fill) !important; }
.sw-cur { background: var(--n-cur) !important; border-color: var(--n-cur) !important; color: var(--on-fill) !important; }
.sw-visited { background: var(--n-visited) !important; border-color: var(--n-visited) !important; color: var(--on-fill) !important; }
.sw-done { background: var(--n-done) !important; border-color: var(--n-done) !important; color: var(--on-fill) !important; }
.sw-gray { background: var(--n-gray) !important; border-color: var(--n-gray) !important; color: var(--on-fill) !important; }
.sw-path { background: var(--n-path) !important; border-color: var(--n-path) !important; color: var(--on-fill) !important; }
.sw-bad { background: var(--n-bad) !important; border-color: var(--n-bad) !important; color: var(--on-fill) !important; }
.sw-side0, .sw-c3 { background: var(--c3) !important; border-color: var(--c3) !important; color: var(--on-fill) !important; }
.sw-side1, .sw-c5 { background: var(--c5) !important; border-color: var(--c5) !important; color: var(--on-fill) !important; }
.sw-c0 { background: var(--c0) !important; border-color: var(--c0) !important; color: var(--on-fill) !important; }
.sw-c1 { background: var(--c1) !important; border-color: var(--c1) !important; color: var(--on-fill) !important; }
.sw-c2 { background: var(--c2) !important; border-color: var(--c2) !important; color: var(--on-fill) !important; }
.sw-c4 { background: var(--c4) !important; border-color: var(--c4) !important; color: var(--on-fill) !important; }
.sw-c6 { background: var(--c6) !important; border-color: var(--c6) !important; color: var(--on-fill) !important; }
.sw-c7 { background: var(--c7) !important; border-color: var(--c7) !important; color: var(--on-fill) !important; }
.sw-dim { opacity: .4; }

/* ---------- state panels ---------- */
.panels { padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 12px; max-height: 460px; overflow: auto; }
.panels:empty::before { content: "Press play or → to start the dry run."; color: var(--faint); font-size: 12.5px; }
.pn-title { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
.pn-title b { color: var(--ink); font-family: var(--font-mono); font-weight: 600; }
.pn-title .note { color: var(--faint); font-size: 11.5px; }
.seq { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-family: var(--font-mono); font-size: 13px; min-height: 28px; }
.seq.empty::after { content: "empty"; color: var(--faint); font-family: var(--font-ui); font-size: 12px; font-style: italic; }
.seq-it { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 0 8px; line-height: 24px; }
.seq-it.hi { outline: 2px solid var(--n-cur); outline-offset: 1px; }
.seq-end { font-family: var(--font-ui); font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.seq.vert { flex-direction: column-reverse; align-items: flex-start; }
.arr-wrap { overflow-x: auto; }
table.arr, table.tbl, table.mat { border-collapse: collapse; font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.arr th { font-weight: 400; color: var(--faint); font-size: 11px; padding: 0 4px 2px; text-align: center; }
table.arr td { border: 1px solid var(--line); min-width: 32px; height: 28px; text-align: center; padding: 0 5px; background: var(--panel); }

<script>/* core.js */
/* ============================================================
   Graph Lab core engine.
   Exposes window.GV. Topic modules call GV.registerTopic(...)
   and GV.addPreset(...). See README-API.md for the contract.
   ============================================================ */
(function () {
'use strict';
const GV = (window.GV = window.GV || {});
GV.topics = [];
GV.presets = {};
GV.presetOrder = [];
const SVGNS = 'http://www.w3.org/2000/svg';

/* ---------------- DOM helpers ---------------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  setAttrs(el, attrs);
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));

}

  setAttrs(el, attrs);
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function setAttrs(el, attrs) {
  if (!attrs) return;
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
}
const clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
GV.h = h; GV.s = s; GV.clone = clone;
/** Topic modules may add CSS (use the theme tokens, e.g. var(--n-cur), var(--line), var(--ink)). */
GV.addStyle = function (css) { const st = document.createElement('style'); st.textContent = css; document.head.append(st); };

/** Format a value for display: Infinity/INF -> ∞, null -> · */
GV.fmt = function (v) {
  if (v === null || v === undefined) return '·';
  if (v === Infinity || (typeof v === 'number' && v >= 1e9)) return '∞';
  if (v === -Infinity || (typeof v === 'number' && v <= -1e9)) return '-∞';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  return String(v);
};
GV.esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------------- graph model ---------------- */
/* g = { n, directed, weighted, pos: [unused, [x,y], ...], edges: [{u, v, w}] } ; vertices 1..n */
GV.graph = function (o) {
  const pos = [null];
  for (let v = 1; v <= o.n; v++) pos[v] = o.pos && o.pos[v] ? o.pos[v].slice() : null;
  const g = {
    n: o.n, directed: !!o.directed, weighted: !!o.weighted, pos,
    edges: (o.edges || []).map((e) => (Array.isArray(e) ? { u: e[0], v: e[1], w: e[2] ?? 1 } : { u: e.u, v: e.v, w: e.w ?? 1 })),
  };
  if (pos.slice(1).some((p) => !p)) GV.layout.force(g);
  return g;
};
GV.copyGraph = (g) => ({ n: g.n, directed: g.directed, weighted: g.weighted, pos: g.pos.map((p) => (p ? p.slice() : p)), edges: g.edges.map((e) => ({ ...e })) });

/** preset: {name, directed, weighted, n, nodes:[[x,y] for v=1..n], edges:[[u,v,w?]], note, tags:[]} */
GV.addPreset = function (id, p) {
  if (!GV.presets[id]) GV.presetOrder.push(id);
  GV.presets[id] = p;
};
GV.fromPreset = function (id) {
  const p = GV.presets[id];
  if (!p) throw new Error('Unknown preset ' + id);
  const pos = [null];
  for (let i = 0; i < p.n; i++) pos.push(p.nodes && p.nodes[i] ? p.nodes[i].slice() : null);
  return GV.graph({ n: p.n, directed: p.directed, weighted: p.weighted, pos, edges: p.edges });

/** Adjacency list in the course's order: each list sorted by neighbour. adj[u] = [{v, w, e}] (e = edge index in g.edges). */
GV.buildAdj = function (g, reverse = false) {
  const adj = Array.from({ length: g.n + 1 }, () => []);
  g.edges.forEach((ed, e) => {
    const u = reverse ? ed.v : ed.u, v = reverse ? ed.u : ed.v;
    adj[u].push({ v, w: ed.w, e });
    if (!g.directed && u !== v) adj[v].push({ v: u, w: ed.w, e });
  });
  for (const l of adj) l.sort((a, b) => a.v - b.v || a.e - b.e);
  return adj;
};

GV.parseInput = function (text, directed, weighted) {
  const lines = text.split('\n').map((l) => l.replace(/(#|\/\/).*$/, '').trim()).filter(Boolean);
  if (!lines.length) return { error: 'Input is empty. The first line should be "n m".' };
  const first = lines[0].split(/\s+/).map(Number);
  const n = first[0];
  if (!Number.isInteger(n) || n < 1) return { error: 'First line must start with n, the number of vertices.' };
  if (n > 40) return { error: 'n = ' + n + ' is too large to draw clearly. Keep n ≤ 40 for the visualizer.' };
  const m = first.length > 1 ? first[1] : lines.length - 1;
  if (!Number.isInteger(m) || m < 0) return { error: 'Second number on the first line must be m, the number of edges.' };
  if (lines.length - 1 < m) return { error: 'Expected ' + m + ' edge lines, found ' + (lines.length - 1) + '.' };
  const edges = [];
  let all3 = m > 0;
  for (let i = 1; i <= m; i++) {
    const t = lines[i].split(/\s+/).map(Number);
    if (t.length < 2 || t.slice(0, 2).some((x) => !Number.isInteger(x))) return { error: 'Line ' + (i + 1) + ': expected "u v" or "u v w".' };
    if (t[0] < 1 || t[0] > n || t[1] < 1 || t[1] > n) return { error: 'Line ' + (i + 1) + ': vertices must be between 1 and ' + n + '.' };

GV.serialize = function (g) {

};

/* ---------------- layouts ---------------- */
GV.layout = {
  circle(g, W = 560, H = 400) {
    const cx = W / 2, cy = H / 2, r = Math.min(W, H) / 2 - 20;
    for (let v = 1; v <= g.n; v++) {
      const a = -Math.PI / 2 + (2 * Math.PI * (v - 1)) / g.n;
      g.pos[v] = [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    }
    return g.pos;
  },
  /** Fruchterman–Reingold; keeps existing positions as a start. */
  force(g, W = 600, H = 420) {
    const n = g.n;
    if (n === 0) return g.pos;
    const P = [null];
    const missing = [];
    for (let v = 1; v <= n; v++) { if (g.pos[v]) P[v] = g.pos[v].slice(); else { P[v] = null; missing.push(v); } }
    if (missing.length === n) {
      for (let v = 1; v <= n; v++) { const a = (2 * Math.PI * (v - 1)) / n; P[v] = [W / 2 + (W / 3) * Math.cos(a), H / 2 + (H / 3) * Math.sin(a)]; }
    } else missing.forEach((v, i) => (P[v] = [W / 2 + 60 * Math.cos(i * 2.4), H / 2 + 60 * Math.sin(i * 2.4)]));
    const k = Math.sqrt((W * H) / n) * 0.75;
    let t = W / 8;
    for (let it = 0; it < 320; it++) {
      const D = P.map(() => [0, 0]);
      for (let a = 1; a <= n; a++) for (let b = a + 1; b <= n; b++) {
        let dx = P[a][0] - P[b][0], dy = P[a][1] - P[b][1];
        let d = Math.hypot(dx, dy) || 0.01;
        const f = (k * k) / d;
        D[a][0] += (dx / d) * f; D[a][1] += (dy / d) * f; D[b][0] -= (dx / d) * f; D[b][1] -= (dy / d) * f;
      }
      for (const e of g.edges) {
        if (e.u === e.v) continue;
        let dx = P[e.u][0] - P[e.v][0], dy = P[e.u][1] - P[e.v][1];
        let d = Math.hypot(dx, dy) || 0.01;
        const f = (d * d) / k;
        D[e.u][0] -= (dx / d) * f; D[e.u][1] -= (dy / d) * f; D[e.v][0] += (dx / d) * f; D[e.v][1] += (dy / d) * f;
      }
      for (let v = 1; v <= n; v++) {
        // gentle gravity so components don't fly apart
        D[v][0] += (W / 2 - P[v][0]) * 0.02 * k / 10; D[v][1] += (H / 2 - P[v][1]) * 0.02 * k / 10;
        const d = Math.hypot(D[v][0], D[v][1]) || 0.01;
        P[v][0] += (D[v][0] / d) * Math.min(d, t); P[v][1] += (D[v][1] / d) * Math.min(d, t);
      }
      t = Math.max(1, t * 0.975);
    }
    // normalise into the box
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let v = 1; v <= n; v++) { x0 = Math.min(x0, P[v][0]); y0 = Math.min(y0, P[v][1]); x1 = Math.max(x1, P[v][0]); y1 = Math.max(y1, P[v][1]); }
    const sx = (x1 - x0) || 1, sy = (y1 - y0) || 1;
    const sc = Math.min(W / sx, H / sy, 1.6);
    for (let v = 1; v <= n; v++) g.pos[v] = [Math.round((P[v][0] - x0) * sc), Math.round((P[v][1] - y0) * sc)];
    return g.pos;
  },
  /** Layered layout for a forest given parent array (par[root] = 0 or root). Returns pos array 1..n. */
  forest(n, par, opts = {}) {
    const dx = opts.dx || 70, dy = opts.dy || 80, verts = opts.vertices || Array.from({ length: n }, (_, i) => i + 1);
    const kids = {};
    const roots = [];
    for (const v of verts) {
      const p = par[v];
      if (!p || p === v) roots.push(v);
      else (kids[p] = kids[p] || []).push(v);
    }
    for (const k in kids) kids[k].sort((a, b) => a - b);
    roots.sort((a, b) => a - b);
    const pos = [null];
    let leaf = 0;
    const place = (v, d) => {
      const ch = kids[v] || [];
      if (!ch.length) { pos[v] = [leaf * dx, d * dy]; leaf++; return; }
      for (const c of ch) place(c, d + 1);
      pos[v] = [(pos[ch[0]][0] + pos[ch[ch.length - 1]][0]) / 2, d * dy];
    };
    roots.forEach((r) => { place(r, 0); leaf += 0.5; });
    return pos;
  },
  /** Root a tree/graph via BFS from root and lay it out in layers (uses adjacency order). */
  tree(g, root = 1, opts = {}) {
    const adj = GV.buildAdj({ ...g, directed: false });
    const par = Array(g.n + 1).fill(0);
    const seen = Array(g.n + 1).fill(false);
    const order = [];
    const roots = [root, ...Array.from({ length: g.n }, (_, i) => i + 1).filter((v) => v !== root)];
    for (const r of roots) {
      if (seen[r]) continue;
      seen[r] = true; par[r] = 0;
      const q = [r];
      while (q.length) { const u = q.shift(); order.push(u); for (const { v } of adj[u]) if (!seen[v]) { seen[v] = true; par[v] = u; q.push(v); } }
    }
    return GV.layout.forest(g.n, par, opts);
  },
};

/* ---------------- recorder (frame builder) ---------------- */
/*
  const R = GV.recorder();
  R.node(v,'cur').label(v,'d=0').edge(e,'tree').adj(u,i).line(7)
   .panel('q', {type:'queue', title:'queue', items:[1,2]}).snap('message');

GV.recorder = function () {

  const frames = [];
  const R = {
    frames, state: st,
    node(v, s) { (st.nodes[v] = st.nodes[v] || {}).s = s; return R; },
    label(v, t) { (st.nodes[v] = st.nodes[v] || {}).label = t == null ? undefined : String(t); return R; },
    top(v, t) { (st.nodes[v] = st.nodes[v] || {}).top = t == null ? undefined : String(t); return R; },
    ring(v, on = true) { (st.nodes[v] = st.nodes[v] || {}).ring = on; return R; },
    getNode(v) { return (st.nodes[v] || {}).s || 'idle'; },
    edge(e, s) { if (s == null) delete st.edges[e]; else st.edges[e] = s; return R; },
    getEdge(e) { return st.edges[e] || 'idle'; },
    edgeLabel(e, t) { (st.edgeLabels = st.edgeLabels || {})[e] = t; return R; },
    adj(u, i = -1, done) { st.adj = u == null ? null : { u, i, done: done || [] }; return R; },
    adjList(obj) { st.adjList = obj; return R; },
    panel(key, obj) { if (obj == null) st.panels.delete(key); else st.panels.set(key, obj); return R; },
    line(l) { st.line = l; return R; },
    extra(x) { st.extra = x; return R; },
    clearNodes() { st.nodes = {}; return R; },
    clearEdges() { st.edges = {}; return R; },
    snap(msg) {
      frames.push(clone({ nodes: st.nodes, edges: st.edges, edgeLabels: st.edgeLabels || null, adj: st.adj, adjList: st.adjList, panels: [...st.panels.values()], line: st.line, extra: st.extra, msg: msg || '' }));

    },

  return R;
};

/* ---------------- graph drawing ---------------- */
const FILLED = new Set(['frontier', 'cur', 'visited', 'done', 'gray', 'path', 'bad', 'side0', 'side1', 'c0', 'c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7']);
GV.isFilled = (st) => FILLED.has(st);

/**
 * Draw graph g into an <svg>. frame: {nodes:{v:{s,label,top,ring}}, edges:{e:state}, edgeLabels:{e:text}}
 * opts: { r, selected, edgeLabel:(e,i)=>string|null, hideWeights, pad, fixedViewBox:[x,y,w,h] }
 */
GV.drawGraph = function (svg, g, frame, opts = {}) {
  frame = frame || {};
  const R = opts.r || 18;
  while (svg.firstChild) svg.firstChild.remove();
  const nodes = frame.nodes || {}, est = frame.edges || {}, elab = frame.edgeLabels || {};
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let v = 1; v <= g.n; v++) {
    const p = g.pos[v];
    if (!p) continue;
    x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]);
  }
  if (x0 === Infinity) { x0 = y0 = 0; x1 = y1 = 100; }
  const pad = opts.pad || 46;
  const vb = opts.fixedViewBox || [x0 - pad, y0 - pad, Math.max(x1 - x0 + 2 * pad, 160), Math.max(y1 - y0 + 2 * pad, 120)];
  svg.setAttribute('viewBox', vb.join(' '));

  const gE = s('g', { class: 'edges' }), gH = s('g', { class: 'ehits' }), gL = s('g', { class: 'elabels' }), gN = s('g', { class: 'nodes' });
  const pairCount = {}, pairIdx = {};

  g.edges.forEach((e) => (pairCount[pk(e)] = (pairCount[pk(e)] || 0) + 1));
  g.edges.forEach((e, i) => {
    const pu = g.pos[e.u], pv = g.pos[e.v];

    if (st === 'hidden') return;

    if (e.u === e.v) {
      const [x, y] = pu;
      d = `M${x - 9},${y - R + 3} C${x - 34},${y - 66} ${x + 34},${y - 66} ${x + 9},${y - R + 3}`;
      lx = x; ly = y - 58;

    } else {
      const k = pk(e), idx = (pairIdx[k] = (pairIdx[k] || 0) + 1) - 1, cnt = pairCount[k];
      const a = e.u < e.v ? pu : pv, b = e.u < e.v ? pv : pu;

      const mx = (pu[0] + pv[0]) / 2 + nx * bend * 2, my = (pu[1] + pv[1]) / 2 + ny * bend * 2;

      const sx = pu[0] + t0[0] * R, sy = pu[1] + t0[1] * R;
      let ex = pv[0] - t1[0] * R, ey = pv[1] - t1[1] * R;
      if (g.directed) { ax = arrowAt([ex - t1[0] * 10, ey - t1[1] * 10], [ex, ey]); ex -= t1[0] * 8; ey -= t1[1] * 8; }
      d = bend ? `M${sx},${sy} Q${mx},${my} ${ex},${ey}` : `M${sx},${sy} L${ex},${ey}`;
      lx = bend ? 0.25 * pu[0] + 0.5 * mx + 0.25 * pv[0] : (pu[0] + pv[0]) / 2;
      ly = bend ? 0.25 * pu[1] + 0.5 * my + 0.25 * pv[1] : (pu[1] + pv[1]) / 2;
    }
    gE.append(s('path', { d, class: 'edge ' + cls, 'data-e': i }));
    if (ax) gE.append(s('polygon', { points: ax, class: 'arrow ' + cls }));
    gH.append(s('path', { d, class: 'ehit', 'data-e': i }));
    let text = elab[i] != null ? elab[i] : opts.edgeLabel ? opts.edgeLabel(e, i) : g.weighted && !opts.hideWeights ? String(e.w) : null;
    if (text != null && text !== '') {
      text = String(text);
      const w = text.length * 7.8 + 10;
      gL.append(s('g', { class: 'elabel' + (st === 'cur' || st === 'relax' ? ' hot' : ''), transform: `translate(${lx},${ly})` },
        s('rect', { x: -w / 2, y: -10, width: w, height: 20, rx: 5 }), s('text', { x: 0, y: 0.5 }, text)));
    }
  });
  for (let v = 1; v <= g.n; v++) {
    const p = g.pos[v];
    if (!p) continue;
    const nd = nodes[v] || {};
    const st = nd.s || 'idle';
    if (st === 'hidden') continue;
    const grp = s('g', { class: 'vg' + (GV.isFilled(st) ? ' filled' : '') + (opts.selected === v ? ' sel' : ''), transform: `translate(${p[0]},${p[1]})`, 'data-v': v });
    if (nd.ring) grp.append(s('circle', { r: R + 6, class: 'ring' }));
    grp.append(s('circle', { r: R, class: 'node st-' + st }));
    grp.append(s('text', { class: 'nid', y: 0.5 }, opts.nodeText ? opts.nodeText(v) : v));
    if (nd.label != null && nd.label !== '') grp.append(s('text', { class: 'nlab', y: R + 14 }, nd.label));
    if (nd.top != null && nd.top !== '') grp.append(s('text', { class: 'ntop', y: -R - 12 }, nd.top));
    gN.append(grp);
  }
  svg.append(gE, gH, gL, gN);

};

/* ---------------- adjacency list panel ---------------- */
GV.renderAdj = function (el, g, adj, frame) {
  el.innerHTML = '';
  frame = frame || {};
  const custom = frame.adjList;
  const nodes = frame.nodes || {};
  const hiU = frame.adj ? frame.adj.u : null, hiI = frame.adj ? frame.adj.i : -1, done = frame.adj && frame.adj.done ? frame.adj.done : [];
  let rows;
  if (custom) {
    if (custom.note) el.append(h('div', { class: 'adj-sub', html: custom.note }));
    rows = custom.rows;
  } else rows = adj.slice(1).map((l, i) => ({ u: i + 1, items: l.map((x) => ({ v: x.v, w: x.w })) }));
  for (const r of rows) {
    const st = r.s || (nodes[r.u] || {}).s || 'idle';
    const uChip = h('span', { class: 'adj-u' + (GV.isFilled(st) ? ' filled sw-' + st : st === 'dim' ? ' sw-dim' : '') }, r.label != null ? r.label : r.u);
    const items = h('span', { class: 'adj-items' });
    const isHi = hiU != null && String(r.u) === String(hiU);
    if (!r.items.length) items.append(h('span', { class: 'adj-empty' }, 'empty'));
    r.items.forEach((it, i) => {
      const o = typeof it === 'object' ? it : { v: it };
      const cls = 'adj-it' + (isHi && i === hiI ? ' hi' : '') + (isHi && (i < hiI && frame.adj.dim !== false) && hiI >= 0 ? '' : '') + (isHi && done.includes(i) ? ' done' : '') + (o.s ? ' sw-' + o.s : '');
      const label = o.t != null ? o.t : o.v;
      items.append(h('span', { class: cls }, label, (g.weighted && o.w != null && o.t == null && !custom) || (custom && o.w != null) ? h('small', null, ',' + o.w) : null));
    });
    el.append(h('div', { class: 'adj-row' + (isHi ? ' hi' : ''), 'data-u': r.u }, uChip, h('span', { class: 'adj-arrow' }, ':'), items));
  }
  const hiRow = el.querySelector('.adj-row.hi');
  if (hiRow) {
    const top = hiRow.offsetTop - el.offsetTop, bot = top + hiRow.offsetHeight;
    if (top < el.scrollTop || bot > el.scrollTop + el.clientHeight) el.scrollTop = Math.max(0, top - el.clientHeight / 2);

};

/* ---------------- state panels ---------------- */

  {type:'array', title, start:1, values:[...], hi:[index into values], chg:[index], cellState:{index:'visited'}, note}
  {type:'table', title, head:[...], rows:[[...]], hi:[rowIndex]}

/* ---------------- C++ highlighting ---------------- */
const KW = /\b(for|while|if|else|return|continue|break|do|switch|case|default|using|namespace|struct|const|static|auto|new|delete|true|false|nullptr|sizeof|template|typename|class|public|private|operator)\b/;
const TY = /\b(int|long|void|bool|char|double|float|unsigned|vector|queue|deque|stack|priority_queue|pair|array|set|map|multiset|string|greater|less|tuple|size_t|ll)\b/;
GV.highlightCpp = function (line) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(^\s*#\s*\w+.*$)|(\b\d+(?:\.\d+)?(?:e\d+)?[LlUu]*\b)|(\b[A-Za-z_]\w*\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(line))) {
    out += GV.esc(line.slice(last, m.index));
    const t = GV.esc(m[0]);
    if (m[1]) out += '<span class="tk-com">' + t + '</span>';
    else if (m[2]) out += '<span class="tk-str">' + t + '</span>';
    else if (m[3]) out += '<span class="tk-pp">' + t + '</span>';
    else if (m[4]) out += '<span class="tk-num">' + t + '</span>';
    else if (KW.test(m[0]) && m[0].match(KW)[0] === m[0]) out += '<span class="tk-kw">' + t + '</span>';
    else if (TY.test(m[0]) && m[0].match(TY)[0] === m[0]) out += '<span class="tk-ty">' + t + '</span>';
    else out += t;
    last = m.index + m[0].length;
  }
  return out + GV.esc(line.slice(last));
};

/* ---------------- topic registry ---------------- */
GV.registerTopic = function (t) {

  t.input = t.input || 'graph';

function recompute(keepIdx) {

  const comp = Array(n + 1).fill(0);
  let c = 0;
  for (let s = 1; s <= n; s++) {
    if (comp[s]) continue;
    c++; const st = [s]; comp[s] = c;
    while (st.length) { const u = st.pop(); for (const { v } of und[u]) if (!comp[v]) { comp[v] = c; st.push(v); } }
  }
  // bipartite (undirected view)
  const col = Array(n + 1).fill(-1);
  let bip = true;
  for (let s = 1; s <= n && bip; s++) {
    if (col[s] !== -1) continue;
    col[s] = 0; const q = [s];
    while (q.length && bip) { const u = q.shift(); for (const { v } of und[u]) { if (col[v] === -1) { col[v] = col[u] ^ 1; q.push(v); } else if (col[v] === col[u]) bip = false; } }
  }
  // cycle
  let cyc = false;
  if (g.directed) {
    const indeg = Array(n + 1).fill(0);
    g.edges.forEach((e) => indeg[e.v]++);
    const q = []; for (let v = 1; v <= n; v++) if (!indeg[v]) q.push(v);
    let seen = 0;
    while (q.length) { const u = q.shift(); seen++; for (const { v } of adj[u]) if (--indeg[v] === 0) q.push(v); }
    cyc = seen < n;
  } else {
    cyc = g.edges.length > n - c || g.edges.some((e) => e.u === e.v);
  }
  const tree = !g.directed && c === 1 && g.edges.length === n - 1;
  return { comps: c, bip, cyc, tree };
}

  notes: `

<tr><td>Loop over neighbours</td><td>O(deg u)</td><td>O(n)</td><td>O(m)</td></tr></table>
<p>Use the adjacency list ninety percent of the time. A matrix only when n ≤ ~500 or for Floyd–Warshall. An edge list for Kruskal and Bellman–Ford.</p>
<h4>Things to point at while stepping</h4>
<ul>
<li>An undirected edge is stored <b>twice</b>: in <code>adj[u]</code> and in <code>adj[v]</code>. Toggle <em>Directed</em> and the second push disappears. Forgetting that line is the most common bug in the course.</li>
<li>Sum of list sizes = 2m (undirected) or m (directed). That is why traversals are O(n + m).</li>

  problems: [
    { id: '1702E', name: 'Split Into Two Sets', note: 'model as a graph first' },

  ],
  run({ g, adj }) {
    const R = GV.recorder();

    const deg = Array(n + 1).fill(0), indeg = Array(n + 1).fill(0);

    const labels = Array.from({ length: n }, (_, i) => i + 1);

    R.line(8).snap(`Read <code>n = ${n}</code>, <code>m = ${g.edges.length}</code>. Every list starts empty.`);
    g.edges.forEach((e, i) => {
      for (let j = 0; j < i; j++) R.edge(j, 'tree');
      R.edge(i, 'cur');
      R.clearNodes(); for (let v = 1; v <= n; v++) if (lists[v].length) R.node(v, 'visited');
      R.node(e.u, 'cur').node(e.v, 'cur');
      lists.forEach((l) => l.forEach((x) => delete x.s));
      lists[e.u].push({ v: e.v, w: e.w, s: 'cur' });
      deg[e.u]++; indeg[e.v]++;
      mat[e.u - 1][e.v - 1] = g.weighted ? e.w : 1;
      let chg = [e.u - 1];
      if (!g.directed && e.u !== e.v) { lists[e.v].push({ v: e.u, w: e.w, s: 'cur' }); deg[e.v]++; mat[e.v - 1][e.u - 1] = g.weighted ? e.w : 1; chg.push(e.v - 1); }

    R.adjList(null);
    panels(null);
    const p = properties(g, adj);
    const total = adj.reduce((a, l) => a + l.length, 0);
    R.panel('props', { type: 'table', title: 'properties', head: ['property', 'value'], rows: [
      ['n, m', `${n}, ${g.edges.length}`],
      ['Σ |adj[u]|', `${total} ${g.directed ? '= m' : '= 2m'}`],
      [g.directed ? 'weakly connected parts' : 'connected components', p.comps],
      ['has a cycle', p.cyc ? 'yes' : 'no'],
      ['bipartite', g.directed ? '—' : p.bip ? 'yes' : 'no (odd cycle)'],
      [g.directed ? 'is a DAG' : 'is a tree', g.directed ? (p.cyc ? 'no' : 'yes') : p.tree ? 'yes' : 'no'],
    ] });
    R.line([16, 17]).snap(`This is the full adjacency list: <b>${total}</b> entries in total (${g.directed ? 'm, one per directed edge' : '2m, every undirected edge is stored twice'}). Press play to watch it being built one input edge at a time.`);
    return R.frames;
  },
});
})();
