<script>/* 10-dfs.js */
/* Part 3: Depth First Search — recursive (call stack, tin/tout, tree vs non-tree edges) and iterative (explicit stack). */
(function () {
const GV = window.GV;
const CAP = 560;
// categorical colours, red/orange last so they do not look like 'running now' / 'on the stack'
const PAL = ['c0', 'c2', 'c5', 'c6', 'c7', 'c4', 'c3', 'c1']; // above this many frames, only the important steps are recorded

/* Build a code listing from lines; [tag, text] lines get their 1-based number stored in L[tag]. */
function listing(lines) {
  const L = {}, out = [];
  for (const l of lines) {
    if (l == null || l === false) continue;
    if (Array.isArray(l)) { L[l[0]] = out.length + 1; out.push(l[1]); } else out.push(l);
  }
  return { text: out.join('\n'), L };
}

function recCode(o) {
  return listing([
    'const int N = 200005;',
    'vector<int> adj[N];',
    'bool vis[N];',
    'int timer = 0, tin[N], tout[N];',
    '',
    ['fn', 'void dfs(int u) {'],
    ['vis', '    vis[u] = true;            // mark on ENTRY'],
    ['tin', '    tin[u] = timer++;         // preorder position'],
    ['for', '    for (int v : adj[u]) {'],
    ['if', '        if (!vis[v]) {'],
    ['call', '            dfs(v);           // tree edge u - v'],
    '        }                     // else: visited, skip',
    '    }',
    ['tout', '    tout[u] = timer++;        // postorder position'],
    '}',
    '',
    'int main() {',
    '    // read n, m and the edges, sort every adj[u]',
    ['main', '    dfs(s);                   // explores ONE component'],
    o.cover && ['loop', '    for (int i = 1; i <= n; i++)'],
    o.cover && ['lcall', '        if (!vis[i]) dfs(i);  // next component'],
    '}',
  ]);
}
function itCode(o) {
  return listing([
    'vector<int> adj[N];',
    'bool vis[N];',
    '',
    'void dfsIterative(int s) {',
    '    stack<int> st;',
    ['push0', '    st.push(s);'],
    '',
    ['while', '    while (!st.empty()) {'],
    ['top', '        int u = st.top();'],
    ['pop', '        st.pop();'],
    '',
    ['cont', '        if (vis[u]) continue;     // may have been pushed several times'],
    ['vis', '        vis[u] = true;'],
    '',
    ['for', '        for (int v : adj[u])'],
    ['if', '            if (!vis[v])'],
    ['push', '                st.push(v);'],
    '    }',
    '}',
    '',
    'int main() {',
    ['main', '    dfsIterative(s);'],
    o.cover && ['loop', '    for (int i = 1; i <= n; i++)'],
    o.cover && ['lcall', '        if (!vis[i]) dfsIterative(i);'],
    '}',
  ]);
}
const codeOf = (o) => (o.mode === 'it' ? itCode(o) : recCode(o));

/* layered layout of the DFS forest, children in discovery order */
function treeLayout(n, par, ord) {
  const kids = {}, roots = [];
  for (const v of ord) { if (!par[v]) roots.push(v); else (kids[par[v]] = kids[par[v]] || []).push(v); }
  const pos = Array(n + 1).fill(null);
  let leaf = 0;
  const place = (v, d) => {
    const ch = kids[v] || [];
    if (!ch.length) { pos[v] = [leaf * 74, d * 78]; leaf++; return; }
    ch.forEach((c) => place(c, d + 1));
    pos[v] = [(pos[ch[0]][0] + pos[ch[ch.length - 1]][0]) / 2, d * 78];
  };
  roots.forEach((r) => { place(r, 0); leaf += 0.5; });
  return pos;
}

const ed = (g, e) => (g.directed ? `${g.edges[e].u} → ${g.edges[e].v}` : `${g.edges[e].u}–${g.edges[e].v}`);
const KIND = { tree: 'tree', back: 'back', cross: 'cross', fwd: 'cross' };
GV.addStyle('.dfs-tree .nlab { text-anchor: start; }');

GV.registerTopic({
  id: 'dfs', part: 3, order: 0,
  title: 'Depth First Search',
  blurb: 'Go as deep as you can, back up only when stuck. <code>vis[]</code> makes every vertex enter once, the clock gives entry/exit times <code>tin/tout</code>, and the calls form the DFS tree.',
  complexity: 'O(n + m)',
  chips: ['vis[] on entry', 'tin / tout', 'DFS tree'],
  graph: { preset: 'G1', directed: 'any', weighted: false },
  allowSelfLoops: true,
  options: [
    { id: 'src', type: 'vertex', label: 'Start', default: 1 },
    { id: 'mode', type: 'select', label: 'Version', default: 'rec', choices: [['rec', 'Recursive'], ['it', 'Iterative (stack)']] },
    { id: 'cover', type: 'check', label: 'Cover whole graph', default: false, title: 'After dfs(s), loop i = 1..n and start a new DFS at every unvisited vertex' },
  ],
  legend: [['cur', 'running now'], ['gray', 'on the call stack'], ['done', 'finished (tout set)'], ['frontier', 'pushed (iterative)'], ['visited', 'visited (iterative)'],
    ['e:tree', 'tree edge'], ['e:back', 'back edge'], ['e:cross', 'forward / cross (directed)'], ['e:skip', 'stale stack entry']],
  code: (o) => codeOf(o).text,
  extraTitle: 'DFS tree (tree edges solid, non-tree edges dashed)',
  renderExtra(frame, el) {
    el.innerHTML = '';
    const x = frame.extra;
    if (!x || !x.ord.length) { el.append(GV.h('p', { class: 'hint' }, 'The tree grows here: every time dfs(u) calls dfs(v), u becomes the parent of v.')); return; }
    const pos = treeLayout(x.n, x.par, x.ord);
    const edges = [], est = {};
    x.ord.forEach((v) => { if (x.par[v]) { est[edges.length] = 'tree'; edges.push({ u: x.par[v], v, w: 1 }); } });
    // non-tree edges: add a hidden twin so drawGraph bends the visible one away from the tree edges
    x.nt.forEach(([u, v, k]) => { est[edges.length] = KIND[k] || 'back'; edges.push({ u, v, w: 1 }); est[edges.length] = 'hidden'; edges.push({ u, v, w: 1 }); });
    const g2 = { n: x.n, directed: x.directed, weighted: false, pos, edges };
    const svg = GV.s('svg', { class: 'gsvg dfs-tree' });
    el.append(svg);
    GV.drawGraph(svg, g2, { nodes: frame.nodes, edges: est }, { r: 16, pad: 44 });
    // tin/tout to the right of each vertex, so they do not sit on the vertical tree edges
    svg.querySelectorAll('.nlab').forEach((t) => { t.setAttribute('x', 21); t.setAttribute('y', 9); });
  },
  notes: `
<h4>Key idea</h4>
<p>Same as DFS on a tree, with two changes: a vertex has any number of neighbours (the two recursive calls become a <code>for</code> loop over <code>adj[u]</code>),
and a graph can have cycles, so we need <code>vis[]</code>. <code>vis[]</code> turns "explore every path" (exponential, even on a DAG) into "enter every vertex once".</p>
<p><b>Why O(n + m), not O(n·m):</b> each vertex is entered once; when <code>u</code> is entered the loop runs <code>deg(u)</code> times, and Σ deg(u) = 2m (undirected) or m (directed).</p>
<h4>Things to point at while stepping</h4>
<ul>
<li>Dry run on G1 from 1: order <b>1 2 3 6 4 5</b>; tin = 0 1 2 3 6 7 and tout = 11 10 5 4 9 8 for vertices 1 2 3 6 4 5. Vertices 7 and 8 are never reached: one DFS explores one component.</li>
<li>The order depends on the adjacency order. Listing edge 1–4 before 1–2 would give 1 4 2 3 6 5. Both are valid DFS orders.</li>
<li><b>Undirected:</b> every non-tree edge goes to an ancestor (a <em>back edge</em>), never sideways. On G1: 1–4 and 2–5. <b>Directed:</b> back (to an ancestor still on the stack), forward (to a finished descendant) and cross (to a finished vertex elsewhere). Only back edges mean a cycle (Part 6).</li>
<li>Brackets: tin/tout nest like <code>1[ 2[ 3[ 6[ ] ] 4[ 5[ ] ] ] ]</code>. <b>u is an ancestor of v ⇔ tin[u] ≤ tin[v] and tout[v] ≤ tout[u]</b>, an O(1) test used for Euler tours (Part 12) and bridges (Part 13).</li>
<li>Iterative version: a vertex can be pushed several times, so <code>if (vis[u]) continue;</code> after popping is required; the stack reverses the neighbour order (G1 gives 1 4 5 2 3 6), and it cannot do postorder work.</li>
</ul>
<h4>Common mistakes</h4>
<ul>
<li>Marking <code>vis[u]</code> after the loop instead of before it: infinite recursion.</li>
<li>Only running DFS from vertex 1: misses every other component. Use the <code>for i = 1..n if (!vis[i]) dfs(i)</code> loop.</li>
<li>Not resetting <code>vis</code> between test cases, or resetting all 200005 entries every test (TLE).</li>
<li>Believing DFS gives shortest paths. It does not: that is BFS.</li>
<li>Declaring a big local array inside the recursive function: stack overflow. A path of 2·10⁵ vertices means 2·10⁵ nested calls; for n up to 10⁶ write the iterative version.</li>
<li>Iterative: forgetting <code>if (vis[u]) continue;</code> after popping.</li>
</ul>
<h4>Check yourself</h4>
<ol>
<li>Give the DFS order of G1 starting from vertex 2, with sorted adjacency lists. (Set Start = 2 and check.)</li>
<li>What exactly goes wrong if you set <code>vis[u] = true</code> after the neighbour loop?</li>
<li>In an undirected graph, why can a non-tree DFS edge only go to an ancestor?</li>
<li>Using tin and tout, how do you check in O(1) whether u is an ancestor of v?</li>
<li>Your DFS passes the samples and gets a runtime error on test 12 with n = 200000. Name two likely causes.</li>
</ol>`,
  problems: [
    { id: '977E', name: 'Cyclic Components', note: 'DFS each component, check every degree is 2' },
    { id: '580C', name: 'Kefa and Park', note: 'DFS on a tree with a running counter of consecutive cats' },
    { id: '377A', name: 'Maze', note: 'grid DFS with a counting twist: stop after s − k cells' },
  ],
  run(ctx) { return ctx.opts.mode === 'it' ? runIt(ctx) : runRec(ctx); },
});

/* ---------------- recursive ---------------- */
function runRec({ g, adj, opts }) {
  const R = GV.recorder();
  const n = g.n, s = opts.src, cover = !!opts.cover;
  const { L } = recCode(opts);
  const vis = Array(n + 1).fill(false), tin = Array(n + 1).fill(null), tout = Array(n + 1).fill(null);
  const par = Array(n + 1).fill(0), parE = Array(n + 1).fill(-1), comp = Array(n + 1).fill(0);
  const ek = {}; // edge index -> kind
  const nt = []; // non-tree edges [u, v, kind] in discovery order
  const order = [], stack = [], br = [];
  let timer = 0, ncomp = 0;
  let capNote = false;
  const snap = (msg, important) => {
    if (!important && R.frames.length >= CAP) { capNote = true; return; }
    if (capNote) { msg = '<i>(Large graph: minor "skip" steps are no longer shown.)</i> ' + msg; capNote = false; }
    R.snap(msg);
  };
  const panels = (chg = {}) => {
    R.panel('stk', { type: 'stack', title: 'call stack', note: stack.length ? 'depth ' + stack.length : 'empty', items: stack.map((u, i) => ({ t: `dfs(${u})`, s: i === stack.length - 1 ? 'cur' : 'gray' })) });
    R.panel('vis', { type: 'array', title: 'vis[]', values: vis.slice(1).map((b) => (b ? 1 : 0)), chg: chg.vis ? [chg.vis - 1] : [] });
    R.panel('tin', { type: 'array', title: 'tin[]', note: 'timer = ' + timer, values: tin.slice(1), chg: chg.tin ? [chg.tin - 1] : [] });
    R.panel('tout', { type: 'array', title: 'tout[]', values: tout.slice(1), chg: chg.tout ? [chg.tout - 1] : [] });
    R.panel('ord', { type: 'list', title: 'visit order', note: 'preorder', items: order.map((v, i) => ({ t: v, s: i === order.length - 1 && chg.vis ? 'cur' : undefined })) });
    R.extra({ n, directed: g.directed, par: par.slice(), ord: order.slice(), nt: nt.slice() });
  };
  const nodeLab = (v) => R.label(v, tin[v] == null ? null : tin[v] + '/' + (tout[v] == null ? '·' : tout[v]));
  const recolorStack = () => stack.forEach((u, i) => R.node(u, i === stack.length - 1 ? 'cur' : 'gray'));

  function dfs(u, from, e) {
    vis[u] = true; tin[u] = timer++; par[u] = from; parE[u] = e; comp[u] = ncomp;
    order.push(u); stack.push(u); br.push(u + '[');
    recolorStack(); nodeLab(u);
    R.adj(u, -1); R.line([L.vis, L.tin]); panels({ vis: u, tin: u });
    const lst = adj[u].map((x) => x.v).join(' ');
    snap(`Enter <code>dfs(${u})</code>${from ? ` (called from ${from})` : ''}: <code>vis[${u}] = true</code>, <code>tin[${u}] = ${tin[u]}</code>. ` +
      (adj[u].length ? `Now scan <code>adj[${u}] = {${lst}}</code>.` : `<code>adj[${u}]</code> is empty, nothing to scan.`), true);
    let back = false;
    adj[u].forEach(({ v, e: ei }, i) => {
      const done = Array.from({ length: i }, (_, j) => j);
      R.adj(u, i, done);
      const prevE = R.getEdge(ei);
      R.edge(ei, 'cur').ring(v);
      const pre = back ? `Back in <code>dfs(${u})</code>. ` : '';
      back = false;
      if (!vis[v]) {
        R.line([L.if, L.call]); panels();
        snap(`${pre}Look at ${v} (neighbour ${i + 1} of ${adj[u].length}): <code>vis[${v}] = false</code>, not visited → call <code>dfs(${v})</code>. Edge ${ed(g, ei)} becomes a <b>tree edge</b>.`, true);
        R.ring(v, false); R.edge(ei, 'tree'); ek[ei] = 'tree';
        dfs(v, u, ei);
        // returned from v
        recolorStack(); nodeLab(u);
        back = true;
      } else {
        let why, kind = null;
        if (!g.directed && ei === parE[u]) why = `${v} is the parent: ${ed(g, ei)} is the tree edge we just came along`;
        else if (v === u) { why = `a self-loop: ${u} is on the stack (it is us) → <b>back edge</b>`; kind = 'back'; }
        else if (R.getNode(v) === 'gray' || R.getNode(v) === 'cur') { why = `${v} is an ancestor still on the call stack → ${ed(g, ei)} is a <b>back edge</b>`; kind = 'back'; }
        else if (!g.directed) why = `${v} is already finished (a descendant of ${u}); this edge was already met from ${v}'s side as a back edge`;
        else if (tin[v] > tin[u]) { why = `${v} is a finished descendant of ${u} → <b>forward edge</b>`; kind = 'fwd'; }
        else { why = `${v} finished earlier in another branch → <b>cross edge</b>`; kind = 'cross'; }
        R.line(L.if); panels();
        snap(`${pre}Look at ${v} (neighbour ${i + 1} of ${adj[u].length}): <code>vis[${v}] = true</code>, skip. ${why}.`);
        R.ring(v, false);
        if (kind && !ek[ei]) { ek[ei] = kind; nt.push([u, v, kind, ei]); }
        R.edge(ei, ek[ei] ? KIND[ek[ei]] : prevE === 'cur' ? null : prevE);
        if (!ek[ei] && prevE === 'idle') R.edge(ei, null);
      }
    });
    tout[u] = timer++; stack.pop(); br.push(']');
    R.node(u, 'done'); nodeLab(u); recolorStack();
    R.adj(u, -1, adj[u].map((_, j) => j)); R.line(L.tout); panels({ tout: u });
    snap(`${back ? `Back in <code>dfs(${u})</code>: n` : 'N'}o neighbours left. <code>tout[${u}] = ${tout[u]}</code>, ${u} is finished. ` +
      (stack.length ? `Return to <code>dfs(${stack[stack.length - 1]})</code>.` : `The stack is empty: this DFS is over.`), true);
  }

  R.line(L.main); panels();
  snap(`n = ${n}, m = ${g.edges.length}. All <code>vis[] = false</code>, <code>timer = 0</code>. Call <code>dfs(${s})</code>.`, true);
  ncomp = 1;
  dfs(s, 0, -1);
  if (cover) {
    for (let i = 1; i <= n; i++) {
      if (vis[i]) continue;
      // colour the finished components
      for (let v = 1; v <= n; v++) if (comp[v]) R.node(v, PAL[(comp[v] - 1) % 8]);
      ncomp++;
      R.adj(null); R.line([L.loop, L.lcall]); panels();
      snap(`Back in <code>main</code>. The loop skips every visited i; <b>i = ${i}</b> is the first with <code>vis[${i}] = false</code> → <code>dfs(${i})</code> starts component #${ncomp}. (Finished components are coloured.)`, true);
      dfs(i, 0, -1);
    }
    for (let v = 1; v <= n; v++) if (comp[v]) R.node(v, PAL[(comp[v] - 1) % 8]);
  }
  // summary
  R.adj(null); R.line(cover ? [L.loop, L.lcall] : L.main);
  panels();
  R.panel('stk', null).panel('vis', null);
  const unreached = [];
  for (let v = 1; v <= n; v++) if (!vis[v]) unreached.push(v);
  R.panel('res', { type: 'table', title: 'entry / exit times', note: 'in visit order', head: ['vertex'].concat(order), rows: [['tin'].concat(order.map((v) => tin[v])), ['tout'].concat(order.map((v) => tout[v]))] });
  R.panel('sum', { type: 'text', title: 'result', html:
    `order: <code>${order.join(' ')}</code><br>brackets: <code>${br.join(' ')}</code><br>` +
    `tree edges: ${order.length - (cover ? ncomp : 1)} · non-tree: ${nt.length ? nt.map(([a, b, k, e]) => `${ed(g, e)} (${k === 'fwd' ? 'forward' : k})`).join(', ') : 'none'}` +
    (cover ? `<br>components: ${ncomp}` : '') });
  snap(`Done. DFS order: <b>${order.join(' ')}</b>. ` +
    (cover ? `The outer loop started ${ncomp} DFS${ncomp > 1 ? 's' : ''}, one per component.`
      : unreached.length ? `Vertices ${unreached.join(', ')} were never reached: one DFS explores one component, and nothing more. Tick <em>Cover whole graph</em> to add the outer loop.`
        : `Every vertex was reached from ${s}.`), true);
  return R.frames;
}

/* ---------------- iterative ---------------- */
function runIt({ g, adj, opts }) {
  const R = GV.recorder();
  const n = g.n, s = opts.src, cover = !!opts.cover;
  const { L } = itCode(opts);
  const vis = Array(n + 1).fill(false), par = Array(n + 1).fill(0), comp = Array(n + 1).fill(0);
  const order = [], st = []; // entries {v, from, e}
  const tree = new Set();
  let ncomp = 0;
  let capNote = false;
  const snap = (msg, important) => {
    if (!important && R.frames.length >= CAP) { capNote = true; return; }
    if (capNote) { msg = '<i>(Large graph: minor "skip" steps are no longer shown.)</i> ' + msg; capNote = false; }
    R.snap(msg);
  };
  const panels = (o = {}) => {
    R.panel('stk', { type: 'stack', title: 'stack&lt;int&gt; st', note: st.length + ' entr' + (st.length === 1 ? 'y' : 'ies'), items: st.map((x, i) => ({ t: x.v, s: vis[x.v] ? 'dim' : undefined })), hi: o.pushed ? [st.length - 1] : [] });
    R.panel('vis', { type: 'array', title: 'vis[]', values: vis.slice(1).map((b) => (b ? 1 : 0)), chg: o.vis ? [o.vis - 1] : [] });
    R.panel('ord', { type: 'list', title: 'visit order', items: order.map((v, i) => ({ t: v, s: i === order.length - 1 && o.vis ? 'cur' : undefined })) });
    R.extra({ n, directed: g.directed, par: par.slice(), ord: order.slice(), nt: [] });
  };
  const stackStates = () => { for (const x of st) if (!vis[x.v]) R.node(x.v, 'frontier'); };
  const pendingEdge = (e) => st.some((x) => x.e === e);

  function run1(src) {
    st.push({ v: src, from: 0, e: -1 });
    R.node(src, 'frontier');
    R.adj(null); R.line(L.push0); panels({ pushed: true });
    snap(`<code>st.push(${src})</code>. The stack holds vertices still to visit.`, true);
    let lastU = null;
    while (st.length) {
      const x = st.pop();
      const u = x.v;
      if (lastU != null) R.node(lastU, 'visited');
      if (vis[u]) {
        if (x.e >= 0 && !tree.has(x.e) && !pendingEdge(x.e)) R.edge(x.e, 'skip');
        R.adj(null); R.line([L.top, L.pop, L.cont]); panels();
        snap(`Pop ${u}. <code>vis[${u}]</code> is already true: ${u} was pushed more than once and visited through another entry → <code>continue</code>.`);
        lastU = null;
        continue;
      }
      vis[u] = true; order.push(u); par[u] = x.from; comp[u] = ncomp;
      if (x.e >= 0) { tree.add(x.e); R.edge(x.e, 'tree'); }
      R.node(u, 'cur').label(u, '#' + order.length);
      R.adj(u, -1); R.line([L.top, L.pop, L.cont, L.vis]); panels({ vis: u });
      snap(`Pop ${u}. <code>vis[${u}] = false</code>, so visit it now: <code>vis[${u}] = true</code> (visit #${order.length}${x.from ? `, reached from ${x.from}` : ''}). ` +
        (adj[u].length ? `Push its unvisited neighbours from <code>adj[${u}] = {${adj[u].map((y) => y.v).join(' ')}}</code>.` : `<code>adj[${u}]</code> is empty.`), true);
      adj[u].forEach(({ v, e }, i) => {
        R.adj(u, i, Array.from({ length: i }, (_, j) => j));
        const prev = R.getEdge(e);
        R.edge(e, 'cur').ring(v);
        if (!vis[v]) {
          st.push({ v, from: u, e });
          R.node(v, 'frontier');
          R.line([L.if, L.push]); panels({ pushed: true });
          snap(`Neighbour ${v}: not visited → <code>st.push(${v})</code>. Stack (bottom→top): ${st.map((y) => y.v).join(' ')}.`);
          R.edge(e, tree.has(e) ? 'tree' : 'frontier');
        } else {
          R.line(L.if); panels();
          snap(`Neighbour ${v}: <code>vis[${v}] = true</code> → do not push.`);
          R.edge(e, prev === 'cur' ? null : prev);
          if (prev === 'idle') R.edge(e, null);
        }
        R.ring(v, false);
      });
      lastU = u;
    }
    if (lastU != null) R.node(lastU, 'visited');
    R.adj(null); R.line(L.while); panels();
    snap(`The stack is empty: <code>dfsIterative(${src})</code> is over. Visited so far: ${order.join(' ')}.`, true);
  }

  R.line(L.main); panels();
  snap(`n = ${n}, m = ${g.edges.length}. All <code>vis[] = false</code>. Call <code>dfsIterative(${s})</code>.`, true);
  ncomp = 1;
  run1(s);
  if (cover) {
    for (let i = 1; i <= n; i++) {
      if (vis[i]) continue;
      for (let v = 1; v <= n; v++) if (comp[v]) R.node(v, PAL[(comp[v] - 1) % 8]);
      ncomp++;
      R.line([L.loop, L.lcall]); panels();
      snap(`Back in <code>main</code>: <b>i = ${i}</b> is the first unvisited vertex → <code>dfsIterative(${i})</code> explores component #${ncomp}.`, true);
      run1(i);
    }
    for (let v = 1; v <= n; v++) if (comp[v]) R.node(v, PAL[(comp[v] - 1) % 8]);
  }
  const unreached = [];
  for (let v = 1; v <= n; v++) if (!vis[v]) unreached.push(v);
  R.adj(null); R.line(cover ? [L.loop, L.lcall] : L.main); panels();
  R.panel('sum', { type: 'text', title: 'result', html: `order: <code>${order.join(' ')}</code>` +
    (cover ? `<br>components: ${ncomp}` : unreached.length ? `<br>never reached: ${unreached.join(', ')}` : '') +
    `<br><span class="note">The stack reverses the neighbour order, so this differs from the recursive order (iterate <code>adj[u]</code> backwards to match it). No postorder / tout here.</span>` });
  snap(`Done. Iterative DFS order: <b>${order.join(' ')}</b>. The last neighbour pushed is popped first, so this is not the recursive order. ` +
    (!cover && unreached.length ? `Vertices ${unreached.join(', ')} were not reached (another component).` : ''), true);
  return R.frames;
}
})();

</script>
<script>/* 11-bfs.js */
/* Part 4: Breadth First Search — queue, dist[] / par[], layers, multi-source, every component, path reconstruction. */
(function () {
const GV = window.GV;
const CAP = 560;
// categorical colours, red/orange last so they do not look like 'running now' / 'on the stack'
const PAL = ['c0', 'c2', 'c5', 'c6', 'c7', 'c4', 'c3', 'c1'];

function listing(lines) {
  const L = {}, out = [];
  for (const l of lines) {
    if (l == null || l === false) continue;
    if (Array.isArray(l)) { L[l[0]] = out.length + 1; out.push(l[1]); } else out.push(l);
  }
  return { text: out.join('\n'), L };
}

function bfsCode(o) {
  const multi = o.mode === 'multi';
  return listing([
    'vector<int> adj[N];',
    'int dist[N], par[N];          // dist[v] == -1: not reached yet',
    '',
    multi ? 'void bfs(vector<int> sources) {' : 'void bfs(int s) {',
    '    queue<int> q;',
    multi && '    for (int s : sources) {   // ALL sources start at distance 0',
    ['sdist', multi ? '        dist[s] = 0;' : '    dist[s] = 0;'],
    ['spush', multi ? '        q.push(s);' : '    q.push(s);'],
    multi && '    }',
    ['while', '    while (!q.empty()) {'],
    ['front', '        int u = q.front();'],
    ['pop', '        q.pop();'],
    ['for', '        for (int v : adj[u]) {'],
    ['if', '            if (dist[v] == -1) {      // first time we see v'],
    ['dist', '                dist[v] = dist[u] + 1;'],
    ['par', '                par[v] = u;'],
    ['push', '                q.push(v);'],
    '            }',
    '        }',
    '    }',
    '}',
    '',
    'int main() {',
    '    // read n, m, the edges, s and t',
    ['fill', '    fill(dist, dist + n + 1, -1);'],
    ['call', multi ? '    bfs(sources);' : '    bfs(s);'],
    o.all && ['loop', '    for (int i = 1; i <= n; i++)       // every component'],
    o.all && ['lcall', multi ? '        if (dist[i] == -1) bfs({i});' : '        if (dist[i] == -1) bfs(i);'],
    ['unr', '    if (dist[t] == -1) cout << -1;     // unreachable: always tested'],
    '    else {',
    ['vec', '        vector<int> path;'],
    ['walk', '        for (int cur = t; cur != 0; cur = par[cur])'],
    ['pb', '            path.push_back(cur);'],
    ['rev', '        reverse(path.begin(), path.end());'],
    '    }',
    '}',
  ]);
}

function parseSources(txt, n) {
  const out = [];
  String(txt || '').split(/[\s,;]+/).forEach((x) => { const v = Math.round(+x); if (x !== '' && v >= 1 && v <= n && !out.includes(v)) out.push(v); });
  return out;
}

GV.registerTopic({
  id: 'bfs', part: 4, order: 0,
  title: 'Breadth First Search',
  blurb: 'Finish everything at distance 1, then distance 2, and so on. In an <b>unweighted</b> graph the first time BFS reaches a vertex is along a shortest path, so <code>dist[]</code> is exact and <code>par[]</code> rebuilds the path.',
  complexity: 'O(n + m)',
  chips: ['queue', 'dist at push time', 'par[] path'],
  graph: { preset: 'G1', directed: 'any', weighted: false },
  allowSelfLoops: true,
  options: [
    { id: 'mode', type: 'select', label: 'Sources', default: 'single', choices: [['single', 'Single source'], ['multi', 'Multi-source']] },
    { id: 'src', type: 'vertex', label: 's', default: 1, title: 'Source vertex (single-source mode)' },
    { id: 'srcs', type: 'text', label: 'Multi', default: '1 6', title: 'Sources for multi-source mode, separated by spaces' },
    { id: 'tgt', type: 'number', label: 'Path to t', default: 6, min: 0, title: 'Target vertex for path reconstruction; 0 = none' },
    { id: 'all', type: 'check', label: 'Every component', default: false, title: 'After bfs(s), start a new BFS at every vertex with dist == -1' },
  ],
  legend: [['frontier', 'in the queue'], ['cur', 'popped, scanning'], ['visited', 'processed'], ['src', 'source'], ['path', 'path s → t'], ['e:tree', 'BFS tree edge (par)'], ['e:cur', 'edge being looked at'], ['e:path', 'path edge']],
  code: (o) => bfsCode(o).text,
  notes: `
<h4>Key idea</h4>
<p><b>In an unweighted graph, BFS from s gives the minimum number of edges from s to every other vertex.</b> Memorise it with its condition: <em>unweighted</em>. With different weights BFS is wrong; use Dijkstra (Part 11).</p>
<p><b>Why the layers are shortest distances:</b> layer 0 is {s}. When every vertex at distance k is in the queue and nothing farther, popping them and pushing their unreached neighbours gives exactly the vertices at distance k + 1: not closer (they would have been found earlier), and reachable in k + 1 steps by construction. So the first time BFS reaches a vertex, it reaches it optimally, and that is why <code>dist</code> is set and the vertex marked <b>at push time</b>.</p>
<h4>Things to point at while stepping</h4>
<ul>
<li>G1 from 1: order <b>1 2 4 3 5 6</b>, d[1..6] = <b>0 1 2 1 2 3</b>; d[7], d[8] stay −1 (different component). Compare DFS order 1 2 3 6 4 5: DFS reached 6 second-to-last by diving, BFS reached it last because it is the farthest. DFS orders say nothing about distance.</li>
<li>One array instead of two: <code>dist[v] == -1</code> already means "not visited".</li>
<li>Path: <code>par[6] = 3, par[3] = 2, par[2] = 1</code>, so the path 1 → 6 is 1 2 3 6, of length 3 = dist[6]. <code>par[s] = 0</code> is the stop marker (1-indexing).</li>
<li><b>Multi-source:</b> push all sources with distance 0, then the identical loop. It is BFS from an imaginary super-source joined to every real source, so each vertex gets the distance to its <b>nearest</b> source in one O(n + m) pass, not O(k(n + m)).</li>
<li><b>Every component:</b> <code>for i = 1..n if (dist[i] == -1) bfs(i)</code>. Distances from different components are not comparable, so this pattern is about components, not distances.</li>
</ul>
<h4>Common mistakes</h4>
<ul>
<li>Marking visited when popping instead of when pushing: the same vertex enters the queue many times (TLE on dense graphs, wrong counts).</li>
<li>Using BFS on a weighted graph. BFS counts edges, not weights. The most common conceptual error in shortest path problems.</li>
<li>Forgetting the unreachable case: <code>dist[t] == -1</code> is always in the tests.</li>
<li>Using a <code>vector</code> with <code>erase(begin())</code> as a queue: O(n) per pop.</li>
<li>Recomputing <code>q.size()</code> inside the loop condition in level-by-level processing: snapshot it first.</li>
<li>Running a separate BFS per source when one multi-source BFS does it; pushing the source without setting <code>dist[s] = 0</code>.</li>
</ul>
<h4>BFS or DFS?</h4>
<p>BFS answers "how far" (fewest edges, nearest of several sources, level by level, a chain of 10⁶ vertices). DFS answers "what is the structure" (bridges, SCC, subtree info). Either works for "is there a path", components and cycles.</p>
<h4>Check yourself</h4>
<ol>
<li>State the BFS theorem, including its condition.</li>
<li>Why must <code>dist[v]</code> be set at push time rather than pop time?</li>
<li>Give the BFS distances from vertex 3 in G1. (Set s = 3 and check.)</li>
<li>Why does pushing all sources at the start compute the distance to the nearest source?</li>
<li>A problem has edge weights 1 and 5. Can you still use plain BFS? What would you do instead?</li>
</ol>`,
  problems: [
    { id: '601A', name: 'The Two Routes', note: 'BFS on the graph and on its complement' },
    { id: '1130C', name: 'Connect', note: 'two BFS runs (flood fills) plus a small brute force' },
    { id: '1365D', name: 'Solve The Maze', note: 'multi-source reasoning on a grid: BFS back from the exit' },
    { id: '796D', name: 'Police Stations', note: 'multi-source BFS on a tree' },
  ],
  run({ g, adj, opts }) {
    const R = GV.recorder();
    const n = g.n, multi = opts.mode === 'multi', all = !!opts.all;
    const { L } = bfsCode(opts);
    let sources = multi ? parseSources(opts.srcs, n) : [opts.src];
    let srcNote = '';
    if (!sources.length) { sources = [1]; srcNote = ` (no valid vertex in "${GV.esc(opts.srcs)}", using 1)`; }
    const t = Math.round(+opts.tgt) || 0;
    const hasT = t >= 1 && t <= n;
    const dist = Array(n + 1).fill(-1), par = Array(n + 1).fill(0), parE = Array(n + 1).fill(-1), root = Array(n + 1).fill(0);
    const q = [], order = [], isSrc = new Set();
    let capNote = false;
  const snap = (msg, important) => {
    if (!important && R.frames.length >= CAP) { capNote = true; return; }
    if (capNote) { msg = '<i>(Large graph: minor "skip" steps are no longer shown.)</i> ' + msg; capNote = false; }
    R.snap(msg);
  };
    const layers = () => {
      const by = {};
      for (let v = 1; v <= n; v++) if (dist[v] >= 0) (by[dist[v]] = by[dist[v]] || []).push(v);
      return Object.keys(by).map(Number).sort((a, b) => a - b).map((d) => [d, by[d].join(' ')]);
    };
    const panels = (o = {}) => {
      R.panel('q', { type: 'queue', title: 'queue&lt;int&gt; q', note: q.length ? q.length + ' waiting' : 'empty', items: q.map((v) => ({ t: v, s: 'frontier' })), hi: o.pushed ? [q.length - 1] : [] });
      R.panel('dist', { type: 'array', title: 'dist[]', note: '-1 = unreached', values: dist.slice(1), hi: o.hiD ? [o.hiD - 1] : [], chg: o.chg ? [o.chg - 1] : [] });
      R.panel('par', { type: 'array', title: 'par[]', note: '0 = none / source', values: par.slice(1), hi: o.hiP ? [o.hiP - 1] : [], chg: o.chg ? [o.chg - 1] : [] });
      R.panel('ord', { type: 'list', title: 'BFS order', note: 'pop order', items: order.slice() });
      const ly = layers();
      R.panel('lay', { type: 'text', title: 'layers', note: 'vertices by distance', html: ly.length ? ly.map(([d, vs]) => (d === o.layer ? `<b><code>d=${d}</code> ${vs}</b>` : `<code>d=${d}</code> ${vs}`)).join(' &nbsp;·&nbsp; ') : '—' });
    };
    const settle = (v) => R.node(v, 'visited');

    function bfs(srcs, rt) {
      srcs.forEach((s, i) => {
        dist[s] = 0; par[s] = 0; root[s] = rt; q.push(s); isSrc.add(s);
        R.node(s, 'frontier').label(s, 'd=0').ring(s);
        R.adj(null); R.line([L.sdist, L.spush]); panels({ pushed: true, chg: s, layer: 0 });
        snap(`<code>dist[${s}] = 0</code>, push ${s}${srcs.length > 1 ? ` (source ${i + 1} of ${srcs.length})` : ''}. q = [${q.join(', ')}]. Setting dist before pushing marks ${s} as reached.`, true);
      });
      let prevU = null;
      while (q.length) {
        const u = q.shift();
        order.push(u);
        if (prevU != null) settle(prevU);
        R.node(u, 'cur');
        R.adj(u, -1); R.line([L.front, L.pop]); panels({ hiD: u });
        snap(`Pop ${u} from the front (<code>dist[${u}] = ${dist[u]}</code>). ` +
          (adj[u].length ? `Scan <code>adj[${u}] = {${adj[u].map((x) => x.v).join(' ')}}</code>; every new vertex gets distance ${dist[u] + 1}.` : `<code>adj[${u}]</code> is empty.`) +
          ` q = [${q.join(', ')}].`, true);
        adj[u].forEach(({ v, e }, i) => {
          R.adj(u, i, Array.from({ length: i }, (_, j) => j));
          const prev = R.getEdge(e);
          R.edge(e, 'cur').ring(v);
          if (dist[v] === -1) {
            dist[v] = dist[u] + 1; par[v] = u; parE[v] = e; root[v] = rt; q.push(v);
            R.node(v, 'frontier').label(v, 'd=' + dist[v]);
            R.line([L.if, L.dist, L.par, L.push]); panels({ pushed: true, chg: v, layer: dist[v] });
            snap(`Look at ${v}: <code>dist[${v}] == -1</code>, first time we see it → <code>dist[${v}] = dist[${u}] + 1 = ${dist[v]}</code>, <code>par[${v}] = ${u}</code>, push. q = [${q.join(', ')}].`, true);
            R.edge(e, 'tree');
          } else {
            R.line(L.if); panels({ hiD: v });
            snap(`Look at ${v}: <code>dist[${v}] = ${dist[v]}</code> is already set → skip. ${v === u ? 'A self-loop.' : `${v} was reached earlier, its distance is final.`}`);
            R.edge(e, prev === 'cur' || prev === 'idle' ? null : prev);
          }
          R.ring(v, false);
        });
        prevU = u;
      }
      if (prevU != null) settle(prevU);
      srcs.forEach((s) => R.ring(s, false));
    }

    R.line(L.fill); panels();
    snap(`n = ${n}, m = ${g.edges.length}. <code>fill(dist, -1)</code>: nobody is reached yet. ${multi ? `Sources: ${sources.join(' ')}${srcNote}.` : `Source s = ${sources[0]}.`}`, true);
    R.line(L.call); panels();
    sources.forEach((s) => R.node(s, 'src'));
    snap(multi ? `Call <code>bfs({${sources.join(', ')}})</code>: all sources go into the queue at distance 0, then one ordinary BFS.` : `Call <code>bfs(${sources[0]})</code>.`, true);
    bfs(sources, sources[0]);
    R.adj(null); R.line(L.while); panels();
    const unreached = () => { const u = []; for (let v = 1; v <= n; v++) if (dist[v] === -1) u.push(v); return u; };
    let un = unreached();
    snap(`Queue empty: BFS from ${sources.join(', ')} is over. Visited ${order.length} vertices.` +
      (un.length ? ` d[${un.join('], d[')}] are still −1: not reachable${g.directed ? '' : ', a different component'}.` : ''), true);
    let nb = 1;
    if (all) {
      for (let i = 1; i <= n; i++) {
        if (dist[i] !== -1) continue;
        nb++;
        R.adj(null); R.line([L.loop, L.lcall]); panels({ hiD: i });
        snap(`Back in <code>main</code>: <code>dist[${i}] == -1</code> → start a new BFS from ${i} (BFS #${nb}). Its distances are measured from ${i}, not comparable with the others.`, true);
        bfs([i], i);
      }
      un = unreached();
    }
    // summary: colour by layer
    for (let v = 1; v <= n; v++) {
      if (dist[v] >= 0) R.node(v, PAL[dist[v] % 8]).label(v, 'd=' + dist[v]);
      else R.node(v, 'dim').label(v, 'd=-1');
    }
    R.adj(null); R.line(all ? [L.loop, L.lcall] : L.call); panels();
    snap(`BFS order <b>${order.join(' ')}</b>, dist[1..${n}] = <b>${dist.slice(1).join(' ')}</b>${all && nb > 1 ? ` (${nb} BFS runs, one per component)` : ''}. Vertices are coloured by layer: same colour = same distance${multi ? ' to the nearest source' : ''}.` +
      (un.length ? ` −1 = unreached.` : '') + (t > n ? ` (Path to t: ${t} is not a vertex of this graph, so no path step.)` : ''), true);

    if (hasT) {
      for (let v = 1; v <= n; v++) if (dist[v] >= 0) R.node(v, 'dim');
      R.line(L.unr);
      if (dist[t] === -1) {
        R.node(t, 'bad').ring(t);
        panels({ hiD: t });
        snap(`Path to t = ${t}: <code>dist[${t}] == -1</code>, so ${t} is unreachable → print <b>-1</b>. This case is always in the tests.`, true);
      } else {
        const path = [];
        R.panel('path', { type: 'list', title: 'vector&lt;int&gt; path', items: [] });
        R.line([L.unr, L.vec]); panels({ hiD: t });
        snap(`Path to t = ${t}: <code>dist[${t}] = ${dist[t]}</code> ≠ −1, so a path exists. Walk <code>par[]</code> back from ${t}.`, true);
        let cur = t;
        while (cur !== 0) {
          path.push(cur);
          R.node(cur, 'path').ring(cur);
          if (parE[cur] >= 0) R.edge(parE[cur], 'path');
          R.panel('path', { type: 'list', title: 'vector&lt;int&gt; path', items: path.map((x) => ({ t: x, s: 'path' })) });
          R.line([L.walk, L.pb]); panels({ hiP: cur });
          snap(`<code>cur = ${cur}</code>: push_back(${cur}). Next <code>cur = par[${cur}] = ${par[cur]}</code>${par[cur] === 0 ? ' → 0 is the stop marker (par of a source).' : '.'}`, true);
          R.ring(cur, false);
          cur = par[cur];
        }
        const fwd = path.slice().reverse();
        R.panel('path', { type: 'list', title: 'vector&lt;int&gt; path', note: 'reversed', items: fwd.map((x) => ({ t: x, s: 'path' })) });
        R.line(L.rev); panels();
        snap(`Reverse: path <b>${fwd.join(' → ')}</b>, ${fwd.length - 1} edge${fwd.length === 2 ? '' : 's'} = dist[${t}] = ${dist[t]}` +
          (!sources.includes(fwd[0]) ? ` (from ${fwd[0]}, where the BFS of this component started).` : multi && sources.length > 1 ? `, starting at ${fwd[0]}, the source nearest to ${t}.` : '.'), true);
      }
    }
    return R.frames;
  },
});
})();

</script>
<script>/* 12-grid.js */
/* Part 4 (and Part 2.6): BFS on a grid, single and multi-source, with path reconstruction.
   Also defines GV.grid, the shared grid board used by every grid topic (14-components.js uses it for flood fill).

   GV.grid API (frame data lives in R.extra(fx); see GV.grid.state):
     GV.grid.norm(parsed, {binary})      -> G = {R, C, cells, wall, ragged, cut}   (rows padded with the wall char, clipped to 20 x 30)
     GV.grid.pick(ctx, topicId, samples) -> G   (handles an option 'sample' that loads sample grids into the Input tab)
     GV.grid.choices(samples)            -> choices for that select option
     GV.grid.state(G)                    -> fx = {G, st[], tx[], cur, look, nb, marks, arrows, scan}  (flat arrays, index r*C+c)
     GV.grid.check(G, x, y, k, seen)     -> {v: 'out'|'wall'|'seen'|'new', nx, ny}
     GV.grid.draw(el, G, fx, opts)       -> renderMain: the board (row/col indices, walls, per-cell state colour + text, arrows)
     GV.grid.drawNeighbours(el, fx)      -> renderAdj: the 4 generated neighbours of fx.cur with verdicts
     GV.grid.walls(G), inside(G,r,c), isWall(G,r,c), cell(r,c) -> '<code>(r,c)</code>', note(G) -> text about padding/clipping
   Cell state strings: any node state ('frontier','cur','visited','path','bad','c0'..'c7',...) = solid fill;
   '~state' = tinted fill with a solid border; 'dim' = faded free cell; '' = plain free cell. */
(function () {
const GV = window.GV;
const h = GV.h, s = GV.s;
const U = 40, PADL = 30, PADT = 28, PADR = 16, PADB = 16;
const DX = [-1, 1, 0, 0], DY = [0, 0, -1, 1];
const DIR = ['up', 'down', 'left', 'right'], ARW = ['↑', '↓', '←', '→'];
const TOK = { frontier: '--n-frontier', cur: '--n-cur', visited: '--n-visited', done: '--n-done', gray: '--n-gray', path: '--n-path', bad: '--n-bad', side0: '--c3', side1: '--c5' };
for (let i = 0; i < 8; i++) TOK['c' + i] = '--c' + i;

let css = `
/* engine fix: core sets svg.hidden, but SVGElement has no .hidden property, so the graph canvas stays visible under renderMain */
.canvas-card:has(> #mainCustom:not([hidden])) > #mainSvg { display: none !important; }
.gridv-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.gridv-cap { align-self: stretch; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.gridv-cap b { color: var(--ink); font-family: var(--font-mono); font-weight: 600; }
.gridv-svg { display: block; width: 100%; height: auto; max-height: min(68vh, 640px); }
.gridv-empty { color: var(--faint); font-size: 13px; padding: 30px; text-align: center; }
.gridv-free { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.gridv-dim { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 3; }
.gridv-wallr { fill: var(--faint); fill-opacity: .55; stroke: var(--faint); stroke-opacity: .6; stroke-width: 1; }
.gridv-hatch line { stroke: var(--canvas); stroke-width: 2.2; stroke-opacity: .75; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gridv-wallr { fill: var(--muted); fill-opacity: .42; } }
:root[data-theme="dark"] .gridv-wallr { fill: var(--muted); fill-opacity: .42; }
.gridv-txt { font-family: var(--font-mono); font-size: 15px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.gridv-txt.on { fill: var(--on-fill); }
.gridv-txt.faint { fill: var(--faint); font-weight: 400; }
.gridv-txt.small { font-size: 12px; }
.gridv-mark { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; fill: var(--accent); pointer-events: none; }
.gridv-mark.on { fill: var(--on-fill); }
.gridv-mark.big { font-size: 15px; text-anchor: middle; dominant-baseline: central; }
.gridv-idx { font-family: var(--font-mono); font-size: 11px; fill: var(--faint); text-anchor: middle; dominant-baseline: central; }
.gridv-idx.hi { fill: var(--n-cur); font-weight: 700; }
.gridv-nb { fill: none; stroke: var(--ink); stroke-opacity: .55; stroke-width: 1.6; stroke-dasharray: 4 3; pointer-events: none; }
.gridv-curbox { fill: none; stroke: var(--ink); stroke-width: 2.6; pointer-events: none; }
.gridv-scan { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-dasharray: 5 3; pointer-events: none; }
.gridv-look { fill: none; stroke-width: 3.4; pointer-events: none; }
.gridv-look.ok, .gridv-arrow.ok { stroke: var(--n-path); }
.gridv-look.no, .gridv-arrow.no { stroke: var(--n-bad); }
.gridv-arrow.par { stroke: var(--n-path); stroke-dasharray: 5 4; }
.gridv-arrow { stroke-width: 3.6; stroke-linecap: round; fill: none; pointer-events: none; }
.gridv-head.ok, .gridv-head.par { fill: var(--n-path); } .gridv-head.no { fill: var(--n-bad); }
.gridv-x { stroke: var(--n-bad); stroke-width: 3.2; stroke-linecap: round; }
.gridv-xbg { fill: var(--panel); stroke: var(--n-bad); stroke-width: 1.5; }
.gridv-k { font-family: var(--font-ui); font-size: 10.5px; color: var(--muted); margin-left: 2px; }
.gridv-sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid transparent; }
.gridv-verd { font-family: var(--font-ui); font-size: 12px; }
`;
for (const k in TOK) {
  css += `.gridv-s-${k} { fill: var(${TOK[k]}); stroke: var(${TOK[k]}); stroke-width: 1.2; }\n`;
  css += `.gridv-t-${k} { fill: var(${TOK[k]}); fill-opacity: .24; stroke: var(${TOK[k]}); stroke-width: 2.2; }\n`;
}
GV.addStyle(css);

const clampInt = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(+v || 0)));
const applied = {}; // topicId -> sample key whose text is currently loaded

const grid = (GV.grid = {
  dx: DX, dy: DY, DIR, ARW, U,

  /** Normalise GV.parseGrid output: clip to 20 x 30, pad ragged rows with the wall char. binary: a 0/1 grid uses '0' as the wall. */
  norm(p, o = {}) {
    let rows = ((p && p.cells) || []).slice();
    const cut = rows.length > 20 || rows.some((r) => r.length > 30);
    rows = rows.slice(0, 20).map((r) => r.slice(0, 30));
    const C = rows.reduce((m, r) => Math.max(m, r.length), 0);
    const ragged = rows.some((r) => r.length < C);
    let wall = '#';
    if (o.binary && rows.length && rows.every((r) => /^[01]*$/.test(r)) && rows.some((r) => r.includes('0'))) wall = '0';
    const cells = rows.map((r) => r.padEnd(C, wall));
    return { R: rows.length, C, cells, wall, ragged, cut };
  },
  inside: (G, r, c) => r >= 0 && r < G.R && c >= 0 && c < G.C,
  isWall: (G, r, c) => G.cells[r][c] === G.wall,
  walls(G) { let w = 0; for (const row of G.cells) for (const ch of row) if (ch === G.wall) w++; return w; },
  cell: (r, c) => `<code>(${r},${c})</code>`,
  note(G) {
    const t = [];
    if (G.cut) t.push('The grid was clipped to 20 × 30.');
    if (G.ragged) t.push(`Short rows were padded with <code>${GV.esc(G.wall)}</code> to ${G.C} columns.`);
    return t.length ? ' ' + t.join(' ') : '';
  },
  /** One step of the course's neighbour loop. seen(nx, ny) -> truthy if already visited. */
  check(G, x, y, k, seen) {
    const nx = x + DX[k], ny = y + DY[k];
    if (nx < 0 || nx >= G.R || ny < 0 || ny >= G.C) return { v: 'out', nx, ny };
    if (G.cells[nx][ny] === G.wall) return { v: 'wall', nx, ny };
    if (seen(nx, ny)) return { v: 'seen', nx, ny };
    return { v: 'new', nx, ny };
  },
  state(G) {
    const N = (G.R || 0) * (G.C || 0);
    return { G, st: Array(N).fill(''), tx: Array(N).fill(''), cur: null, look: -1, nb: null, marks: [], arrows: [], scan: null, cap: null, adjNote: null };
  },
  choices(samples) {
    return Object.keys(samples).map((k) => [k, samples[k].name]).concat([['input', 'Custom (Input tab)']]);
  },
  /** Option 'sample' (or optId) picks a sample grid; choosing one loads its text into the Input tab.
      Editing the Input tab afterwards switches the option to 'Custom'. Returns the normalised grid. */
  pick(ctx, topicId, samples, optId = 'sample', normOpts = {}) {
    const key = ctx.opts[optId];
    const A = GV.app || {};
    let text = ctx.gridText || '';
    const canon = (t) => GV.parseGrid(t || '').cells.join('\n');
    if (key && key !== 'input' && samples[key]) {
      if (applied[topicId] !== key) {
        text = samples[key].text;
        applied[topicId] = key;
        try {
          if (A.grids) A.grids[topicId] = text;
          const ta = document.getElementById('inputTa');
          if (ta && A.topic && A.topic.id === topicId) ta.value = text;
        } catch (e) { /* not in the app */ }
      } else if (canon(text) !== canon(samples[key].text)) {
        applied[topicId] = 'input';
        try {
          if (A.opts && A.opts[topicId]) A.opts[topicId][optId] = 'input';
          const sel = document.getElementById('opt-' + optId);
          if (sel) sel.value = 'input';
        } catch (e) { /* ignore */ }
      }
    } else applied[topicId] = 'input';
    return grid.norm(GV.parseGrid(text), normOpts);
  },

  /** Draw the board. G = normalised grid (defaults to fx.G); fx = frame extra; opts.caption = html above the board. */
  draw(el, G, fx, opts = {}) {
    fx = fx || {};
    G = G || fx.G;
    el.innerHTML = '';
    if (!G || !G.R || !G.C) { el.append(h('div', { class: 'gridv-empty' }, 'Empty grid. Type one in the Input tab: one row per line, . free, # wall.')); return; }
    const { R, C, cells } = G;
    const W = PADL + C * U + PADR, H = PADT + R * U + PADB;
    const wrap = h('div', { class: 'gridv-wrap' });
    const cap = opts.caption != null ? opts.caption : fx.cap;
    if (cap) wrap.append(h('div', { class: 'gridv-cap', html: cap }));
    const svg = s('svg', { class: 'gridv-svg', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Grid with ${R} rows and ${C} columns` });
    svg.style.maxWidth = Math.round(W * (opts.scale || 1.8)) + 'px';
    const pid = 'gridv-hatch';
    svg.append(s('defs', null, s('pattern', { id: pid, class: 'gridv-hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, s('line', { x1: 0, y1: 0, x2: 0, y2: 8 }))));
    const cur = fx.cur, look = fx.look;
    // indices
    for (let c = 0; c < C; c++) svg.append(s('text', { class: 'gridv-idx' + (cur && cur[1] === c ? ' hi' : ''), x: PADL + c * U + U / 2, y: PADT - 12 }, c));
    for (let r = 0; r < R; r++) svg.append(s('text', { class: 'gridv-idx' + (cur && cur[0] === r ? ' hi' : ''), x: PADL - 14, y: PADT + r * U + U / 2 }, r));
    const X = (c) => PADL + c * U, Y = (r) => PADT + r * U;
    const markAt = {};
    for (const m of fx.marks || []) markAt[m[0] * C + m[1]] = m[2];
    const binary = G.wall === '0';
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const i = r * C + c, ch = cells[r][c];
      const g = s('g');
      if (ch === G.wall) {
        g.append(s('rect', { class: 'gridv-wallr', x: X(c) + 1.5, y: Y(r) + 1.5, width: U - 3, height: U - 3, rx: 4 }));
        g.append(s('rect', { x: X(c) + 1.5, y: Y(r) + 1.5, width: U - 3, height: U - 3, rx: 4, fill: `url(#${pid})` }));
        svg.append(g);
        continue;
      }
      const st = (fx.st && fx.st[i]) || '';
      const tinted = st[0] === '~';
      const name = tinted ? st.slice(1) : st;
      const cls = !st ? 'gridv-free' : st === 'dim' ? 'gridv-dim' : TOK[name] ? (tinted ? 'gridv-t-' : 'gridv-s-') + name : 'gridv-free';
      const solid = !!st && !tinted && !!TOK[name];
      g.append(s('rect', { class: cls, x: X(c) + 1.5, y: Y(r) + 1.5, width: U - 3, height: U - 3, rx: 5 }));
      const txt = fx.tx ? fx.tx[i] : '';
      const mk = markAt[i] || (!binary && ch !== '.' ? ch : '');
      if (txt !== '' && txt != null) {
        const t = String(txt);
        g.append(s('text', { class: 'gridv-txt' + (solid ? ' on' : '') + (st === 'dim' ? ' faint' : '') + (t.length > 2 ? ' small' : ''), x: X(c) + U / 2, y: Y(r) + U / 2 + (mk ? 3 : 0.5) }, t));
        if (mk) g.append(s('text', { class: 'gridv-mark' + (solid ? ' on' : ''), x: X(c) + 4.5, y: Y(r) + 12 }, mk));
      } else if (mk) g.append(s('text', { class: 'gridv-mark big' + (solid ? ' on' : ''), x: X(c) + U / 2, y: Y(r) + U / 2 + 0.5 }, mk));
      svg.append(g);
    }
    if (fx.scan && grid.inside(G, fx.scan[0], fx.scan[1])) svg.append(s('rect', { class: 'gridv-scan', x: X(fx.scan[1]) - 1, y: Y(fx.scan[0]) - 1, width: U + 2, height: U + 2, rx: 7 }));
    const arrow = (x1, y1, x2, y2, cls, short) => {
      const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L;
      const sx = x1 + ux * 9, sy = y1 + uy * 9, ex = x2 - ux * (short || 9), ey = y2 - uy * (short || 9);
      const bx = ex - ux * 9, by = ey - uy * 9;
      svg.append(s('line', { class: 'gridv-arrow ' + cls, x1: sx, y1: sy, x2: bx, y2: by }));
      svg.append(s('polygon', { class: 'gridv-head ' + cls, points: `${ex},${ey} ${bx - uy * 6},${by + ux * 6} ${bx + uy * 6},${by - ux * 6}` }));
    };
    if (cur) {
      const [x, y] = cur;
      for (let k = 0; k < 4; k++) {
        const nx = x + DX[k], ny = y + DY[k];
        if (grid.inside(G, nx, ny) && k !== look) svg.append(s('rect', { class: 'gridv-nb', x: X(ny) + 3.5, y: Y(nx) + 3.5, width: U - 7, height: U - 7, rx: 4 }));
      }
      svg.append(s('rect', { class: 'gridv-curbox', x: X(y) + 0.5, y: Y(x) + 0.5, width: U - 1, height: U - 1, rx: 6 }));
      if (look != null && look >= 0) {
        const nb = fx.nb && fx.nb[look];
        const ok = nb && nb.v === 'new' ? 'ok' : 'no';
        const nx = x + DX[look], ny = y + DY[look];
        const cx = X(y) + U / 2, cy = Y(x) + U / 2;
        if (grid.inside(G, nx, ny)) {
          svg.append(s('rect', { class: 'gridv-look ' + ok, x: X(ny) + 2, y: Y(nx) + 2, width: U - 4, height: U - 4, rx: 5 }));
          arrow(cx, cy, X(ny) + U / 2, Y(nx) + U / 2, ok, 13);
        } else {
          const px = cx + DY[look] * U * 0.86, py = cy + DX[look] * U * 0.86;
          arrow(cx, cy, cx + DY[look] * U * 0.6, cy + DX[look] * U * 0.6, 'no', 1);
          svg.append(s('circle', { class: 'gridv-xbg', cx: px, cy: py, r: 8 }));
          svg.append(s('path', { class: 'gridv-x', d: `M${px - 4},${py - 4} L${px + 4},${py + 4} M${px + 4},${py - 4} L${px - 4},${py + 4}` }));
        }
      }
    }
    for (const a of fx.arrows || []) arrow(X(a.a[1]) + U / 2, Y(a.a[0]) + U / 2, X(a.b[1]) + U / 2, Y(a.b[0]) + U / 2, a.cls || 'par', 13);
    wrap.append(svg);
    el.append(wrap);
  },

  /** The grid's "adjacency list": the 4 neighbours of fx.cur, generated by the dx/dy loop, with verdicts. */
  drawNeighbours(el, fx) {
    el.innerHTML = '';
    if (!fx || !fx.cur) {
      el.append(h('div', { class: 'adj-sub', html: (fx && fx.adjNote) || 'No cell is being expanded right now. A grid never stores <code>adj[]</code>: the 4 neighbours of <code>(x,y)</code> are generated on demand as <code>(x + dx[k], y + dy[k])</code>.' }));
      for (let k = 0; k < 4; k++) {
        el.append(h('div', { class: 'adj-row' }, h('span', { class: 'adj-u', title: DIR[k] }, ARW[k]), h('span', { class: 'adj-arrow' }, ':'),
          h('span', { class: 'adj-items' }, h('span', { class: 'adj-it' }, `k=${k}: dx=${DX[k]}, dy=${DY[k]}`), h('span', { class: 'gridv-k' }, DIR[k]))));
      }
      return;
    }
    const [x, y] = fx.cur;
    el.append(h('div', { class: 'adj-sub', html: `Neighbours of <b>(${x},${y})</b> = <code>(x + dx[k], y + dy[k])</code>. This loop replaces <code>for (int v : adj[u])</code>.` }));
    const look = fx.look == null ? -1 : fx.look;
    for (let k = 0; k < 4; k++) {
      const nx = x + DX[k], ny = y + DY[k];
      const nb = fx.nb && fx.nb[k];
      const hi = look === k;
      let verdict = null, vcls = 'adj-it gridv-verd';
      if (nb && nb.v) {
        if (nb.v === 'out') { verdict = 'off the board'; vcls += ' sw-dim'; }
        else if (nb.v === 'wall') { verdict = nb.t || 'wall #'; vcls += ' sw-dim'; }
        else if (nb.v === 'seen') { verdict = nb.t || 'already visited'; vcls += ' sw-dim'; }
        else { verdict = nb.t || 'new: push'; vcls += ' sw-' + (nb.s || 'frontier'); }
      }
      const items = h('span', { class: 'adj-items' },
        h('span', { class: 'adj-it' + (hi ? ' hi' : '') }, `(${nx},${ny})`),
        verdict ? h('span', { class: vcls }, verdict) : h('span', { class: 'gridv-k' }, look >= 0 && k > look ? 'not checked yet' : DIR[k]));
      el.append(h('div', { class: 'adj-row' + (hi ? ' hi' : '') }, h('span', { class: 'adj-u', title: DIR[k] }, ARW[k]), h('span', { class: 'adj-arrow' }, ':'), items));
    }
  },
});

/* ---------------------------------------------------------------- BFS on a grid ---- */
function listing(lines) {
  const L = {}, out = [];
  for (const l of lines) {
    if (l == null || l === false) continue;
    if (Array.isArray(l)) { L[l[0]] = out.length + 1; out.push(l[1]); } else out.push(l);
  }
  return { text: out.join('\n'), L };
}
const BFS = listing([
  'int R, C;',
  'vector<string> g;',
  'int dx[4] = {-1, 1, 0, 0};          // up, down, left, right',
  'int dy[4] = { 0, 0,-1, 1};',
  'vector<vector<int>> d;',
  'vector<vector<pair<int,int>>> par;',
  '',
  'void bfsGrid(vector<pair<int,int>> sources) {',
  ['assign', '    d.assign(R, vector<int>(C, -1));'],
  ['passign', '    par.assign(R, vector<pair<int,int>>(C, {-1, -1}));'],
  '    queue<pair<int,int>> q;',
  ['srcfor', '    for (auto [sx, sy] : sources) {     // 1 source = plain BFS'],
  ['s0', '        d[sx][sy] = 0;                  // several = multi-source BFS'],
  ['push0', '        q.push({sx, sy});'],
  '    }',
  ['while', '    while (!q.empty()) {'],
  ['pop', '        auto [x, y] = q.front(); q.pop();'],
  ['for', '        for (int k = 0; k < 4; k++) {'],
  ['nx', '            int nx = x + dx[k], ny = y + dy[k];'],
  ['out', '            if (nx < 0 || nx >= R || ny < 0 || ny >= C) continue;'],
  ['wall', "            if (g[nx][ny] == '#') continue;"],
  ['seen', '            if (d[nx][ny] != -1) continue;'],
  ['set', '            d[nx][ny] = d[x][y] + 1;'],
  ['par', '            par[nx][ny] = {x, y};'],
  ['push', '            q.push({nx, ny});'],
  '        }',
  '    }',
  '}',
  '',
  '// shortest path to (tx, ty)',
  ['unr', 'if (d[tx][ty] == -1) cout << -1 << "\\n";  // unreachable: always tested'],
  'else {',
  '    vector<pair<int,int>> path;',
  ['walk', '    for (auto p = make_pair(tx, ty); p.first != -1; p = par[p.first][p.second])'],
  ['pb', '        path.push_back(p);'],
  ['rev', '    reverse(path.begin(), path.end());'],
  '}',
]);

const BFS_SAMPLES = {

  fire: { name: 'Fire: 3 sources (multi-source)', text: 'S.....#.......\n..###.#..###..\n..#......#....\n..#.###..#..S.\n......#.......\n.####.#.####..\n......#......S' },
};

GV.registerTopic({
  id: 'grid-bfs', part: 4, order: 5,

  blurb: 'Cells are vertices, the 4 free side-neighbours are edges. BFS is unchanged: only <code>for (int v : adj[u])</code> becomes the <code>dx/dy</code> loop. Put several <code>S</code> cells in the grid for multi-source BFS, an <code>E</code> for the target.',

    { id: 'sr', type: 'number', label: 'Source r', default: 0, min: 0, title: 'Used when the grid has no S cell' },

    { id: 'tc', type: 'number', label: 'c', default: 4, min: -1, title: 'Used when the grid has no S or E cell. -1 = no target' },
  ],
  legend: [['cur', 'popped cell (x, y)'], ['frontier', 'in the queue'], ['visited', 'done (tinted)'], ['path', 'shortest path'], ['bad', 'unreachable target']],
  code: BFS.text,
  notes: `
<h4>Key idea</h4>
<p>A grid is a graph you never build: every free cell is a vertex, joined to the free cells directly up, down, left and right. Replace <code>for (int v : adj[u])</code> with the <code>dx/dy</code> loop and BFS is unchanged. The first time a cell is reached is along a shortest route, because BFS finishes every cell at distance <code>d</code> before it touches distance <code>d + 1</code>.</p>
<p>On G4 from <code>(0,0)</code> the bottom-right cell <code>(3,4)</code> is at distance 7: down, down, right, right, right, right, down. The top-right cell is at distance 8, not 4, because the wall at <code>(0,2)</code> forces the route around the bottom.</p>
<h4>Multi-source BFS</h4>
<p>To get the distance to the <b>nearest</b> of several starts (fire spreading, nearest guard, nearest 1 in a matrix), push <b>all</b> sources with <code>d = 0</code> before the loop and run one BFS. Think of an imaginary super source joined to every real source. One O(R·C) pass replaces k separate BFS runs.</p>
<h4>Common mistakes</h4>
<ul>
<li><b>Reading <code>g[nx][ny]</code> before the bounds check.</b> C++ happily reads out of bounds. The bounds line must come first.</li>
<li><b>Marking visited when popping instead of when pushing.</b> The same cell enters the queue many times.</li>
<li><b>Forgetting the unreachable case.</b> <code>d[t] == -1</code> must print -1; it is always in the tests.</li>
<li><b>Running a separate BFS per source</b> when multi-source BFS does it in one pass.</li>
<li><b>Pushing a source without setting <code>d[s] = 0</code></b>, so it looks unvisited and gets rediscovered.</li>
<li>Mixing up <code>(x, y)</code> = (row, column) with screen x/y. Here <code>x</code> is the row, <code>dx</code> moves between rows.</li>
</ul>
<h4>Check yourself</h4>
<ol>
<li>On G4, why is the top-right cell at distance 8 rather than 4?</li>
<li>Why does pushing all sources first give the distance to the nearest source?</li>
<li>You need the route, not only its length. What extra array do you keep, and how do you print the path?</li>
<li>Does the order of the four directions change any distance? (No, only which of several shortest paths <code>par</code> remembers.)</li>
</ol>`,
  problems: [
    { id: '1365D', name: 'Solve The Maze', note: 'multi-source reasoning on a grid' },
    { id: '796D', name: 'Police Stations', note: 'multi-source BFS on a tree' },
    { id: '1063B', name: 'Labyrinth', note: 'grid BFS with a movement budget (0-1 BFS)' },
    { id: '590C', name: 'Three States', note: 'multi-source 0-1 BFS from three regions' },
    { id: '1130C', name: 'Connect', note: 'two flood fills plus a small brute force' },
  ],
  renderMain(f, el, ctx) { const fx = f.extra || {}; grid.draw(el, fx.G || grid.norm(ctx.grid), fx); },
  renderAdj(f, el) { grid.drawNeighbours(el, f.extra); },
  run(ctx) {
    const G = grid.pick(ctx, 'grid-bfs', BFS_SAMPLES);
    const R = GV.recorder();
    const L = BFS.L, o = ctx.opts;
    const fx = grid.state(G);
    R.extra(fx);
    if (!G.R || !G.C) { R.snap('The grid is empty. Type one in the Input tab: one row per line, <code>.</code> free, <code>#</code> wall.'); return R.frames; }
    const C = G.C, N = G.R * C, id = (r, c) => r * C + c, rc = (i) => [(i / C) | 0, i % C];
    const P = (i) => { const [r, c] = rc(i); return `(${r},${c})`; };
    const cellC = (i) => `<code>${P(i)}</code>`;
    // sources and target
    let srcs = [], tgt = -1;
    for (let r = 0; r < G.R; r++) for (let c = 0; c < C; c++) {
      if (G.cells[r][c] === 'S') srcs.push(id(r, c));
      if (G.cells[r][c] === 'E' && tgt < 0) tgt = id(r, c);
    }
    const fromGrid = srcs.length > 0;
    if (!fromGrid) {
      const sr = clampInt(o.sr, 0, G.R - 1), sc = clampInt(o.sc, 0, C - 1);
      srcs = [id(sr, sc)];
      fx.marks.push([sr, sc, 'S']);
      if (tgt < 0 && o.tr >= 0 && o.tc >= 0) { const tr = clampInt(o.tr, 0, G.R - 1), tc = clampInt(o.tc, 0, C - 1); tgt = id(tr, tc); fx.marks.push([tr, tc, 'E']); }
    }
    const wallSrc = srcs.filter((i) => grid.isWall(G, ...rc(i)));
    srcs = srcs.filter((i) => !grid.isWall(G, ...rc(i)));
    const free = G.R * C - grid.walls(G);
    const multi = srcs.length > 1;
    const info = () => R.panel('info', { type: 'table', title: 'setup', rows: [
      [multi ? 'sources' : 'source', srcs.map(P).join(' ') || '—'],
      ['target', tgt >= 0 ? P(tgt) : 'none'],
      ['reached', `${reached} of ${free} free cells`],
    ] });
    let reached = 0;
    if (!srcs.length) {
      info();
      R.line(L.s0).snap(`The source ${cellC(wallSrc[0])} is a wall. Choose a free cell (toolbar) or put an <code>S</code> on a <code>.</code> cell.`);
      return R.frames;
    }
    const d = Array(N).fill(-1), par = Array(N).fill(-1);
    const q = [];
    let head = 0;
    const qPanel = (hiFront) => {
      const items = q.slice(head);
      const shown = items.slice(0, 18).map((i) => ({ t: P(i), s: 'frontier' }));
      if (items.length > 18) shown.push({ t: `+${items.length - 18} more` });
      R.panel('q', { type: 'queue', title: 'queue&lt;pair&lt;int,int&gt;&gt; q', note: items.length + (items.length === 1 ? ' cell' : ' cells'), items: shown, hi: hiFront && shown.length ? [0] : [] });
    };
    info(); qPanel();
    R.line([L.assign, L.passign]).snap(`The grid has ${G.R} rows, ${C} columns and ${free} free cells. <code>d[x][y] = -1</code> everywhere means "not reached yet". Nobody builds an adjacency list.${grid.note(G)}`);
    for (const sI of srcs) { d[sI] = 0; q.push(sI); fx.st[sI] = 'frontier'; fx.tx[sI] = '0'; reached++; }
    info(); qPanel();
    R.line([L.srcfor, L.s0, L.push0]).snap(multi
      ? `Multi-source BFS: all ${srcs.length} sources ${srcs.map(cellC).join(', ')} get <code>d = 0</code> and go into the queue <b>before</b> the loop. It is one BFS from an imaginary super source joined to every <code>S</code>, so each cell will get the distance to its <b>nearest</b> source.`
      : `Start at ${cellC(srcs[0])}: <code>d = 0</code> and push it. ${fromGrid ? 'It is the <code>S</code> cell.' : 'Change it with <em>Source r, c</em> in the toolbar.'}${wallSrc.length ? ` (Ignored the S on a wall at ${cellC(wallSrc[0])}.)` : ''}`);

    let mode = 'step', ffNoted = false, firstOut = true;
    const F = () => R.frames.length;
    while (head < q.length) {
      const u = q[head++];
      const [x, y] = rc(u);
      if (mode !== 'none') mode = F() < 330 ? 'step' : F() < 500 ? 'pop' : F() < 568 ? 'layer' : 'none';
      fx.st[u] = 'cur'; fx.cur = [x, y]; fx.look = -1; fx.nb = [null, null, null, null];
      let ff = '';
      if (mode !== 'step' && !ffNoted) { ffNoted = true; ff = ' <em>(Fast-forward: the grid is big, so from here on there is one frame per ' + (mode === 'pop' ? 'popped cell' : 'BFS layer') + '.)</em>'; }
      if (mode === 'step') {
        qPanel(false); info();
        R.line(L.pop).snap(`Pop ${cellC(u)} with <code>d = ${d[u]}</code>. Now try its 4 neighbours in <code>dx/dy</code> order: up, down, left, right.`);
      }
      const pushed = [], skipped = [];
      for (let k = 0; k < 4; k++) {
        const ch = grid.check(G, x, y, k, (a, b) => d[id(a, b)] !== -1);
        const nI = ch.v === 'out' ? -1 : id(ch.nx, ch.ny);
        const at = `<code>(${ch.nx},${ch.ny})</code>`;
        let msg, line;
        const kk = `k = ${k} (${DIR[k]}): `;
        if (ch.v === 'out') {
          fx.nb[k] = { v: 'out' };
          msg = kk + `${at} is off the board → <code>continue</code>.` + (firstOut ? ' The bounds check comes <b>before</b> reading <code>g[nx][ny]</code>.' : '');
          if (mode === 'step') firstOut = false;
          line = [L.nx, L.out]; skipped.push(DIR[k] + ' off board');
        } else if (ch.v === 'wall') {
          fx.nb[k] = { v: 'wall' };
          msg = kk + `${at} is a wall <code>#</code> → <code>continue</code>.`; line = [L.nx, L.wall]; skipped.push(DIR[k] + ' wall');
        } else if (ch.v === 'seen') {
          fx.nb[k] = { v: 'seen', t: `d = ${d[nI]}, skip` };
          msg = kk + `${at} already has <code>d = ${d[nI]}</code> → <code>continue</code>. It was reached earlier, so this route cannot be shorter.`; line = [L.nx, L.seen]; skipped.push(DIR[k] + ' seen');
        } else {
          d[nI] = d[u] + 1; par[nI] = u; q.push(nI); reached++;
          fx.st[nI] = 'frontier'; fx.tx[nI] = String(d[nI]);
          fx.nb[k] = { v: 'new', t: `d = ${d[nI]}, push` };
          msg = kk + `${at} is free and unvisited → <code>d[${ch.nx}][${ch.ny}] = d[${x}][${y}] + 1 = ${d[nI]}</code>, <code>par = (${x},${y})</code>, push.`;
          line = [L.set, L.par, L.push]; pushed.push(nI);
        }
        if (mode === 'step') { fx.look = k; qPanel(); info(); R.line(line).snap(msg); }
      }
      if (mode === 'pop') {
        fx.look = -1; qPanel(); info();
        R.line([L.pop, L.for]).snap(`Pop ${cellC(u)} (d = ${d[u]}): ` + (pushed.length ? `pushed ${pushed.map(cellC).join(', ')} with <code>d = ${d[u] + 1}</code>` : 'no new cells') + (skipped.length ? `; skipped ${skipped.join(', ')}.` : '.') + ff);
      }
      fx.st[u] = '~visited';
      if (mode === 'layer' && (head >= q.length || d[q[head]] !== d[u])) {
        fx.cur = null; fx.look = -1; qPanel(); info();
        const layer = []; for (let i = 0; i < N; i++) if (d[i] === d[u]) layer.push(i);
        R.line(L.while).snap(`Layer <code>d = ${d[u]}</code> is finished (${layer.length} cell${layer.length > 1 ? 's' : ''}). The queue now holds exactly the cells at distance ${d[u] + 1}.` + ff);
        ff = '';
      }
    }
    // done
    fx.cur = null; fx.look = -1; fx.nb = null;
    let far = srcs[0];
    for (let i = 0; i < N; i++) if (d[i] > d[far]) far = i;
    const unreached = [];
    for (let i = 0; i < N; i++) if (d[i] === -1 && !grid.isWall(G, ...rc(i))) { unreached.push(i); fx.st[i] = 'dim'; fx.tx[i] = '-1'; }
    fx.adjNote = 'The queue is empty: every reachable cell has its final <code>d</code>. Neighbours are generated by <code>(x + dx[k], y + dy[k])</code>; no adjacency list exists.';
    qPanel(); info();
    R.line(L.while).snap(`Queue empty: BFS is done. ${reached} of ${free} free cells reached; the farthest is ${cellC(far)} at <code>d = ${d[far]}</code>.` + (unreached.length ? ` ${unreached.length} free cell${unreached.length > 1 ? 's stay' : ' stays'} at <code>-1</code>: walled off from every source.` : ''));
    // path
    if (tgt >= 0) {
      if (d[tgt] === -1) {
        fx.st[tgt] = 'bad';
        R.panel('ans', { type: 'text', title: 'answer', html: `<code>d[${rc(tgt)[0]}][${rc(tgt)[1]}] = -1</code> → print <b>-1</b>` });
        R.line(L.unr).snap(`Target ${cellC(tgt)} has <code>d = -1</code>${grid.isWall(G, ...rc(tgt)) ? ' (it is a wall)' : ''}: it is unreachable, so the answer is <b>-1</b>. This case is always in the tests.`);
      } else {
        const path = [];
        let cur = tgt;
        const stepFrames = d[tgt] <= 40;
        while (cur !== -1) {
          path.push(cur);
          fx.st[cur] = 'path';
          const p = par[cur];
          fx.arrows = p >= 0 ? [{ a: rc(cur), b: rc(p), cls: 'par' }] : [];
          if (stepFrames && F() < 596) {
            R.panel('path', { type: 'list', title: 'path (before reverse)', items: path.map((i) => ({ t: P(i), s: 'path' })) });
            R.line([L.walk, L.pb]).snap(`<code>path.push_back(${P(cur)})</code>` + (p >= 0 ? `, then follow <code>par[${rc(cur)[0]}][${rc(cur)[1]}] = ${P(p)}</code>.` : `. Its <code>par</code> is <code>(-1,-1)</code>: this is ${multi ? 'the nearest source' : 'the source'}, stop.`));
          }
          cur = p;
        }
        fx.arrows = [];
        path.reverse();
        R.panel('path', { type: 'list', title: 'path', note: `${path.length - 1} moves`, items: path.map((i) => ({ t: P(i), s: 'path' })) });
        R.panel('ans', { type: 'text', title: 'answer', html: `shortest distance <b>${d[tgt]}</b> from ${P(path[0])} to ${P(tgt)}` });
        R.line(L.rev).snap(`Reverse it: ${path.map(P).join(' ')}. That is ${path.length - 1} moves, exactly <code>d = ${d[tgt]}</code> at the target.` + (multi ? ` The route starts at ${cellC(path[0])}, the source nearest to the target.` : ''));
      }
    } else {
      R.panel('ans', { type: 'text', title: 'answer', html: `${reached} cells reached · farthest ${P(far)} at d = ${d[far]}` });
      R.line(L.while).snap(multi
        ? `Every number is the distance to the <b>nearest</b> source: the time at which the fire reaches that cell. All of it in one BFS. Add an <code>E</code> cell to see a path.`
        : `Every number is the BFS distance from the source. Add an <code>E</code> cell (or set <em>Target r, c</em>) to reconstruct a path with <code>par</code>.`);
    }
    return R.frames;
  },
});
})();

<script>/* 13-cycles.js */
/* Part 6: Cycle detection — undirected (DFS with parent, by vertex or by edge id) and directed (three colours). */
(function () {
const GV = window.GV;
const CAP = 560;

GV.addPreset('CY-multi', {
  name: 'Parallel edges 1=2 (undirected)', directed: false, weighted: false, n: 4,

});
GV.addPreset('CY-dia', {

  nodes: [[0, 0], [220, 0], [0, 170], [220, 170]],

});
GV.addPreset('CY-d', {
