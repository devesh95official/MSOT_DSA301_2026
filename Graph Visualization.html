  nodes: [[0, 120], [150, 0], [150, 240], [330, 0], [480, 120], [330, 240]],
  edges: [[1, 2], [1, 3], [2, 4], [3, 4], [3, 6], [4, 5], [6, 5], [5, 1]],
});

function listing(lines) {
  const L = {}, out = [];
  for (const l of lines) {
    if (l == null || l === false) continue;
    if (Array.isArray(l)) { L[l[0]] = out.length + 1; out.push(l[1]); } else out.push(l);
  }
  return { text: out.join('\n'), L };
}
const tail = (first) => [
  '',
  'int main() {',
  ['loop', '    for (int i = 1; i <= n; i++)       // try EVERY component'],
  ['lcall', first],
  ['none', '    if (cycleStart == -1) { cout << "no cycle\\n"; return 0; }'],
  ['c0', '    vector<int> cycle = {cycleStart};'],
  ['walk', '    for (int v = cycleEnd; v != cycleStart; v = par[v])'],
  ['pb', '        cycle.push_back(v);'],
  ['c1', '    cycle.push_back(cycleStart);'],
  ['rev', '    reverse(cycle.begin(), cycle.end());'],
  '}',
];
function parentCode(byId, wrongDirected) {
  return listing([
    wrongDirected && '// !! undirected method on a DIRECTED graph: WRONG on purpose',
    'bool vis[N];',
    'int par[N], cycleStart = -1, cycleEnd = -1;',
    '',
    ['fn', byId ? 'bool dfs(int u, int p, int pe) {   // pe = id of the edge we came along' : 'bool dfs(int u, int p) {             // p = parent vertex, 0 for a root'],
    ['vis', '    vis[u] = true;'],
    ['par', '    par[u] = p;'],
    ['for', byId ? '    for (auto [v, id] : adj[u]) {    // adj[u] holds (neighbour, edge id)' : '    for (int v : adj[u]) {'],
    ['skip', byId ? '        if (id == pe) continue;      // skip only THAT edge' : '        if (v == p) continue;        // the edge we just walked'],
    ['if', '        if (vis[v]) {                // visited and not where we came from'],
    ['found', '            cycleStart = v; cycleEnd = u;'],
    ['rett', '            return true;'],
    '        }',
    ['call', byId ? '        if (dfs(v, u, id)) return true;' : '        if (dfs(v, u)) return true;'],
    '    }',
    ['retf', '    return false;'],
    '}',
    ...tail(byId ? '        if (!vis[i] && dfs(i, 0, -1)) break;' : '        if (!vis[i] && dfs(i, 0)) break;'),
  ]);
}
function colorCode() {
  return listing([
    'int color[N];                  // 0 white, 1 grey, 2 black',
    'int par[N], cycleStart = -1, cycleEnd = -1;',
    '',
    ['fn', 'bool dfs(int u) {'],
    ['grey', '    color[u] = 1;                     // grey: entering'],
    ['for', '    for (int v : adj[u]) {'],
    ['if', '        if (color[v] == 1) {          // grey: back edge -> cycle'],
    ['found', '            cycleStart = v; cycleEnd = u;'],
    ['rett', '            return true;'],
    '        }',
    ['white', '        if (color[v] == 0) {          // white: go deeper'],
    ['par', '            par[v] = u;'],
    ['call', '            if (dfs(v)) return true;'],
    '        }                             // black: finished, harmless',
    '    }',
    ['black', '    color[u] = 2;                     // black: leaving'],
    ['retf', '    return false;'],
    '}',
    ...tail('        if (color[i] == 0 && dfs(i)) break;'),
  ]);
}
const pick = (directed, o) => (directed ? (o.naive ? parentCode(false, true) : colorCode()) : parentCode(o.pskip === 'e', false));

/* ground truth, to call out wrong answers of the deliberately-wrong variants */
function truth(g, adj) {
  const n = g.n;
  if (g.directed) {
    const indeg = Array(n + 1).fill(0);
    g.edges.forEach((e) => indeg[e.v]++);
    const q = []; for (let v = 1; v <= n; v++) if (!indeg[v]) q.push(v);
    let seen = 0;
    while (q.length) { const u = q.shift(); seen++; for (const { v } of adj[u]) if (--indeg[v] === 0) q.push(v); }
    return { cyc: seen < n };
  }
  const comp = Array(n + 1).fill(0); let c = 0;
  for (let s = 1; s <= n; s++) {
    if (comp[s]) continue;
    c++; const st = [s]; comp[s] = c;
    while (st.length) { const u = st.pop(); for (const { v } of adj[u]) if (!comp[v]) { comp[v] = c; st.push(v); } }
  }
  return { cyc: g.edges.length > n - c, c };
}

const ed = (g, e) => (g.directed ? `${g.edges[e].u} → ${g.edges[e].v}` : `${g.edges[e].u}–${g.edges[e].v}`);

GV.registerTopic({
  id: 'cycle', part: 6, order: 0,
  title: 'Cycle Detection',
  blurb: 'Undirected: a DFS that meets a visited vertex which is <b>not where it came from</b> has found a cycle. Directed: "visited" is too coarse, a cycle is an edge to a <b>grey</b> vertex, one still on the recursion stack.',
  complexity: 'O(n + m)',
  chips: ['parent trick', '3 colours', 'print the cycle'],
  graph: { preset: 'K4', directed: 'any', weighted: false, presets: ['K4', 'G1', 'CY-multi', 'G2', 'CY-dia', 'CY-d'] },
  allowSelfLoops: true,
  options: [
    { id: 'pskip', type: 'select', label: 'Undirected: skip parent by', default: 'v', choices: [['v', 'vertex (course)'], ['e', 'edge id (multi-edges)']] },
    { id: 'naive', type: 'check', label: 'Directed: use visited + parent (wrong)', default: false, title: 'Run the undirected method on a directed graph to see why it fails (try the diamond preset)' },
  ],
  legend: [['cur', 'running now'], ['gray', 'grey: on the stack'], ['done', 'black: finished'], ['bad', 'on the cycle'],
    ['e:tree', 'tree edge'], ['e:cross', 'edge to a black vertex'], ['e:skip', 'skipped (parent)'], ['e:bad', 'cycle edge']],
  code: (o) => pick(GV.app && GV.app.g ? GV.app.g.directed : false, o).text,
  notes: `
<h4>Key idea</h4>
<p>Cycles separate graphs from trees. The undirected and the directed case need <b>different code</b>; using one for the other is a classic wrong answer.</p>
<p><b>Undirected:</b> run a DFS. Reaching a vertex that is already visited <em>and is not the neighbour you came from</em> means a second way to get there, which closes a cycle. The "not the parent" clause exists because every edge is in both lists: standing at 2 having come from 1, you see 1, visited. That is the edge you just walked, not a cycle. On G1 the DFS finds 1 – 2 – 4 – 1.</p>
<p><b>Directed:</b> on the diamond 1→2→4, 1→3→4 there is no cycle, but a "visited" DFS goes 1→2→4, then from 3 sees 4 visited and not the parent, and shouts "cycle". What matters is whether the vertex is <b>still on the recursion stack</b>. White = not visited, grey = entered and not left, black = finished. A grey neighbour is a back edge = a cycle; a black one is harmless. No <code>parent</code> parameter: in a directed graph u→v→u is a genuine 2-cycle.</p>
<h4>Summary</h4>
<table><tr><th></th><th>Undirected</th><th>Directed</th></tr>
<tr><td>Test</td><td>visited neighbour that is not the parent</td><td>neighbour that is grey</td></tr>
<tr><td>Extra state</td><td>parent vertex (or parent edge id)</td><td>3-colour array</td></tr>
<tr><td>Trap</td><td>multi-edges and self-loops</td><td>using the parent trick, which is wrong</td></tr>
<tr><td>Alternative</td><td>DSU, or m &gt; n − c</td><td>Kahn's algorithm: fewer than n vertices output</td></tr>
<tr><td>Complexity</td><td>O(n + m)</td><td>O(n + m)</td></tr></table>
<h4>The parent trick and its two traps</h4>
<ul>
<li><b>Multiple edges.</b> With edge 1–2 twice, standing at 2 you see 1 twice; both are "the parent", so the vertex test skips a real cycle of length 2. (Step through the preset <em>Parallel edges</em>: here it is only caught later, by luck, from 1's side where 2 is already finished, and walking <code>par[]</code> to print it never terminates.) The fix: pass the id of the edge you arrived on and skip only that one; switch "skip parent by" to <em>edge id</em>.</li>
<li><b>Self-loops.</b> An edge v–v is a cycle by itself; this code sees v as a visited non-parent neighbour and reports it (some variants skip <code>v == u</code>: check yours).</li>
<li><b>Counting:</b> a forest with n vertices and c components has n − c edges, so an undirected graph has a cycle ⇔ <b>m &gt; n − c</b>.</li>
</ul>
<h4>Common mistakes</h4>
<ul>
<li>Using the parent trick on a directed graph: reports cycles that are not there.</li>
<li>Using the colour method on an undirected graph without handling the parent: every edge looks like a 2-cycle (u → v → u).</li>
<li>Comparing parent vertices when the graph can have multiple edges: compare edge ids.</li>
<li>Only starting from vertex 1: a cycle may live in another component.</li>
<li>Forgetting to set black on exit: finished vertices stay grey and every cross edge looks like a cycle.</li>
<li>Returning as soon as one DFS finishes instead of continuing the outer loop over all vertices.</li>
</ul>
<h4>Check yourself</h4>
<ol>
<li>Why do we skip the parent in the undirected version?</li>
<li>Give a graph where the parent trick wrongly reports "no cycle", and say how to fix it.</li>
<li>Why is "already visited" not enough in a directed graph? What do grey and black mean, precisely?</li>
<li>A graph has n = 10, m = 12 and 2 components. Does it contain a cycle? How do you know without running anything?</li>
<li>How would you print the cycle rather than just report its existence?</li>
</ol>`,
  problems: [
    { id: '977E', name: 'Cyclic Components', note: 'undirected, degree based: a component is a cycle iff every degree is 2' },
    { id: '510B', name: 'Fox And Two Dots', note: 'cycle detection on a grid, with the parent rule' },
    { id: '1249B2', name: 'Books Exchange (hard version)', note: 'cycles in a permutation, the simplest directed cycle structure' },
  ],
  run(ctx) {
    const { g, opts } = ctx;
    if (g.directed && !opts.naive) return runColor(ctx);
    return runParent(ctx, !g.directed && opts.pskip === 'e', g.directed);
  },
});

function finishCycle(R, g, L, par, parE, cs, ce, closeE, panels, wrongDirected) {
  // walk par[] from cycleEnd up to cycleStart
  const cyc = [cs];
  const cEdges = [closeE];
  R.adj(null);
  R.panel('cyc', { type: 'list', title: 'vector&lt;int&gt; cycle', items: cyc.map((x) => ({ t: x, s: 'bad' })) });
  R.node(cs, 'bad'); R.edge(closeE, 'bad');
  R.line(L.c0); panels();
  R.snap(`Print it: <code>cycle = {${cs}}</code>, then walk <code>par[]</code> from <code>cycleEnd = ${ce}</code> up to <code>cycleStart = ${cs}</code>.`);
  let v = ce, guard = 0, broken = false;
  while (v !== cs && guard++ <= g.n) {
    if (v === 0) { broken = true; break; }
    cyc.push(v); R.node(v, 'bad');
    if (parE[v] >= 0 && par[v] !== 0) { R.edge(parE[v], 'bad'); cEdges.push(parE[v]); }
    R.panel('cyc', { type: 'list', title: 'vector&lt;int&gt; cycle', items: cyc.map((x) => ({ t: x, s: 'bad' })) });
    R.line([L.walk, L.pb]); panels();
    R.snap(`<code>v = ${v}</code>: push_back(${v}), then <code>v = par[${v}] = ${par[v]}</code>${par[v] === cs ? ` = cycleStart, stop.` : '.'}`);
    v = par[v];
  }
  if (broken) {
    if (parE[ce] >= 0) R.edge(parE[ce], 'bad');
    R.line(L.walk); panels();
    R.snap(`The par[] chain from ${ce} reached 0 without meeting ${cs} (the real C++ loop never stops here). ${cs} was <b>finished</b>, not an ancestor on the recursion stack. ` + (g.directed
      ? `So ${ed(g, closeE)} closes no cycle: <b>wrong answer!</b> "Visited" is too coarse for directed graphs: untick the wrong method to use three colours.`
      : `"Has a cycle" is right only by luck (the parallel edge was skipped at ${cs} as "the parent" and caught later from this side), and the cycle cannot be printed. Switch "skip parent by" to <em>edge id</em>.`));
    return;
  }
  cyc.push(cs);
  const fwd = cyc.slice().reverse();
  for (let x = 1; x <= g.n; x++) if (!fwd.includes(x)) R.node(x, 'dim');
  g.edges.forEach((_, e) => { if (!cEdges.includes(e)) R.edge(e, 'dim'); });
  R.panel('cyc', { type: 'list', title: 'vector&lt;int&gt; cycle', note: 'reversed', items: fwd.map((x) => ({ t: x, s: 'bad' })) });
  R.line([L.c1, L.rev]); panels();
  const len = fwd.length - 1;
  R.snap(`Cycle found: <b>${fwd.join(g.directed ? ' → ' : ' – ')}</b> (length ${len}${len === 1 ? ', a self-loop' : len === 2 && !g.directed ? ', two parallel edges' : ''}).` +
    (wrongDirected ? ` Here ${cs} really was on the stack, so this one is genuine; the method is still unsafe.` : ''));
}

/* ---------------- undirected: DFS with parent ---------------- */
function runParent({ g, adj, opts }, byId, wrongDirected) {
  const R = GV.recorder();
  const n = g.n;
  const { L } = parentCode(byId, wrongDirected);
  const vis = Array(n + 1).fill(false), par = Array(n + 1).fill(0), parE = Array(n + 1).fill(-1);
  const stack = [];
  let found = null, closeE = -1, lostParallel = false;
  let capNote = false;
  const snap = (msg, important) => {
    if (!important && R.frames.length >= CAP) { capNote = true; return; }
    if (capNote) { msg = '<i>(Large graph: minor "skip" steps are no longer shown.)</i> ' + msg; capNote = false; }
    R.snap(msg);
  };
  const panels = () => {
    R.panel('stk', { type: 'stack', title: 'call stack', items: stack.map((x, i) => ({ t: byId ? `dfs(${x.u},${x.p},${x.pe < 0 ? '-1' : '#' + x.pe})` : `dfs(${x.u},${x.p})`, s: i === stack.length - 1 ? 'cur' : 'gray' })) });
    const cs = {}; for (let v = 1; v <= n; v++) if (vis[v]) cs[v - 1] = R.getNode(v) === 'done' ? 'done' : 'gray';
    R.panel('vis', { type: 'array', title: 'vis[]', values: vis.slice(1).map((b) => (b ? 1 : 0)), cellState: cs });
    R.panel('par', { type: 'array', title: 'par[]', values: par.slice(1) });
  };
  const restack = () => stack.forEach((x, i) => R.node(x.u, i === stack.length - 1 ? 'cur' : 'gray'));

  function dfs(u, p, pe) {
    vis[u] = true; par[u] = p; parE[u] = pe;
    stack.push({ u, p, pe }); restack();
    R.adj(u, -1); R.line([L.vis, L.par]); panels();
    snap(`Enter <code>dfs(${u}, ${p}${byId ? ', ' + (pe < 0 ? '-1' : '#' + pe) : ''})</code>: <code>vis[${u}] = true</code>, <code>par[${u}] = ${p}</code>. ` +
      (adj[u].length ? `Neighbours: ${adj[u].map((x) => x.v).join(' ')}.` : 'No neighbours.'), true);
    for (let i = 0; i < adj[u].length; i++) {
      const { v, e } = adj[u][i];
      R.adj(u, i, Array.from({ length: i }, (_, j) => j));
      const prev = R.getEdge(e);
      R.edge(e, 'cur').ring(v);
      const skip = byId ? e === pe : v === p;
      if (skip) {
        R.line(L.skip); panels();
        if (!byId && e !== pe && !g.directed) {
          lostParallel = true;
          snap(`Look at ${v}: <code>v == p</code> → continue. <b>But</b> this is a different edge (#${e}) from the one we came along (#${pe}): a parallel edge. Skipping it by vertex throws away a real cycle ${p} – ${u} – ${p}!`);
          R.edge(e, 'skip');
        } else {
          snap(byId ? `Look at ${v}: edge id #${e} == pe → continue. This is the edge we came along (${ed(g, e)}); only this one is skipped.`
            : `Look at ${v}: <code>v == p</code> (${p} is the parent) → continue. That is the edge ${ed(g, e)} we just walked, not a cycle.`);
          R.edge(e, prev === 'cur' || prev === 'idle' ? null : prev);
        }
        R.ring(v, false);
        continue;
      }
      if (vis[v]) {
        found = [v, u]; closeE = e;
        const fin = R.getNode(v) === 'done';
        R.edge(e, 'bad').node(v, 'bad');
        R.line([L.if, L.found, L.rett]); panels();
        snap(`Look at ${v}: <code>vis[${v}] = true</code> and ${v} is not where we came from → <b>cycle!</b> <code>cycleStart = ${v}</code>, <code>cycleEnd = ${u}</code>, return true.` +
          (fin ? ` Careful: ${v} is already <b>finished</b>, not an ancestor still on the stack.` : ''), true);
        R.ring(v, false);
        return true;
      }
      R.line(L.call); panels();
      snap(`Look at ${v}: not visited → call <code>dfs(${v}, ${u}${byId ? ', #' + e : ''})</code>. ${ed(g, e)} is a tree edge.`, true);
      R.ring(v, false); R.edge(e, 'tree');
      if (dfs(v, u, e)) return true;
      restack();
    }
    stack.pop(); R.node(u, 'done'); restack();
    R.adj(u, -1, adj[u].map((_, j) => j)); R.line(L.retf); panels();
    snap(`All neighbours of ${u} checked, no cycle below it: <code>dfs(${u})</code> returns false.`, true);
    return false;
  }

  R.line(L.loop); panels();
  snap(`n = ${n}, m = ${g.edges.length}${wrongDirected ? ', <b>directed</b>, but we run the undirected method on purpose' : ''}. Loop over every vertex and start a DFS at each unvisited one.`, true);
  for (let i = 1; i <= n && !found; i++) {
    if (vis[i]) continue;
    R.adj(null); R.line([L.loop, L.lcall]); panels();
    snap(`<code>i = ${i}</code>: <code>vis[${i}] = false</code> → <code>dfs(${i}, 0)</code>. Parent 0 means "no parent" (1-indexing).`, true);
    dfs(i, 0, -1);
  }
  const T = truth(g, adj);
  if (found) {
    const [cs, ce] = found;
    const onStack = stack.some((x) => x.u === cs);
    R.adj(null); R.line([L.call, L.lcall]); panels();
    snap(`The <code>true</code> travels up: every open call returns true at once${stack.length > 1 ? ` (${stack.map((x) => 'dfs(' + x.u + ')').reverse().join(' → ')})` : ''}, and <code>main</code> breaks out of the loop.`, true);
    stack.length = 0;
    finishCycle(R, g, L, par, parE, cs, ce, closeE, panels, wrongDirected && onStack);
  } else {
    R.adj(null); R.line(L.none); panels();
    let msg = `Every DFS returned false: <b>no cycle</b>.`;
    if (!g.directed) msg += ` Check by counting: m = ${g.edges.length}, n − c = ${n} − ${T.c} = ${n - T.c}; ` + (T.cyc ? `m &gt; n − c, so there <b>is</b> a cycle.` : `m ≤ n − c, a forest.`);
    if (T.cyc) msg += lostParallel ? ` <b>Wrong answer!</b> The parallel edges were skipped as "the parent". Switch "skip parent by" to <em>edge id</em>.`
      : g.directed ? ` <b>Wrong answer!</b> There is a directed cycle: the parent test skipped the edge back to the parent, which in a directed graph is a real 2-cycle. Use three colours.` : '';
    R.panel('res', { type: 'text', title: 'result', html: T.cyc ? '<b>"no cycle", which is WRONG</b>' : 'no cycle' + (!g.directed ? ` (forest: m = ${g.edges.length} = n − c)` : '') });
    snap(msg, true);
  }
  return R.frames;
}

/* ---------------- directed: three colours ---------------- */
function runColor({ g, adj }) {
  const R = GV.recorder();
  const n = g.n;
  const { L } = colorCode();
  const color = Array(n + 1).fill(0), par = Array(n + 1).fill(0), parE = Array(n + 1).fill(-1);
  const stack = [];
  let found = null, closeE = -1;
  let capNote = false;
  const snap = (msg, important) => {
    if (!important && R.frames.length >= CAP) { capNote = true; return; }
    if (capNote) { msg = '<i>(Large graph: minor "skip" steps are no longer shown.)</i> ' + msg; capNote = false; }
    R.snap(msg);
  };
  const panels = () => {
    R.panel('stk', { type: 'stack', title: 'call stack', note: 'exactly the grey vertices', items: stack.map((u, i) => ({ t: `dfs(${u})`, s: i === stack.length - 1 ? 'cur' : 'gray' })) });
    const cs = {}; for (let v = 1; v <= n; v++) if (color[v]) cs[v - 1] = color[v] === 1 ? 'gray' : 'done';
    R.panel('col', { type: 'array', title: 'color[]', note: '0 white · 1 grey · 2 black', values: color.slice(1), cellState: cs });
    R.panel('par', { type: 'array', title: 'par[]', values: par.slice(1) });
  };
  const restack = () => stack.forEach((u, i) => R.node(u, i === stack.length - 1 ? 'cur' : 'gray'));

  function dfs(u) {
    color[u] = 1; stack.push(u); restack();
    R.adj(u, -1); R.line(L.grey); panels();
    snap(`Enter <code>dfs(${u})</code>: <code>color[${u}] = 1</code>, grey: we are inside its call. ` + (adj[u].length ? `Out-neighbours: ${adj[u].map((x) => x.v).join(' ')}.` : 'No outgoing edges.'), true);
    for (let i = 0; i < adj[u].length; i++) {
      const { v, e } = adj[u][i];
      R.adj(u, i, Array.from({ length: i }, (_, j) => j));
      R.edge(e, 'cur').ring(v);
      if (color[v] === 1) {
        found = [v, u]; closeE = e;
        R.edge(e, 'bad').node(v, 'bad');
        R.line([L.if, L.found, L.rett]); panels();
        snap(`Look at ${v}: <code>color[${v}] == 1</code>, grey: ${v === u ? `${u} itself (a self-loop)` : `${v} is still on the recursion stack`}. ${ed(g, e)} is a <b>back edge → cycle!</b> <code>cycleStart = ${v}</code>, <code>cycleEnd = ${u}</code>.`, true);
        R.ring(v, false);
        return true;
      }
      if (color[v] === 0) {
        par[v] = u; parE[v] = e;
        R.line([L.white, L.par, L.call]); panels();
        snap(`Look at ${v}: white → <code>par[${v}] = ${u}</code>, call <code>dfs(${v})</code>.`, true);
        R.ring(v, false); R.edge(e, 'tree');
        if (dfs(v)) return true;
        restack();
        continue;
      }
      R.line(L.white); panels();
      snap(`Look at ${v}: <code>color[${v}] == 2</code>, black: ${v} is completely finished, nothing below it can lead back to us → fine, <b>not</b> a cycle. (A "visited" test would wrongly report one here.)`);
      R.ring(v, false); R.edge(e, 'cross');
    }
    color[u] = 2; stack.pop(); R.node(u, 'done'); restack();
    R.adj(u, -1, adj[u].map((_, j) => j)); R.line([L.black, L.retf]); panels();
    snap(`Done with ${u}: <code>color[${u}] = 2</code>, black. Return false.`, true);
    return false;
  }

  R.line(L.loop); panels();
  snap(`n = ${n}, m = ${g.edges.length}, directed. All vertices white (<code>color = 0</code>). Start a DFS at every white vertex.`, true);
  for (let i = 1; i <= n && !found; i++) {
    if (color[i]) continue;
    R.adj(null); R.line([L.loop, L.lcall]); panels();
    snap(`<code>i = ${i}</code>: <code>color[${i}] == 0</code> → <code>dfs(${i})</code>.`, true);
    dfs(i);
  }
  if (found) {
    const [cs, ce] = found;
    R.adj(null); R.line([L.call, L.lcall]); panels();
    snap(`The <code>true</code> travels up through every open call${stack.length > 1 ? ` (${stack.slice().reverse().map((x) => 'dfs(' + x + ')').join(' → ')})` : ''}; <code>main</code> breaks out of the loop.`, true);
    stack.length = 0;
    finishCycle(R, g, L, par, parE, cs, ce, closeE, panels, false);
  } else {
    R.adj(null); R.line(L.none); panels();
    R.panel('res', { type: 'text', title: 'result', html: 'no cycle: the graph is a DAG' });
    snap(`Every vertex is black and no grey neighbour was ever seen: <b>no cycle</b>, the graph is a DAG. Note the edges to black vertices (dotted): visited twice as a target, and only the colour told us it was harmless.`, true);
  }
  return R.frames;
}
})();

</script>
<script>/* 14-components.js */
/* Part 5: connected components (comp[] labelling on a graph, DFS or BFS fill) and flood fill on a grid (uses GV.grid from 12-grid.js). */
(function () {
const GV = window.GV;
const grid = GV.grid;
// component k -> categorical colour; red (c1, same as "current") is used last
const PAL = ['c0', 'c2', 'c4', 'c6', 'c3', 'c7', 'c5', 'c1'];
const colOf = (k) => PAL[(k - 1 + 800) % 8];
const sw = (k) => `<span class="comp-sw sw-${colOf(k)}"></span>`;
GV.addStyle(`.comp-sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.comp-ans { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.comp-ans span:nth-child(odd) { color: var(--muted); }
.comp-ans b { font-family: var(--font-mono); }`);

function listing(lines) {
  const L = {}, out = [];
  for (const l of lines) {
    if (l == null || l === false) continue;
    if (Array.isArray(l)) { L[l[0]] = out.length + 1; out.push(l[1]); } else out.push(l);
  }
  return { text: out.join('\n'), L };
}
const plural = (k, w) => `${k} ${w}${k === 1 ? '' : 's'}`;
const setTxt = (a) => '{' + a.join(', ') + '}';

/* ============================================================ connected components ==== */
const MAIN = (call) => [
  '',
  'int main() {',
  '    // ... read n, m and the edges into adj ...',
  ['assign', '    comp.assign(n + 1, 0);'],
  '    compSize.assign(1, 0);          // index 0 unused',
  '    int c = 0;',
  ['loop', '    for (int i = 1; i <= n; i++) {'],
  ['test', '        if (comp[i] == 0) {'],
  ['cinc', '            c++;'],
  ['cpush', '            compSize.push_back(0);'],
  ['start', `            ${call}(i, c);`],
  '        }',
  '    }',
  ['ans', '    // c components; u, v connected <=> comp[u] == comp[v]'],
  '}',
];
const CC_DFS = listing([
  'vector<int> adj[N];',
  'vector<int> comp;        // comp[v] = component id of v, 0 means unassigned',
  'vector<int> compSize;    // compSize[c] = number of vertices in component c',
  '',
  ['fn', 'void dfs(int u, int c) {'],
  ['comp', '    comp[u] = c;'],
  ['size', '    compSize[c]++;'],
  ['for', '    for (int v : adj[u])'],
  ['if', '        if (comp[v] == 0)'],
  ['call', '            dfs(v, c);'],
  '}',
  ...MAIN('dfs'),
]);
const CC_BFS = listing([
  'vector<int> adj[N];',
  'vector<int> comp;        // comp[v] = component id of v, 0 means unassigned',
  'vector<int> compSize;    // compSize[c] = number of vertices in component c',
  '',
  ['fn', 'void bfs(int s, int c) {      // same labels, no recursion'],
  '    queue<int> q;',
  ['s0', '    comp[s] = c; compSize[c]++;'],
  ['push0', '    q.push(s);'],
  ['while', '    while (!q.empty()) {'],
  ['pop', '        int u = q.front(); q.pop();'],
  ['for', '        for (int v : adj[u])'],
  ['if', '            if (comp[v] == 0) {'],
  ['set', '                comp[v] = c; compSize[c]++;'],
  ['push', '                q.push(v);'],
  '            }',
  '    }',
  '}',
  ...MAIN('bfs'),
]);

GV.registerTopic({
  id: 'components', part: 5, order: 0,
  title: 'Connected Components',
  blurb: 'Loop over every vertex; each one still unlabelled starts a new component, and one DFS or BFS from it labels the whole component with <code>comp[v] = c</code>.',
  complexity: 'O(n + m)',
  chips: ['comp[]', 'compSize[]', 'outer loop'],
  graph: { preset: 'G1', directed: false, weighted: false, presets: ['G1', 'CC-4', 'K4', 'G3', 'BP-yes', 'BP-sq'] },
  options: [{ id: 'mode', type: 'select', label: 'Fill with', default: 'dfs', choices: [['dfs', 'DFS (recursive)'], ['bfs', 'BFS (queue)']] }],
  legend: [['cur', 'current vertex u'], ['c0', 'colour = comp[v]'], ['e:cur', 'edge being checked'], ['e:tree', 'reached a new vertex']],
  code: (o) => (o.mode === 'bfs' ? CC_BFS : CC_DFS).text,
  notes: `
<h4>Key idea</h4>
<p>A <b>connected component</b> is a maximal set of vertices that can all reach each other. The outer loop <code>for i = 1..n</code> finds a vertex nobody has labelled, so it belongs to a component nobody has touched yet: <code>c++</code> and fill all of it. When the loop ends every vertex was filled exactly once and <code>c</code> is the count. DFS or BFS makes no difference to the answer; DFS is shorter, BFS is safe on very deep graphs.</p>
<p>On G1: <code>comp = [_, 1,1,1,1,1,1, 2,2]</code>, <code>compSize = [_, 6, 2]</code>. Not connected; the largest component has 6 vertices.</p>
<h4>What comp[] answers in O(1)</h4>
<ul><li>are u and v connected: <code>comp[u] == comp[v]</code></li><li>how many components: <code>c</code>; is the graph connected: <code>c == 1</code></li>
<li>edges needed to connect everything: <code>c − 1</code> (join the components in a chain)</li>
<li>a component with k vertices and exactly k − 1 edges is a tree; more edges means a cycle (977E). Count edges as (sum of degrees) / 2.</li></ul>
<h4>Common mistakes</h4>
<ul>
<li><b>Starting DFS only from vertex 1.</b> Loop over all vertices.</li>
<li><b>Forgetting isolated vertices.</b> A vertex with degree 0 is its own component (try the <em>Four components</em> preset).</li>
<li><b>Using this on a directed graph.</b> You want weakly connected (ignore directions) or strongly connected components (Part 13).</li>
<li>Many "are u and v connected" queries while edges are being <b>added</b>: use DSU (Part 9) instead.</li>
</ul>
<h4>Check yourself</h4>
<ol><li>Why does the outer loop give the correct component count?</li><li>G1 has two components. How many edges must be added to make it connected?</li>
<li>A component has 7 vertices and 7 edges. What can you say about it?</li><li>What is the component count of a graph with n vertices and no edges?</li></ol>`,
  problems: [
    { id: '217A', name: 'Ice Skating', note: 'components on points sharing a row or column; answer c − 1' },
    { id: '977E', name: 'Cyclic Components', note: 'component where every vertex has degree 2' },
    { id: '445B', name: 'DZY Loves Chemistry', note: 'components; the answer is a power of two' },
    { id: '1176E', name: 'Cover it!', note: 'colour by BFS layer parity, take the smaller class' },
    { id: 'CSES 1666', name: 'Building Roads', note: 'count components, print c − 1 connecting roads', url: 'https://cses.fi/problemset/task/1666' },
  ],
  run({ g, adj, opts }) {
    const n = g.n, R = GV.recorder();
    const bfs = opts.mode === 'bfs';
    const L = (bfs ? CC_BFS : CC_DFS).L;
    const comp = Array(n + 1).fill(0), size = [0], members = [[]];
    let c = 0;
    const F = () => R.frames.length;
    const lvl = () => (F() < 470 ? 2 : F() < 575 ? 1 : 0); // 2 = every step, 1 = new vertices only, 0 = summaries only
    const vtx = (v) => `<code>${v}</code>`;
    let stackItems = [];
    const panels = (chg, hiC) => {
      R.panel('st', bfs
        ? { type: 'queue', title: 'queue&lt;int&gt; q', items: stackItems.map((v, i) => ({ t: v, s: colOf(c) })), hi: stackItems.length ? [0] : [] }
        : { type: 'stack', title: 'call stack', note: 'dfs(u, c)', items: stackItems.map((v, i) => ({ t: `dfs(${v},${c})`, s: i === stackItems.length - 1 ? 'cur' : colOf(c) })) });
      const cs = {};
      for (let v = 1; v <= n; v++) if (comp[v]) cs[v - 1] = colOf(comp[v]);
      R.panel('comp', { type: 'array', title: 'comp[]', note: '0 = unassigned', start: 1, values: comp.slice(1), chg: chg ? [chg - 1] : [], cellState: cs });
      R.panel('size', { type: 'table', title: 'compSize[]', note: `c = ${c}`, head: ['c', 'size', 'vertices'], rows: size.slice(1).map((sz, i) => [sw(i + 1) + (i + 1), sz, members[i + 1].join(' ')]), hi: hiC ? [hiC - 1] : [] });
    };
    panels();
    R.line(L.assign).snap(`<code>comp[1..${n}] = 0</code>: no vertex has a component yet. <code>c = 0</code>. The outer loop will visit vertices 1 to ${n} in order.`);
    let skipRun = [];
    const flushSkips = () => {
      if (!skipRun.length) return;
      if (lvl() >= 2) {
        R.adj(null); panels();
        const a = skipRun[0], b = skipRun[skipRun.length - 1];
        R.line([L.loop, L.test]).snap(skipRun.length === 1
          ? `i = ${a}: <code>comp[${a}] = ${comp[a]}</code>, already labelled by an earlier search → skip.`
          : `i = ${a}..${b}: all already labelled (${skipRun.map((v) => `comp[${v}]=${comp[v]}`).join(', ')}) → skip.`);
      }
      skipRun = [];
    };
    for (let i = 1; i <= n; i++) {
      if (comp[i]) { skipRun.push(i); continue; }
      flushSkips();
      c++; size.push(0); members.push([]);
      const col = colOf(c);
      if (lvl() >= 1) {
        R.adj(null); stackItems = []; panels(null, c);
        R.node(i, 'src');
        R.line([L.test, L.cinc, L.cpush, L.start]).snap(`i = ${i}: <code>comp[${i}] == 0</code> → a component nobody has touched yet. <code>c = ${c}</code>, <code>compSize.push_back(0)</code>, call <code>${bfs ? 'bfs' : 'dfs'}(${i}, ${c})</code>.`);
      }
      const label = (v) => { comp[v] = c; size[c]++; members[c].push(v); R.label(v, `comp=${c}`); };
      if (!bfs) {
        const stk = [];
        let pre = '';
        const enter = (u) => {
          label(u);
          if (stk.length) R.node(stk[stk.length - 1].u, col).ring(stk[stk.length - 1].u, true);
          stk.push({ u, i: 0 }); stackItems = stk.map((f) => f.u);
          R.node(u, 'cur');
          if (lvl() >= 1) { R.adj(u, -1); panels(u, c); R.line([L.comp, L.size]).snap(`${pre}<code>dfs(${u}, ${c})</code>: <code>comp[${u}] = ${c}</code>, <code>compSize[${c}] = ${size[c]}</code>. Now scan <code>adj[${u}]</code>${adj[u].length ? '' : ', which is empty'}.`); }
          pre = '';
        };
        enter(i);
        while (stk.length) {
          const f = stk[stk.length - 1], u = f.u;
          if (f.i >= adj[u].length) {
            stk.pop(); stackItems = stk.map((x) => x.u);
            R.node(u, col).ring(u, false);
            if (stk.length) { const p = stk[stk.length - 1].u; R.node(p, 'cur').ring(p, false); pre = `<code>dfs(${u})</code> is finished, back in <code>dfs(${p})</code>. `; }
            continue;
          }
          const { v, e } = adj[u][f.i];
          const done = Array.from({ length: f.i }, (_, j) => j);
          const prevE = R.getEdge(e);
          if (comp[v] === 0) {
            R.edge(e, 'tree');
            if (lvl() >= 1) { R.adj(u, f.i, done); panels(); R.line([L.for, L.if, L.call]).snap(`${pre}Neighbour ${vtx(v)} of ${vtx(u)}: <code>comp[${v}] == 0</code> → recurse <code>dfs(${v}, ${c})</code>.`); pre = ''; }
            f.i++;
            enter(v);
          } else {
            if (lvl() >= 2) {
              R.edge(e, 'cur'); R.adj(u, f.i, done); panels();
              R.line([L.for, L.if]).snap(`${pre}Neighbour ${vtx(v)} of ${vtx(u)}: <code>comp[${v}] = ${comp[v]}</code>, already labelled → skip.` + (v === u ? ' (self-loop)' : ''));
              pre = '';
              R.edge(e, prevE === 'cur' ? null : prevE);
            }
            f.i++;
          }
        }
      } else {
        const q = [i];
        let head = 0;
        label(i); R.node(i, col).ring(i, true); stackItems = [i];
        if (lvl() >= 1) { R.adj(null); panels(i, c); R.line([L.s0, L.push0]).snap(`<code>bfs(${i}, ${c})</code>: <code>comp[${i}] = ${c}</code>, <code>compSize[${c}] = 1</code>, push ${i}. A vertex is labelled when it is <b>pushed</b>, so it can never enter the queue twice.`); }
        while (head < q.length) {
          const u = q[head++]; stackItems = q.slice(head);
          R.node(u, 'cur').ring(u, false);
          if (lvl() >= 2) { R.adj(u, -1); panels(); R.line(L.pop).snap(`Pop ${vtx(u)}. Scan <code>adj[${u}]</code>${adj[u].length ? '' : ' (empty)'}.`); }
          adj[u].forEach(({ v, e }, j) => {
            const done = Array.from({ length: j }, (_, x) => x);
            if (comp[v] === 0) {
              label(v); q.push(v); stackItems = q.slice(head);
              R.node(v, col).ring(v, true); R.edge(e, 'tree');
              if (lvl() >= 1) { R.adj(u, j, done); panels(v, c); R.line([L.if, L.set, L.push]).snap(`Neighbour ${vtx(v)}: <code>comp[${v}] == 0</code> → <code>comp[${v}] = ${c}</code>, <code>compSize[${c}] = ${size[c]}</code>, push.`); }
            } else if (lvl() >= 2) {
              const prevE = R.getEdge(e);
              R.edge(e, 'cur'); R.adj(u, j, done); panels();
              R.line([L.for, L.if]).snap(`Neighbour ${vtx(v)}: <code>comp[${v}] = ${comp[v]}</code>, already labelled → skip.`);
              R.edge(e, prevE === 'cur' ? null : prevE);
            }
          });
          R.node(u, col);
        }
      }
      // component finished: colour its edges
      g.edges.forEach((ed, e) => { if (comp[ed.u] === c) R.edge(e, col); });
      stackItems = [];
      R.adj(null); panels(null, c);
      R.line(L.start).snap(`<code>${bfs ? 'bfs' : 'dfs'}(${i}, ${c})</code> returned. Component ${c} = ${setTxt(members[c])}, size <b>${size[c]}</b>. Back to the outer loop.`);
    }
    flushSkips();
    // summary
    let big = 1;
    for (let k = 2; k <= c; k++) if (size[k] > size[big]) big = k;
    const ecount = Array(c + 1).fill(0);
    g.edges.forEach((ed) => ecount[comp[ed.u]]++);
    stackItems = [];
    R.adj(null); panels();
    R.panel('size', { type: 'table', title: 'components', note: `c = ${c}`, head: ['c', 'size', 'edges', 'tree?', 'vertices'],
      rows: size.slice(1).map((sz, k) => [sw(k + 1) + (k + 1), sz, ecount[k + 1], ecount[k + 1] === sz - 1 ? 'yes' : 'no (cycle)', members[k + 1].join(' ')]) });
    R.panel('ans', { type: 'text', title: 'answers', html: `<div class="comp-ans"><span>components</span><b>c = ${c}</b><span>connected?</span><b>${c === 1 ? 'yes' : 'no'}</b><span>largest</span><b>${size[big]} (component ${big})</b><span>edges to connect</span><b>c − 1 = ${c - 1}</b></div>` });
    R.line(L.ans).snap(`Done: <b>${plural(c, 'component')}</b>, sizes ${size.slice(1).join(', ')}. ` + (c === 1 ? 'The graph is connected.' : `Not connected; ${plural(c - 1, 'extra edge')} would join them in a chain. Ask "same component?" as <code>comp[u] == comp[v]</code>.`));
    return R.frames;
  },
});

const FF_HEAD = [
  'int R, C;',
  'vector<string> g;',
  'vector<vector<bool>> vis;',
  'vector<vector<int>> id;              // region id of each cell (for colouring)',
  'int dx[4] = {-1,1,0,0}, dy[4] = {0,0,-1,1};',
  'int regions = 0, best = 0;',
  '',
];
const FF_MAIN = [
  '',
  'int main() {',
  '    // read R, C, g',
  ['assign', '    vis.assign(R, vector<bool>(C, false));'],
  '    id.assign(R, vector<int>(C, 0));',
  ['outer', '    for (int i = 0; i < R; i++)'],
  '        for (int j = 0; j < C; j++)',
  ['if', "            if (g[i][j] != '#' && !vis[i][j]) {"],
  ['reg', '                regions++;'],
  ['best', '                best = max(best, fill(i, j));'],
  '            }',
  ['out', '    cout << regions << " " << best << "\\n";'],
  '}',
];
const FF_DFS = listing([
  ...FF_HEAD,
  ['fn', 'int fill(int x, int y) {             // returns the area of this region'],
  ['vis', '    vis[x][y] = true; id[x][y] = regions;'],
  ['area', '    int area = 1;'],
  ['for', '    for (int k = 0; k < 4; k++) {'],
  ['nx', '        int nx = x + dx[k], ny = y + dy[k];'],
  ['bounds', '        if (nx < 0 || nx >= R || ny < 0 || ny >= C) continue;'],
  ['skip', "        if (g[nx][ny] == '#' || vis[nx][ny]) continue;"],
  ['call', '        area += fill(nx, ny);'],
  '    }',
  ['ret', '    return area;'],
  '}',
  ...FF_MAIN,
]);
const FF_BFS = listing([
  ...FF_HEAD,
  ['fn', 'int fill(int sx, int sy) {           // BFS: same answer, no deep recursion'],
  '    queue<pair<int,int>> q;',
  ['s0', '    vis[sx][sy] = true; id[sx][sy] = regions;'],
  ['push0', '    q.push({sx, sy});'],
  '    int area = 0;',
  ['while', '    while (!q.empty()) {'],
  ['pop', '        auto [x, y] = q.front(); q.pop();'],
  ['inc', '        area++;'],
  ['for', '        for (int k = 0; k < 4; k++) {'],
  ['nx', '            int nx = x + dx[k], ny = y + dy[k];'],
  ['bounds', '            if (nx < 0 || nx >= R || ny < 0 || ny >= C) continue;'],
  ['skip', "            if (g[nx][ny] == '#' || vis[nx][ny]) continue;"],
  ['set', '            vis[nx][ny] = true; id[nx][ny] = regions;'],
  ['push', '            q.push({nx, ny});'],
  '        }',
  '    }',
  ['ret', '    return area;'],
  '}',
  ...FF_MAIN,
]);

  code: (o) => (o.mode === 'bfs' ? FF_BFS : FF_DFS).text,
  notes: `
<h4>Key idea</h4>
<p>Flood fill is the components pattern on a grid: scan every cell; a free cell that is not visited starts a new region, so <code>regions++</code> and fill everything connected to it. <code>fill</code> returns the area, so the largest region is <code>max</code> over the calls.</p>
<p>On G4 (20 cells, 6 walls) every free cell reaches every other: <b>1 region of area 14</b>. Wall off <code>(2,2)</code> as well and the board splits into <b>3 regions</b>: the left block of 5, the right block of 7, and the single cell <code>(3,2)</code>, walled in on all four sides. Isolated cells are exactly the case people forget.</p>
<h4>Recursion depth</h4>
<p>A 1000 × 1000 snake-shaped corridor means up to 10⁶ nested calls: stack overflow on many judges. For big grids write <code>fill</code> with a BFS queue (switch <em>Fill with</em> to BFS: same regions, same areas, flat call stack).</p>
<h4>Variations</h4>
<table><tr><td>count islands</td><td>flood fill over <code>'1'</code> cells</td></tr><tr><td>largest island</td><td>fill returns the area</td></tr><tr><td>colour each region</td><td>store <code>id[x][y]</code></td></tr><tr><td>cell id for DSU</td><td><code>x * C + y</code></td></tr></table>
<h4>Common mistakes</h4>
<ul>
<li><b>Recursive flood fill on a 10⁶-cell grid.</b> Use BFS.</li>
<li><b>Marking <code>vis</code> only on the starting cell</b> and forgetting it inside the loop, so cells are entered repeatedly.</li>
<li><b>Bounds check after reading <code>g[nx][ny]</code></b>: out-of-range read.</li>
<li><b>Reading the grid with <code>cin &gt;&gt; g[i]</code> without sizing the vector</b> first.</li>
</ul>
<h4>Check yourself</h4>
<ol><li>Why does the double loop count each region exactly once?</li><li>Why is recursive flood fill dangerous on a 1000 × 1000 grid, and what do you do instead?</li>
<li>Trace G4 with <code>(2,2)</code> walled by hand. Which region does <code>(3,2)</code> belong to?</li></ol>`,
  problems: [
    { id: 'CSES 1192', name: 'Counting Rooms', note: 'exactly this page: count the regions', url: 'https://cses.fi/problemset/task/1192' },
    { id: '377A', name: 'Maze', note: 'grid DFS with a counting twist' },
    { id: '1365D', name: 'Solve The Maze', note: 'block greedily, then one flood fill from the exit' },
    { id: '510B', name: 'Fox And Two Dots', note: 'cycle detection on a grid, with the parent rule' },
  ],
  renderMain(f, el, ctx) { const fx = f.extra || {}; grid.draw(el, fx.G || grid.norm(ctx.grid, { binary: true }), fx); },

    const C = G.C, N = G.R * C, id = (r, c) => r * C + c, rc = (i) => [(i / C) | 0, i % C];
