  run({ g, opts }) {
    const R = GV.recorder();
    const code = kruskalCode(opts), ln = lineFinder(code);
    const n = g.n, m = g.edges.length, early = opts.early !== false;
    const order = g.edges.map((e, i) => i).sort((a, b) => g.edges[a].w - g.edges[b].w || a - b);
    const parent = Array.from({ length: n + 1 }, (_, i) => i), sz = Array(n + 1).fill(1);
    const color = {}; let nextColor = 0;
    const status = Array(m).fill('');      // per sorted position
    let total = 0, used = 0;

    // pre-count how many edges get examined, to choose the level of detail
    let examined = 0;
    {
      const p = parent.slice(), f = (x) => (p[x] === x ? x : (p[x] = f(p[x])));
      let u = 0;
      for (const e of order) { examined++; const a = f(g.edges[e].u), b = f(g.edges[e].v); if (a !== b) { p[b] = a; u++; if (early && u === n - 1) break; } }
    }
    const full = 2 * examined + 8 <= 600;            // 2 frames per edge, else 1
    const collapseRejects = !full && examined + 8 > 600;

    function find(x, path) {
      while (parent[x] !== x) { path.push(x); x = parent[x]; }
      return x;
    }
    function compress(path, r, chg) { for (const y of path) if (parent[y] !== r) { parent[y] = r; chg.push(y); } }
    function paintNodes(ring) {
      R.clearNodes();
      const cnt = {};
      for (let v = 1; v <= n; v++) { const r = find(v, []); cnt[r] = (cnt[r] || 0) + 1; }
      for (let v = 1; v <= n; v++) { const r = find(v, []); if (cnt[r] > 1) R.node(v, C8[color[r] % 8]); }
      (ring || []).forEach((v) => R.ring(v));
    }
    function groups() {
      const by = {};
      for (let v = 1; v <= n; v++) { const r = find(v, []); (by[r] = by[r] || []).push(v); }
      const list = Object.keys(by).map((r) => ({ r: +r, vs: by[r] })).sort((a, b) => b.vs.length - a.vs.length || a.vs[0] - b.vs[0]);
      const shown = list.slice(0, 10).map((x) => x.vs.length > 1 ? `<span class="mst-grp" style="color: var(--${C8[color[x.r] % 8]})">{${x.vs.join(',')}}</span>` : `{${x.vs.join(',')}}`);
      return shown.join(' ') + (list.length > 10 ? ` … (${list.length} groups)` : '');
    }
    const tableRows = () => order.map((e, k) => [k + 1, ename(g, e), g.edges[e].w, status[k]]);
    function panels(cur, chg, hiV) {
      R.panel('tot', { type: 'text', title: 'answer so far', html: `<div class="mst-sum">total = <b>${total}</b> &nbsp; used = <b>${used}</b> / n − 1 = ${Math.max(0, n - 1)}<br>groups: ${groups()}</div>` });
      const W = windowRows(tableRows(), cur, 9);
      R.panel('t', { type: 'table', title: 'edges sorted by w', note: cur == null ? '' : `row ${cur + 1} of ${m}`, head: ['#', 'edge', 'w', 'result'], rows: W.rows, hi: W.hi });
      R.panel('par', { type: 'array', title: 'parent[]', note: 'root: parent[v] = v', values: parent.slice(1), chg: (chg || []).map((v) => v - 1), hi: (hiV || []).map((v) => v - 1),
        cellState: Object.fromEntries(Array.from({ length: n }, (_, i) => i + 1).filter((v) => parent[v] === v && sz[v] > 1).map((v) => [v - 1, C8[color[v] % 8]])) });
      R.extra({ par: parent.slice(), chg: chg || [] });
    }

    // frame: input
    panels(null);
    R.line(ln('long long kruskal')).snap(`Kruskal on n = ${n}, m = ${m}. The edge list is all we need; every vertex starts alone in its own DSU group.`);
    R.line(ln('sort(edges')).snap(m
      ? `Sort the edges by weight: ${order.slice(0, 6).map((e) => `${ename(g, e)} (${g.edges[e].w})`).join(', ')}${m > 6 ? ', …' : '.'} Cheapest first.`
      : 'There are no edges to sort.');
    R.line(ln('init(n);')).snap(`<code>init(${n})</code>: <code>parent[i] = i</code>, <code>sz[i] = 1</code>. ${n} separate groups.`);

    let k = 0, rejRun = [];
    const flushRejects = () => {
      if (!rejRun.length) return;
      paintNodes();
      panels(rejRun[rejRun.length - 1]);
      R.line(ln('if (unite(e.u')).snap(`${rejRun.length} edges in a row (${rejRun.map((kk) => ename(g, order[kk])).slice(0, 5).join(', ')}${rejRun.length > 5 ? ', …' : ''}) join vertices already in one group → all rejected.`);
      rejRun = [];
    };
    for (; k < order.length; k++) {
      const e = order[k], { u, v, w } = g.edges[e];
      const pu = [], pv = [];
      const ru = find(u, pu), rv = find(v, pv);
      const chg = [];
      compress(pu, ru, chg); compress(pv, rv, chg);
      const compTxt = chg.length ? ` Path compression on the way: ${chg.map((x) => `parent[${x}] = ${parent[x]}`).join(', ')}.` : '';
      if (ru === rv) {
        status[k] = '<span class="mst-no">reject</span>';
        R.edge(e, 'rejected');
        if (collapseRejects) { rejRun.push(k); continue; }
        if (full) {
          R.edge(e, 'cur'); status[k] = '<span class="mst-wait">?</span>';
          paintNodes([u, v]); panels(k, chg, [u, v]);
          R.line([ln('if (unite(e.u'), ln('a = find(a)')]).snap(`Try edge ${u}–${v} (w = ${w}). <code>find(${u}) = ${ru}</code>, <code>find(${v}) = ${rv}</code>.${compTxt}`);
          status[k] = '<span class="mst-no">reject</span>'; R.edge(e, 'rejected');
          paintNodes(); panels(k, [], [u, v]);
          R.line(ln('if (a == b) return false')).snap(`Same root ${ru}: ${u} and ${v} are already connected by green edges. Taking ${u}–${v} would close a cycle → <code>unite</code> returns false, edge <b>rejected</b>.`);
        } else {
          paintNodes(); panels(k, chg, [u, v]);
          R.line(ln('if (a == b) return false')).snap(`Edge ${u}–${v} (w = ${w}): <code>find(${u}) = find(${v}) = ${ru}</code>. Same group, so it would close a cycle → <b>rejected</b>.${compTxt}`);
        }
        continue;
      }
      flushRejects();
      if (full) {
        R.edge(e, 'cur'); status[k] = '<span class="mst-wait">?</span>';
        paintNodes([u, v]); panels(k, chg, [u, v]);
        R.line([ln('if (unite(e.u'), ln('a = find(a)')]).snap(`Try edge ${u}–${v} (w = ${w}). <code>find(${u}) = ${ru}</code>, <code>find(${v}) = ${rv}</code>: different roots, so ${u} and ${v} are in different groups.${compTxt}`);
        chg.length = 0;
      }
      // unite by size
      let a = ru, b = rv;
      if (sz[a] < sz[b]) [a, b] = [b, a];
      const ca = color[a], cb = color[b];
      parent[b] = a; sz[a] += sz[b];
      color[a] = ca != null && sz[a] - sz[b] > 1 ? ca : cb != null ? cb : ca != null ? ca : nextColor++;
      chg.push(b);
      total += w; used++;
      status[k] = '<span class="mst-ok">take</span>';
      R.edge(e, 'mst');
      paintNodes(); panels(k, chg, [u, v]);
      R.line([ln('parent[b] = a'), ln('total += e.w'), ln('used++')]).snap(`Take ${u}–${v}: <code>parent[${b}] = ${a}</code> merges the groups. <code>total += ${w}</code> → <b>${total}</b>, used = ${used}.`);
      if (early && used === n - 1) {
        const rest = order.slice(k + 1);
        rest.forEach((e2, j) => { status[k + 1 + j] = '<span class="mst-wait">not examined</span>'; R.edge(e2, 'dim'); });
        panels(k);
        R.line(ln('if (used == n - 1)')).snap(`used = ${used} = n − 1: the tree is complete, <code>break</code>.${rest.length ? ` ${rest.slice(0, 5).map((e2) => `${ename(g, e2)} (${g.edges[e2].w})`).join(', ')}${rest.length > 5 ? ', …' : ''} ${rest.length === 1 ? 'is' : 'are'} never even examined.` : ''}`);
        k++;
        break;
      }
    }
    flushRejects();
    // final
    const mstEdges = order.filter((e, kk) => status[kk].includes('mst-ok'));
    const comps = n - used;
    R.adj(null);
    paintNodes(); panels(null);
    const list = mstEdges.map((e) => `${ename(g, e)} (${g.edges[e].w})`).join(', ') || 'none';
    if (used === n - 1) {
      R.panel('tot', { type: 'text', title: 'answer', html: `<div class="mst-sum">MST = { ${list} }<br>weight <b>${total}</b>, ${used} edges = n − 1</div>` });
      R.line(ln('return total;')).snap(`Done. MST = { ${list} }, total weight <b>${total}</b>.`);
    } else {
      R.panel('tot', { type: 'text', title: 'answer', html: `<div class="mst-sum">used = ${used} &lt; n − 1 = ${n - 1} → return −1<br>minimum spanning <b>forest</b>: ${comps} trees, weight <b>${total}</b><br>groups: ${groups()}</div>` });
      R.line(ln('if (used < n - 1)')).snap(`All edges used up but only ${used} &lt; n − 1 = ${n - 1} were taken: the graph is disconnected (${comps} components), so <code>return -1</code>. The green edges are a minimum spanning <b>forest</b> of weight ${total}.`);
    }
    return R.frames;
  },
});

/* ------------------------------------------------------------------ Prim */
const primCode = (o) => `long long prim(int n, vector<vector<pair<int,int>>>& adj) {
    vector<bool> inTree(n + 1, false);
    priority_queue<pair<int,int>, vector<pair<int,int>>,
                   greater<pair<int,int>>> pq; // (weight, vertex)

    long long total = 0;
    int taken = 0;
    pq.push({0, ${o.src || 1}});              // start at vertex ${o.src || 1}, cost 0

    while (!pq.empty() && taken < n) {
        auto [w, u] = pq.top(); pq.pop();
        if (inTree[u]) continue;         // stale entry, skip

        inTree[u] = true;
        total += w;
        taken++;

        for (auto [v, wt] : adj[u])
            if (!inTree[v])
                pq.push({wt, v});
    }

    if (taken < n) return -1;            // disconnected
    return total;
}`;

GV.registerTopic({

  title: 'Prim',

  code: primCode,
  notes: `
<h4>Key idea</h4>
<p>Put the start vertex in the tree, then repeat: among all edges from the tree to the outside, take the cheapest and add its outside endpoint. By the cut property (tree vs rest) that edge is always safe.</p>
<p>The heap holds <b>candidate edges</b> as <code>(weight, vertex)</code>. It is lazy: we never delete an entry when its vertex joins the tree. Instead, when such an entry reaches the top, <code>if (inTree[u]) continue;</code> throws it away. Those are the <em>stale</em> entries (faded in the pq panel).</p>
<h4>Dry run on G3 from 1 (course 10.5.1)</h4>
<pre>take (7,2)  tree={1,2}        total=7    add (10,3) (15,4)
take (9,3)  tree={1,2,3}      total=16   add (11,4) (2,6)
take (2,6)  tree={1,2,3,6}    total=18   add (9,5)
take (9,5)  tree={1,2,3,5,6}  total=27   add (6,4)
take (6,4)  tree=all          total=33</pre>
<p>Same weight and same edge set as Kruskal. Not luck: with distinct weights the MST is unique. With ties, different algorithms may give different trees of equal weight.</p>
<h4>(weight, vertex), not (vertex, weight)</h4>
<p>The heap sorts by the first element, so the weight goes first. The adjacency list stores <code>(neighbour, weight)</code>: the opposite order. Mixing them up is a classic bug.</p>
<h4>Dense graphs: O(n²) Prim</h4>
<p>For a complete graph (weight given by a formula, e.g. Manhattan distance) skip the heap: keep <code>minE[v]</code> and each round scan all vertices for the smallest unused one. O(n²) beats O(m log n) when m ≈ n². CF 1245D is the standard example.</p>
<h4>Disconnected graphs</h4>
<p>Prim only reaches the start vertex's component: the heap runs dry with <code>taken &lt; n</code> and the code returns −1. For a minimum spanning <b>forest</b>, use Kruskal.</p>
<h4>Common mistakes</h4>
<ul>
<li>Forgetting the stale check <code>if (inTree[u]) continue;</code> — you would add a vertex twice and count its weight again.</li>
<li>Mixing <code>(w, v)</code> and <code>(v, w)</code> orders.</li>
<li>Using the default <code>priority_queue</code> (a max-heap) without <code>greater&lt;&gt;</code>.</li>
<li>Not detecting disconnection (<code>taken &lt; n</code>).</li>
<li>Overflow: sum in <code>long long</code>.</li>
</ul>

<li>Is the path between u and v in the MST the shortest path between them?</li>
</ol>`,

    push(0, s, -1);
    paint(); panels(true);
    R.line(ln('pq.push({0,')).snap(`<code>pq.push({0, ${s}})</code>: the start vertex costs 0 to reach.`);

    while (pq.length && taken < n) {
      const top = pq.shift();
      const { w, v: u, e } = top;
      if (inTree[u]) {
        const via = joinE[u] >= 0 ? joinE[u] : null;
        if (!full) { staleRun.push(`(${w},${u})`); continue; }
        R.adj(null);
        paint(u); if (e >= 0) R.edge(e, 'cur'); R.node(u, 'path').ring(u); panels();
        R.line([ln('auto [w, u] = pq.top()'), ln('if (inTree[u]) continue')]).snap(`Pop (${w},${u}). <code>inTree[${u}]</code> is already true: ${u} joined the tree earlier through a cheaper edge${via != null ? ` (${ename(g, via)}, w = ${g.edges[via].w})` : ''}. Stale entry, <code>continue</code>.`);
        if (e >= 0) R.edge(e, 'rejected');
        R.ring(u, false);
        continue;
      }
      flushStale();
      inTree[u] = true; total += w; taken++; joinE[u] = e;
      if (e >= 0) mstE.push(e);
      R.adj(null);
      paint(u); panels();
      R.line([ln('auto [w, u] = pq.top()'), ln('inTree[u] = true'), ln('total += w'), ln('taken++')]).snap(e >= 0
        ? `Pop (${w},${u}): ${u} is not in the tree, so edge ${ename(g, e)} (${w}) is the cheapest edge leaving the tree. Take it: total = <b>${total}</b>, taken = ${taken}.`
        : `Pop (0,${u}): the start vertex enters the tree. total = 0, taken = 1.`);
      // scan neighbours
      const pushed = [];
      for (let i = 0; i < adj[u].length; i++) {
        const { v, w: wt, e: ei } = adj[u][i];
        const ok = !inTree[v];
        if (ok) { push(wt, v, ei); pushed.push(`(${wt},${v})`); }
        if (!full) continue;
        paint(u); R.edge(ei, 'cur'); panels();
        R.adj(u, i, Array.from({ length: i }, (_, j) => j));
        R.line(ok ? [ln('if (!inTree[v])'), ln('pq.push({wt, v})')] : ln('if (!inTree[v])')).snap(ok
          ? `Neighbour ${v} via ${ename(g, ei)} (w = ${wt}): not in the tree → <code>pq.push({${wt}, ${v}})</code>.`
          : `Neighbour ${v} via ${ename(g, ei)}: <code>inTree[${v}]</code> is true, nothing to push.`);
      }
      if (!full && adj[u].length) {
        paint(u); panels(); R.adj(u, adj[u].length - 1);
        R.line(ln('pq.push({wt, v})')).snap(pushed.length ? `Scan <code>adj[${u}]</code>: push ${pushed.join(' ')}.` : `Scan <code>adj[${u}]</code>: every neighbour is already in the tree.`);
      }
    }
    flushStale();
    R.adj(null);
    paint(); panels(pq.length > 0);
    const list = mstE.map((e) => `${ename(g, e)} (${g.edges[e].w})`).join(', ') || 'none';
    if (taken === n) {
      R.panel('tot', { type: 'text', title: 'answer', html: `<div class="mst-sum">MST = { ${list} }<br>weight <b>${total}</b></div>` });
      R.line([ln('while (!pq.empty()'), ln('return total;')]).snap(`taken = n = ${n}: every vertex is in the tree, the loop stops${pq.length ? `. The leftover entr${pq.length === 1 ? 'y' : 'ies'} ${pq.slice(0, 6).map((x) => `(${x.w},${x.v})`).join(' ')}${pq.length > 6 ? ' …' : ''} ${pq.length === 1 ? 'is' : 'are all'} stale and never popped` : ''}. MST weight <b>${total}</b>.`);
    } else {
      const miss = []; for (let v = 1; v <= n; v++) if (!inTree[v]) { miss.push(v); R.node(v, 'dim'); }
      R.panel('tot', { type: 'text', title: 'answer', html: `<div class="mst-sum">taken = ${taken} &lt; n = ${n} → return −1<br>tree of ${s}'s component: weight ${total}<br>unreached: ${miss.join(' ')}</div>` });
      R.line(ln('if (taken < n) return -1')).snap(`The heap is empty but taken = ${taken} &lt; n = ${n}: vertices ${miss.slice(0, 8).join(', ')}${miss.length > 8 ? ', …' : ''} cannot be reached. The graph is disconnected → <code>return -1</code>. (Prim spans only the start's component; use Kruskal for a spanning forest.)`);
    }
    return R.frames;
  },
});
})();

/* ---------------- helpers ---------------- */
function lineFinder(src) {
  const L = src.split('\n');
  return (frag, nth = 0) => {
    let c = 0;
    for (let i = 0; i < L.length; i++) if (L[i].includes(frag) && c++ === nth) return i + 1;
    throw new Error('code line not found: ' + frag);
  };
}
function windowRows(rows, cur, size = 13) {
  if (rows.length <= size + 2) return { rows, hi: cur == null || cur < 0 ? [] : [cur] };
  const c = cur == null || cur < 0 ? 0 : cur;
  let a = Math.max(0, c - 4), b = Math.min(rows.length, a + size);
  a = Math.max(0, b - size);
  const out = [], width = rows[0].length;
  const dots = (k) => [`<span class="sp-wait">… ${k} more</span>`].concat(Array(width - 1).fill(''));
  if (a > 0) out.push(dots(a));
  for (let i = a; i < b; i++) out.push(rows[i]);
  if (b < rows.length) out.push(dots(rows.length - b));
  return { rows: out, hi: cur == null || cur < 0 ? [] : [c - a + (a > 0 ? 1 : 0)] };
}
const F = (x) => GV.fmt(x);
const plusW = (a, w) => `${F(a)} + ${w < 0 ? '(' + w + ')' : w}`;
const arrow = (g) => (g.directed ? '→' : '–');
const ename = (g, e) => g.edges[e].u + arrow(g) + g.edges[e].v;
const dLabel = (x) => (x === Infinity ? null : x === -Infinity ? 'd=-∞' : 'd=' + x);
function pathOf(par, t) {
  const p = [];
  for (let cur = t, guard = 0; cur !== 0 && guard <= par.length; cur = par[cur], guard++) p.push(cur);
  return p.reverse();
}

const SP_TABLES = `
<h4>Choosing the algorithm (course 11.1)</h4>
<p>Decide by the <b>weights</b>, not by the story.</p>
<table><tr><th>Situation</th><th>Algorithm</th><th>Complexity</th></tr>
<tr><td>All edges weight 1 (unweighted)</td><td>BFS</td><td>O(n + m)</td></tr>
<tr><td>All weights are 0 or 1</td><td>0-1 BFS with a deque</td><td>O(n + m)</td></tr>
<tr><td>Weights small, 0 to k</td><td>Dial's buckets, or Dijkstra</td><td>O((n + m) k) or O(m log n)</td></tr>
<tr><td>Weights non-negative</td><td>Dijkstra</td><td>O(m log n)</td></tr>
<tr><td>Some weights negative</td><td>Bellman–Ford</td><td>O(n m)</td></tr>
<tr><td>All pairs, n small</td><td>Floyd–Warshall</td><td>O(n³)</td></tr>
<tr><td>The graph is a DAG</td><td>topological order DP (Part 8)</td><td>O(n + m)</td></tr></table>
<p><b>Negative weights break Dijkstra</b> (not "make it slow": break it). <b>Negative cycles make the question meaningless</b>; Bellman–Ford and Floyd can detect them.</p>
<h4>Comparison (course 11.7)</h4>
<table><tr><th>Algorithm</th><th>Weights</th><th>Sources</th><th>Time</th><th>Detects negative cycles</th></tr>
<tr><td>BFS</td><td>all equal</td><td>one or many</td><td>O(n + m)</td><td>not applicable</td></tr>
<tr><td>0-1 BFS</td><td>0 and 1</td><td>one or many</td><td>O(n + m)</td><td>not applicable</td></tr>
<tr><td>Dijkstra</td><td>non-negative</td><td>one or many</td><td>O(m log n)</td><td>no, and wrong if they exist</td></tr>
<tr><td>DAG DP</td><td>any</td><td>one</td><td>O(n + m)</td><td>n/a, a DAG has no cycles</td></tr>
<tr><td>Bellman–Ford</td><td>any</td><td>one</td><td>O(n m)</td><td>yes</td></tr>
<tr><td>Floyd–Warshall</td><td>any</td><td>all pairs</td><td>O(n³)</td><td>yes, d[i][i] &lt; 0</td></tr></table>`;
const SP_MISTAKES = `
<h4>Common mistakes (course 11.8)</h4>
<ul>
<li>Using <code>int</code> for distances: sums overflow. Use <code>long long</code>.</li>
<li><code>INF = INT_MAX</code> and then adding to it: overflow to negative. Use <code>1e18</code> with <code>long long</code>, or guard before adding.</li>
<li>BFS on a weighted graph; Dijkstra with negative weights.</li>
<li>Omitting the stale check in Dijkstra; putting <code>k</code> in the wrong loop in Floyd; forgetting <code>d[i][i] = 0</code>.</li>
<li>Forgetting the unreachable case in the output; adding both directions when the graph is directed.</li>
<li>Relaxing from INF vertices in Bellman–Ford; using <code>priority_queue</code> as a max-heap by accident.</li>
</ul>`;
const P = {
  '20C': { id: '20C', name: 'Dijkstra?', note: 'plain Dijkstra with path output; tests include the unreachable case' },
  '1063B': { id: '1063B', name: 'Labyrinth', note: 'grid, 0-1 style reasoning about moves' },
  '590C': { id: '590C', name: 'Three States', note: 'multi-source 0-1 BFS on a grid' },
  '449B': { id: '449B', name: 'Jzzhu and Cities', note: 'Dijkstra plus counting shortest paths' },
  '295B': { id: '295B', name: 'Greg and Graph', note: 'Floyd–Warshall run backwards: why k is outermost' },
  '715B': { id: '715B', name: 'Complete The Graph', note: 'a harder Dijkstra variant, for later' },
};
const probs = (...ids) => ids.map((i) => P[i]);

/* ================================================================== Dijkstra */
const dijCode = `const long long INF = 1e18;

vector<long long> dijkstra(int s, int n,
                           vector<vector<pair<int,int>>>& adj) {
    vector<long long> d(n + 1, INF);
    vector<int> par(n + 1, 0);           // for path reconstruction
    // min-heap of (dist, vertex)
    priority_queue<pair<long long,int>,
                   vector<pair<long long,int>>,
                   greater<pair<long long,int>>> pq;

    d[s] = 0;
    pq.push({0, s});

    while (!pq.empty()) {
        auto [du, u] = pq.top(); pq.pop();

        if (du > d[u]) continue;   // stale: we already did better

        for (auto [v, w] : adj[u]) {
            if (d[u] + w < d[v]) {
                d[v] = d[u] + w;
                par[v] = u;
                pq.push({d[v], v});   // lazy: push, never update
            }
        }
    }
    return d;
}

// afterwards: path to t  (if d[t] == INF, print -1)
vector<int> path;
for (int cur = t; cur != 0; cur = par[cur]) path.push_back(cur);
reverse(path.begin(), path.end());`;

GV.registerTopic({
  id: 'dijkstra', part: 11, order: 1,
  title: 'Dijkstra',
  blurb: 'Repeatedly take the unfinished vertex with the smallest tentative distance, declare it final, and relax its edges. Needs non-negative weights.',
  complexity: 'O(m log n)',
  chips: ['priority_queue', 'lazy deletion', 'long long'],
  graph: { preset: 'G3', directed: 'any', weighted: true, presets: ['G3', 'G3d', 'SP-01', 'SP-dneg'] },
  options: [
    { id: 'src', type: 'vertex', label: 'Source', default: 1 },
    { id: 'tgt', type: 'number', label: 'Target (0 = none)', default: 5, min: 0 },
  ],
  legend: [['cur', 'popped, scanning'], ['done', 'final distance'], ['frontier', 'in pq (tentative)'], ['e:cur', 'edge being relaxed'], ['e:relax', 'just improved'], ['e:tree', 'par[] edge'], ['e:path', 'shortest path']],
  code: dijCode,
  notes: `
<h4>Key idea</h4>
<p>Keep a set of vertices whose distance is final. Repeatedly take the unfinished vertex with the smallest tentative distance, declare it final, relax its outgoing edges.</p>
<p><b>Why is the smallest tentative distance final?</b> All weights are non-negative, so any other route to it must first pass through some unfinished vertex, which already has a larger tentative distance, and adding non-negative weights cannot make it smaller. That argument fails the moment a weight is negative.</p>
<h4>Three details that matter</h4>
<ul>
<li><code>(dist, vertex)</code> order in the heap: pairs compare on the first element.</li>
<li>The stale check <code>if (du &gt; d[u]) continue;</code>: we never remove outdated entries, we skip them. Without it the answer is still right but the work explodes.</li>
<li><code>long long</code> distances: 10⁵ edges of weight 10⁹ reach 10¹⁴. The single most common Dijkstra bug.</li>
</ul>
<h4>Dry run on G3 from 1 (course 11.4.3)</h4>
<pre>pop (0,1)   d[2]=7 d[3]=9 d[6]=14
pop (7,2)   7+10=17 &gt; 9 no;  d[4]=22
pop (9,3)   d[4]=20, d[6]=11
pop (11,6)  d[5]=20
pop (14,6)  stale, skip
pop (20,4)  20+6=26 &gt; 20 no
pop (20,5)  20+6=26 &gt; 20 no
pop (22,4)  stale, skip
final: d = 0 7 9 20 20 11</pre>
<p>Vertex 5: 1 → 3 → 6 → 5 costs 9 + 2 + 9 = 20, beating the "obvious" 1 → 2 → 4 → 5 = 28.</p>
<h4>Why negative weights break it</h4>
<p>Pick preset <em>SP-dneg</em>: 1→2 (2), 1→3 (5), 3→2 (−4). Dijkstra pops 2 at distance 2 and declares it final before ever looking at 3, but the true answer is 5 − 4 = 1. Use Bellman–Ford.</p>
<h4>Variants worth knowing</h4>
<ul>
<li><b>Multi-source</b>: push every source with distance 0.</li>
<li><b>Virtual vertex</b>: "start at any of these k cities" = one new source joined to them with weight 0.</li>
<li><b>State expansion</b>: <code>d[v][k]</code> = "at v having used k free tickets". Still Dijkstra, on n·(k+1) states.</li>
<li><b>Counting shortest paths</b>: when you improve <code>d[v]</code> set <code>cnt[v] = cnt[u]</code>; on a tie <code>cnt[v] += cnt[u]</code>.</li>
</ul>
${SP_TABLES}${SP_MISTAKES}
<h4>Check yourself</h4>
<ol>
<li>Why is the smallest tentative distance final, and where does that use non-negativity?</li>
<li>Write the stale check and explain what it prevents. Which pops are stale on G3?</li>
<li>Give a three-vertex graph where Dijkstra returns the wrong answer.</li>
<li>n = 400 and 10⁵ distance queries: which algorithm, and why not Dijkstra per query?</li>
<li>Shortest path where at most 2 edges are free: what is the state?</li>
</ol>`,
  problems: probs('20C', '449B', '715B', '1063B', '590C', '295B'),
  validate({ g }) {
    const bad = g.edges.find((e) => e.w < 0);
    if (bad) return `Edge ${bad.u} ${g.directed ? '→' : '–'} ${bad.v} has weight ${bad.w} < 0. Dijkstra is WRONG with negative weights: it declares a vertex final when it is popped, but a later negative edge could still make it cheaper (on SP-dneg it says d[2] = 2, the truth is 5 − 4 = 1). Use Bellman–Ford (next topics) for negative weights.`;
    return null;
  },
  run({ g, adj, opts }) {
    const R = GV.recorder(), ln = lineFinder(dijCode);
    const n = g.n, s = opts.src || 1, t = opts.tgt >= 1 && opts.tgt <= n ? opts.tgt : 0;
    const d = Array(n + 1).fill(Infinity), par = Array(n + 1).fill(0), pe = Array(n + 1).fill(-1), done = Array(n + 1).fill(false);
    let pq = [], seq = 0;
    const push = (dv, v) => { pq.push({ d: dv, v, id: seq++ }); pq.sort((a, b) => a.d - b.d || a.v - b.v || a.id - b.id); };
    const degSum = adj.reduce((a, l) => a + l.length, 0);
    const full = 2 * degSum + 10 <= 600;

    const paint = (cur) => {
      R.clearNodes(); R.clearEdges();
      const live = new Set(pq.filter((x) => x.d === d[x.v]).map((x) => x.v));
      for (let v = 1; v <= n; v++) {
        R.node(v, done[v] ? 'done' : live.has(v) ? 'frontier' : 'idle');
        R.label(v, dLabel(d[v]));
      }
      if (cur) R.node(cur, 'cur');
      R.ring(s);
      for (let v = 1; v <= n; v++) if (pe[v] >= 0) R.edge(pe[v], 'tree');
    };
    const panels = (chg, hiV, hiPq) => {
      const items = pq.slice(0, 16).map((x) => ({ t: `(${x.d},${x.v})`, s: x.d > d[x.v] ? 'dim' : null }));
      if (pq.length > 16) items.push({ t: `+${pq.length - 16}` });
      R.panel('pq', { type: 'list', title: 'pq (sorted view)', note: 'top = smallest (d, v) · faded = stale', items, hi: hiPq ? [0] : [] });
      R.panel('d', { type: 'array', title: 'd[]', values: d.slice(1), chg: (chg || []).map((v) => v - 1), hi: (hiV || []).map((v) => v - 1),
        cellState: Object.fromEntries(done.slice(1).map((b, i) => [i, b ? 'done' : null]).filter((x) => x[1])) });
      R.panel('par', { type: 'array', title: 'par[]', values: par.slice(1), chg: (chg || []).map((v) => v - 1) });
    };

    paint(); panels();
    R.line(ln('vector<long long> d(n + 1, INF)')).snap(`Dijkstra from s = ${s}. Every distance starts at INF (∞).`);
    d[s] = 0; push(0, s);
    paint(); panels([s], [], true);
    R.line([ln('d[s] = 0;'), ln('pq.push({0, s})')]).snap(`<code>d[${s}] = 0</code>, push <code>(0, ${s})</code>. The heap is ordered by distance first.`);

    while (pq.length) {
      const top = pq.shift();
      const du = top.d, u = top.v;
      if (du > d[u]) {

        R.line([ln('auto [du, u] = pq.top()'), ln('if (du > d[u]) continue')]).snap(`Pop (${du},${u}): ${du} &gt; d[${u}] = ${d[u]}. We already found a better way to ${u} after pushing this entry. Stale, <code>continue</code>.`);
        R.ring(u, false);
        continue;
      }
      done[u] = true;
      paint(u); panels([], [u]); R.adj(null);
      R.line([ln('auto [du, u] = pq.top()'), ln('if (du > d[u]) continue')]).snap(u === s && du === 0
        ? `Pop (0,${u}): the source. du = d[${u}], not stale; d[${u}] = 0 is final. Relax its edges.`
        : `Pop (${du},${u}): the smallest tentative distance, and not stale (du = d[${u}]). Every other route to ${u} costs at least ${du}, so <b>d[${u}] = ${du} is final</b>. Relax its edges.`);
      const relaxed = [], notes = [];
      for (let i = 0; i < adj[u].length; i++) {
        const { v, w, e } = adj[u][i];
        const nd = d[u] + w, old = d[v];
        const ok = nd < old;
        if (ok) { d[v] = nd; par[v] = u; pe[v] = e; push(nd, v); relaxed.push(v); notes.push(`d[${v}]=${nd}`); }
        if (!full) continue;
        paint(u); R.edge(e, ok ? 'relax' : 'cur'); panels(ok ? [v] : [], [u]);
        R.adj(u, i, Array.from({ length: i }, (_, j) => j));
        R.line(ok ? [ln('if (d[u] + w < d[v])'), ln('d[v] = d[u] + w'), ln('par[v] = u'), ln('pq.push({d[v], v})')] : ln('if (d[u] + w < d[v])')).snap(ok
          ? `Edge ${u}${arrow(g)}${v} (w = ${w}): ${plusW(du, w)} = ${nd} &lt; d[${v}] = ${F(old)} → <code>d[${v}] = ${nd}</code>, <code>par[${v}] = ${u}</code>, push (${nd},${v}).`
          : `Edge ${u}${arrow(g)}${v} (w = ${w}): ${plusW(du, w)} = ${nd} ≥ d[${v}] = ${F(old)}, no improvement${done[v] ? ` (${v} is already final)` : ''}.`);
      }
      if (!full && adj[u].length) {
        paint(u); relaxed.forEach((v) => R.edge(pe[v], 'relax')); panels(relaxed, [u]);
        R.adj(u, adj[u].length - 1);
        R.line(ln('if (d[u] + w < d[v])')).snap(relaxed.length ? `Scan <code>adj[${u}]</code>: improved ${notes.join(', ')}.` : `Scan <code>adj[${u}]</code>: nothing improves.`);
      }
    }
    // final
    R.adj(null);
    paint(); panels();

/* ================================================================== 0-1 BFS */
const zoCode = `vector<int> zeroOneBfs(int s, int n,
                       vector<vector<pair<int,int>>>& adj) {
    vector<int> d(n + 1, INT_MAX);
    deque<int> dq;

    d[s] = 0;
    dq.push_front(s);

    while (!dq.empty()) {
        int u = dq.front(); dq.pop_front();

        for (auto [v, w] : adj[u]) {
            if (d[u] + w < d[v]) {
                d[v] = d[u] + w;
                if (w == 0) dq.push_front(v);
                else        dq.push_back(v);
            }
        }
    }
    return d;
}`;

/* ================================================================== Bellman–Ford */
const bfCode = `struct Edge { int u, v, w; };

vector<long long> bellmanFord(int s, int n, vector<Edge>& edges,
                              bool& hasNegCycle) {
    vector<long long> d(n + 1, INF);
    d[s] = 0;

    for (int i = 0; i < n - 1; i++) {
        bool changed = false;
        for (const Edge& e : edges) {
            if (d[e.u] < INF && d[e.u] + e.w < d[e.v]) {
                d[e.v] = d[e.u] + e.w;
                changed = true;
            }
        }
        if (!changed) break;            // early exit, worth having
    }

    hasNegCycle = false;
    for (const Edge& e : edges)         // one extra round
        if (d[e.u] < INF && d[e.u] + e.w < d[e.v])
            hasNegCycle = true;   // still improving: negative cycle

    // which vertices are affected? mark every e.v improved in the
    // extra round, then BFS/DFS from the marked ones along outgoing
    // edges: every vertex reached has d = -INF
    return d;
}`;

      R.line([ln('// which vertices are affected'), ln('// extra round, then BFS'), ln('// edges: every vertex')]).snap(`Which vertices are affected? Start from the marked ${[...new Set(marked)].join(', ')} and follow outgoing edges: <b>${badList.join(', ')}</b> can be made as cheap as we like (−∞).${cycOk ? ` The cycle itself: ${cycStr}, total weight ${cycW} &lt; 0.` : ''}`);
      return R.frames;
    }
    // final answer
    paint();
    const unreach = [];
    for (let v = 1; v <= n; v++) if (d[v] === Infinity) { unreach.push(v); R.node(v, 'dim'); }
    for (let v = 1; v <= n; v++) if (pe[v] >= 0) R.edge(pe[v], 'path');
    const dl = Array.from({ length: n }, (_, i) => `d[${i + 1}]=${F(d[i + 1])}`).join(' ');
    R.panel('it', { type: 'text', title: 'answer', html: `<div class="sp-sum">${dl}${unreach.length ? `<br>unreachable (INF): ${unreach.join(' ')}` : ''}</div>` });

    return R.frames;
  },
});

/* ================================================================== Floyd–Warshall */
const fwCode = `// d is an (n+1) x (n+1) matrix: d[i][i] = 0, d[i][j] = w or INF
for (int i = 1; i <= n; i++)
    for (int j = 1; j <= n; j++)
        d[i][j] = (i == j ? 0 : INF);
for (auto [u, v, w] : edges) {
    d[u][v] = min(d[u][v], (long long)w);   // multi-edges: cheapest
    if (undirected) d[v][u] = min(d[v][u], (long long)w);
}

for (int k = 1; k <= n; k++)            // k MUST be outermost
    for (int i = 1; i <= n; i++)
        for (int j = 1; j <= n; j++)
            if (d[i][k] < INF && d[k][j] < INF)
                d[i][j] = min(d[i][j], d[i][k] + d[k][j]);

// d[i][i] < 0 means i lies on a negative cycle`;
const FW_MAX = 12;

GV.registerTopic({
  id: 'floyd', part: 11, order: 4,
  title: 'Floyd–Warshall',
  blurb: 'All pairs at once: for each <code>k</code> in turn ask "is it better to go from i to j via k?". Three nested loops, <code>k</code> outermost.',
  complexity: 'O(n³)',
  chips: ['all pairs', 'matrix', 'n ≤ 500'],
  graph: { preset: 'SP-fw', directed: 'any', weighted: true, presets: ['SP-fw', 'G3', 'G3d', 'SP-neg', 'SP-negcyc'] },
  legend: [['gray', 'k (intermediate)'], ['cur', 'i and j'], ['bad', 'on a negative cycle'], ['e:relax', 'new best path i → k → j']],
  code: fwCode,
  adjSig: 'for reference · Floyd works on the matrix d[][]',
  notes: `
<h4>Key idea</h4>
<p><code>d[i][j]</code> starts as the direct edge. Then for each vertex k in turn: "is it better to go from i to j via k?"
After processing k, <code>d[i][j]</code> is the best path using only vertices from {1..k} as intermediates.</p>
<p><b>k must be the outermost loop.</b> Put it inside and that invariant collapses and the answer is wrong. The most commonly memorised-wrong triple loop in competitive programming.</p>
<h4>Reading the matrix panel</h4>
<p>While processing k, only row k and column k (outlined) are read: <code>d[i][j]</code> looks at <code>d[i][k]</code> (column k) and <code>d[k][j]</code> (row k). Filled cells are the ones that just improved. Row k and column k never change during their own round (d[k][k] = 0).</p>
<h4>Dry run (course 11.6.2, preset SP-fw)</h4>
<pre>directed: 1→2 (3), 1→3 (7), 2→3 (1), 2→4 (5), 3→4 (2)
k=1 changes nothing (no edges into 1)
k=2: d[1][3] = min(7, 3+1) = 4 ; d[1][4] = min(INF, 3+5) = 8
k=3: d[1][4] = min(8, 4+2) = 6 ; d[2][4] = min(5, 1+2) = 3
k=4 changes nothing</pre>
<h4>What else Floyd gives you</h4>
<ul>
<li><b>Negative cycle detection</b>: afterwards, <code>d[i][i] &lt; 0</code> means i is on a negative cycle.</li>
<li><b>Transitive closure</b>: replace min/+ by or/and. With <code>bitset&lt;N&gt;</code> rows: O(n³/64), fine for n ≈ 2000.</li>
<li>Negative edges are fine as long as there is no negative cycle.</li>
<li><b>Path reconstruction</b>: keep <code>nxt[i][j]</code>, the first vertex after i, and update it with <code>d[i][j]</code> (that is how the canvas draws i → k → j).</li>
</ul>
<p>O(n³): n = 500 is 1.25·10⁸ simple operations, well under a second; n = 1000 is usually too slow. This page draws up to n = ${FW_MAX}.</p>
${SP_TABLES}${SP_MISTAKES}

<ol>

<li>How do you detect a negative cycle with Floyd?</li>
<li>n = 400 and 10⁵ queries "distance from a to b": which algorithm?</li>
<li>CF 295B deletes vertices one by one. Why does running Floyd backwards (adding vertices) solve it?</li>
</ol>`,
  problems: probs('295B', '20C', '449B', '1063B', '590C', '715B'),
  validate({ g }) {
    if (g.n > FW_MAX) return `n = ${g.n}: the Floyd–Warshall matrix would be ${g.n} × ${g.n}, too big to read on screen. Use n ≤ ${FW_MAX} here (the algorithm itself is fine up to n ≈ 500).`;

  },
  run({ g }) {
    const R = GV.recorder(), ln = lineFinder(fwCode);

    const nxt = Array.from({ length: n + 1 }, () => Array(n + 1).fill(0));
    const best = {};   // "a,b" -> edge index of the cheapest a→b edge
    const labels = Array.from({ length: n }, (_, i) => i + 1);

    paintBase(); mat();
    for (let i = 1; i <= n; i++) d[i][i] = 0;
    R.line([ln('for (int i = 1; i <= n; i++)'), ln('d[i][j] = (i == j ? 0 : INF)')]);
    mat({ note: 'd[i][i] = 0, everything else INF' });
    R.snap(`Start: <code>d[i][i] = 0</code>, every other cell INF (shown ∞).`);
    E.forEach((e, idx) => {
      const put = (a, b) => {
        if (e.w < d[a][b]) { d[a][b] = e.w; nxt[a][b] = b; best[a + ',' + b] = idx; }

      const ups = [];
      for (let i = 1; i <= n; i++) for (let j = 1; j <= n; j++) {
        if (d[i][k] < INF && d[k][j] < INF && d[i][k] + d[k][j] < d[i][j]) {
          ups.push({ i, j, old: d[i][j], a: d[i][k], b: d[k][j], nw: d[i][k] + d[k][j] });
          d[i][j] = d[i][k] + d[k][j]; nxt[i][j] = nxt[i][k];

      }
      // replay for display: undo, then redo step by step
      for (let t = ups.length - 1; t >= 0; t--) d[ups[t].i][ups[t].j] = ups[t].old;
      const remainingK = n - k;
      const detailed = R.frames.length + ups.length + 2 + remainingK * 2 <= BUDGET;
      paintBase(); R.node(k, 'gray');
      mat({ via: viaK(k), note: `row ${k} and column ${k} outlined` });
      R.line(ln('for (int k = 1; k <= n; k++)')).snap(`k = ${k}: for every pair (i, j), is going i → ${k} → j shorter than the current d[i][j]? Only row ${k} and column ${k} are read. ${ups.length ? `${ups.length} cell${ups.length > 1 ? 's' : ''} will improve; the other ${n * n - ups.length} stay unchanged.` : `<b>Nothing improves</b>${k === 1 && !E.some((e) => e.v === 1 || (!g.directed && e.u === 1)) ? ` (no edges into ${k})` : ''}.`}`);
      if (detailed) {
        for (const u of ups) {
          d[u.i][u.j] = u.nw;
          paintBase();
          R.node(k, 'gray'); R.node(u.i, 'cur'); R.node(u.j, 'cur');
          const es = edgePath(u.i, u.j);
          es.forEach((e) => R.edge(e, 'relax'));
          mat({ via: viaK(k), hi: [[u.i - 1, k - 1], [k - 1, u.j - 1]], chg: [[u.i - 1, u.j - 1]] });
          R.line([ln('if (d[i][k] < INF && d[k][j] < INF)'), ln('d[i][j] = min(d[i][j], d[i][k] + d[k][j])')]).snap(`i = ${u.i}, j = ${u.j}: <code>d[${u.i}][${u.j}] = min(${F(u.old)}, d[${u.i}][${k}] + d[${k}][${u.j}] = ${plusW(u.a, u.b)}) = ${u.nw}</code>. Going through ${k} is shorter${u.i === u.j ? ` — and d[${u.i}][${u.i}] &lt; 0 means a negative cycle through ${u.i}` : ''}.`);
        }

        for (const u of ups) d[u.i][u.j] = u.nw;
        paintBase(); R.node(k, 'gray');
        mat({ via: viaK(k), chg: ups.map((u) => [u.i - 1, u.j - 1]) });
        R.line(ln('d[i][j] = min(d[i][j], d[i][k] + d[k][j])')).snap(`k = ${k}: ${ups.length} cells improved at once (filled): ${ups.slice(0, 6).map((u) => `d[${u.i}][${u.j}] ${F(u.old)}→${u.nw}`).join(', ')}${ups.length > 6 ? ', …' : ''}.`);
      }
    }
    // final
    paintBase();
    const neg = []; for (let i = 1; i <= n; i++) if (d[i][i] < 0) { neg.push(i); R.node(i, 'bad'); }
    mat({ hi: neg.map((i) => [i - 1, i - 1]), note: neg.length ? 'diagonal < 0 → negative cycle' : 'all-pairs shortest distances' });
    let unreach = 0; for (let i = 1; i <= n; i++) for (let j = 1; j <= n; j++) if (d[i][j] === INF) unreach++;
    R.panel('ans', { type: 'text', title: 'answer', html: neg.length
      ? `<div class="sp-sum"><span class="sp-bad">negative cycle</span>: d[i][i] &lt; 0 for i = ${neg.join(', ')}<br>distances touching it are meaningless</div>`
      : `<div class="sp-sum">no negative cycle (diagonal all 0)<br>${unreach ? `${unreach} pairs unreachable (∞)` : 'every pair reachable'}</div>` });
    R.line(ln('// d[i][i] < 0')).snap(neg.length
      ? `Done. <code>d[i][i] &lt; 0</code> for ${neg.join(', ')}: ${neg.length > 1 ? 'these vertices lie' : 'this vertex lies'} on a negative cycle, so shortest paths through ${neg.length > 1 ? 'them' : 'it'} do not exist.`
      : `Done. Row i of the matrix is the answer of a single-source run from i.${` For example row 1 (from vertex 1): ${d[1].slice(1).map(F).join(' ')}.`}${unreach ? ` ∞ = no path.` : ''}`);
    return R.frames;
  },
});
})();

<script>/* 21-trees.js */
/* Part 12: Trees as graphs. Rooting + subtree DP, diameter (two BFS), LCA by binary lifting, Euler tour (subtree = range). */
(function () {
const GV = window.GV;

/* ---------- shared helpers ---------- */
const CAP = 560;
function rec() {
  const R = GV.recorder();
  R.S = (msg, must) => {
    if (must || R.frames.length < CAP) R.snap(msg);
    else if (!R._capped) { R._capped = true; R.snap('<i>Large input: the remaining intermediate steps are skipped. Jump to the end for the result.</i>'); }
    return R;
  };

}
/** parts: [[key|null, text] | false] -> { text, L: {key: lineNo} } */
function mk(parts) {
  const P = parts.filter(Boolean), L = {};
  P.forEach(([k], i) => { if (k) L[k] = i + 1; });
  return { text: P.map((x) => x[1]).join('\n'), L };
}
function treeErr({ g, adj }) {
  const n = g.n, m = g.edges.length;

  if (m === n - 1 && cnt === n) return null;

  if (m !== n - 1) why.push(`it has m = ${m} edges, but a tree on n = ${n} vertices has exactly n − 1 = ${n - 1}`);
  if (cnt !== n) why.push(`it is not connected (only ${cnt} of ${n} vertices are reachable from 1)`);
  if (m === n - 1 && cnt !== n) why.push('with n − 1 edges and no connection, some edges must form a cycle');

}

/* ============================================================
   1. Rooting a tree + subtree DP

function dpCode(o) {
  const X = o.dp || 'none';
  const A = X === 'leaf' ? 'lf' : X === 'h' ? 'h' : null;
  return mk([
    ['decl', `vector<int> par, dep, sz${A ? ', ' + A : ''};`],
    [null, ''],
    ['fn', 'void dfs(int u, int p, vector<vector<int>>& adj) {'],
    ['par', '    par[u] = p;'],
    ['sz1', '    sz[u] = 1;'],
    A && ['x1', X === 'leaf' ? '    lf[u] = 0;' : '    h[u] = 0;'],
    [null, ''],
    ['for', '    for (int v : adj[u]) {'],
    ['skip', '        if (v == p) continue;     // do not walk back into the parent'],
    ['dep', '        dep[v] = dep[u] + 1;'],
    ['call', '        dfs(v, u, adj);'],
    ['acc', '        sz[u] += sz[v];           // postorder: children are done'],
    A && ['x2', X === 'leaf' ? '        lf[u] += lf[v];' : '        h[u] = max(h[u], h[v] + 1);'],
    ['endfor', '    }'],
    X === 'leaf' && ['x3', '    if (lf[u] == 0) lf[u] = 1;    // no child: u is a leaf'],
    ['end', '}'],
    [null, ''],
    ['main', `// call: par, dep, sz .assign(n+1, 0);  dfs(${o.root || 1}, 0, adj);`],

}

GV.registerTopic({

  code: (o) => dpCode(o).text,
  notes: `
<h4>Key idea</h4>
<p>A contest tree arrives as <code>n − 1</code> undirected edges with no root. Pick one (usually 1) and one DFS gives you <code>par[]</code>, <code>dep[]</code> and <code>sz[]</code>.

<ul>
<li><code>dep[v] = dep[u] + 1</code> sits <b>before</b> the call: information flowing down (preorder position).</li>
<li><code>sz[u] += sz[v]</code> sits <b>after</b> it: information flowing up (postorder position).</li>
<li><code>if (v == p) continue;</code> is enough on a tree: the only way back to a visited vertex is the edge you came along. On a general graph you need <code>vis[]</code> (Part 3).</li>

<h4>Subtree DP = change one line</h4>
<table><tr><th>quantity</th><th>accumulation</th></tr>

<p>Use the <em>Also compute</em> option to watch the leaves or height version run next to the sizes.</p>

    R.top(root, 'd=0');
    panels(null);
    R.line(L.main).S(`Root the tree at <b>${root}</b>: call <code>dfs(${root}, 0)</code>. Parent 0 is a fake vertex, so <code>dep[${root}] = 0</code> and nothing is skipped at the root.`);

    const dfs = (u, p) => {
      stack.push([u, p]);
      vis[u] = true; par[u] = p; sz[u] = 1; ex[u] = 0;
      sub[u].push(u);
      R.node(u, 'cur').label(u, lab(u)).adj(u, -1);
      panels(u, { par: [u], sz: [u], ex: X !== 'none' ? [u] : [] });
      R.line(X !== 'none' ? [L.par, L.sz1, L.x1] : [L.par, L.sz1]).S(`<code>dfs(${u}, ${p})</code>: par[${u}] = ${p}${p === 0 ? ' (the root has no parent)' : ''}, sz[${u}] = 1 because ${u} counts itself${X === 'leaf' ? ', lf[' + u + '] = 0 for now' : X === 'h' ? ', h[' + u + '] = 0' : ''}.`);
      const done = [];
      let kids = 0;
      adj[u].forEach(({ v, e }, i) => {
        R.adj(u, i, done.slice());
        if (v === p) {
          panels(u);
          R.line(L.skip).S(`adj[${u}][${i}] = ${v} is the parent, so <code>continue</code>. This one check replaces <code>vis[]</code>: in a tree the only way back is the edge we came along.`);
          done.push(i); return;
        }
        kids++;
        dep[v] = dep[u] + 1; depSet[v] = true;
        R.top(v, 'd=' + dep[v]).node(v, 'frontier').edge(e, 'cur');
        panels(u, { dep: [v] });
        R.line(L.dep).S(`adj[${u}][${i}] = ${v} is a child. Preorder work, before the call: dep[${v}] = dep[${u}] + 1 = ${dep[v]}.`);
        R.edge(e, 'tree').node(u, 'gray');
        dfs(v, u);
        const old = sz[u], oldx = ex[u];
        sz[u] += sz[v];
        sub[u].push(...sub[v]);
        let xm = '';
        if (X === 'leaf') { ex[u] += ex[v]; xm = ` Also lf[${u}] += lf[${v}] → ${oldx} + ${ex[v]} = ${ex[u]}.`; }
        if (X === 'h') { ex[u] = Math.max(ex[u], ex[v] + 1); xm = ` Also h[${u}] = max(${oldx}, h[${v}] + 1 = ${ex[v] + 1}) = ${ex[u]}.`; }
        R.node(u, 'cur').label(u, lab(u)).adj(u, i, done.slice());
        panels(u, { sz: [u], ex: X !== 'none' ? [u] : [] });
        R.line(X !== 'none' ? [L.acc, L.x2] : L.acc).S(`Back in ${u}: the subtree of ${v} is finished. Postorder work: sz[${u}] += sz[${v}] → ${old} + ${sz[v]} = <b>${sz[u]}</b>.${xm}`);
        done.push(i);
      });
      let lm = '';
      if (X === 'leaf' && ex[u] === 0) { ex[u] = 1; lm = ` No child, so <code>lf[${u}] = 1</code>: ${u} is a leaf.`; }
      stack.pop();
      R.node(u, 'done').label(u, lab(u)).adj(null);
      panels(u, X === 'leaf' && lm ? { ex: [u] } : {});
      const list = sub[u].length <= 12 ? '{' + sub[u].slice().sort((a, b) => a - b).join(', ') + '}' : sub[u].length + ' vertices';
      R.line(X === 'leaf' && lm ? [L.x3, L.end] : L.end).S(`<code>dfs(${u})</code> returns. ${kids ? '' : `${u} has no children, so sz[${u}] stays 1. `}Subtree of ${u} = ${list}, sz[${u}] = <b>${sz[u]}</b>.${lm}`);
    };
    dfs(root, 0);

    const kids = adj[root].map((x) => x.v);
    const check = `sz[${root}] = 1 + ${kids.map((v) => 'sz[' + v + ']').join(' + ') || '0'} = 1 + ${kids.map((v) => sz[v]).join(' + ') || '0'} = ${sz[root]}`;
    panels(null);
    R.panel('st', null);
    R.line(L.main).S(`Done in O(n). Check: <code>${check}</code> ${sz[root] === n ? '= n ✓' : ''}. Every vertex got its depth on the way down and its subtree size on the way up.`, true);
    return R.frames;
  },
});

/* ============================================================
   2. Tree diameter: two BFS
   ============================================================ */
const diaCode = (o) => mk([
  ['f', 'pair<int,int> bfsFar(int s, int n, vector<vector<int>>& adj) {'],
  ['init', '    vector<int> d(n + 1, -1);'],
  ['push', '    queue<int> q; d[s] = 0; q.push(s);'],
  ['best0', '    int best = s;'],
  ['while', '    while (!q.empty()) {'],
  ['pop', '        int u = q.front(); q.pop();'],
  ['best', '        if (d[u] > d[best]) best = u;'],
  ['scanf', '        for (int v : adj[u])'],
  ['scan', '            if (d[v] == -1) { d[v] = d[u] + 1; q.push(v); }'],
  [null, '    }'],
  ['ret', '    return {best, d[best]};     // farthest vertex and its distance'],
  [null, '}'],
  [null, ''],
  ['dia', 'int diameter(int n, vector<vector<int>>& adj) {'],
  ['a', `    int a = bfsFar(${o.src || 1}, n, adj).first;`],
  ['b', '    return bfsFar(a, n, adj).second;'],
  [null, '}'],
]);

GV.registerTopic({
  id: 'diameter', part: 12, order: 2,
  title: 'Tree diameter (two BFS)',
  blurb: 'BFS from any vertex; the farthest vertex <code>a</code> is an end of a diameter. BFS again from <code>a</code>; the farthest distance is the diameter.',
  complexity: 'O(n)',
  chips: ['farthest vertex', 'trees only'],
  graph: { preset: 'TREE', directed: false, weighted: false, tree: true },
  options: [{ id: 'src', type: 'vertex', label: 'First BFS from', default: 1 }],
  legend: [['cur', 'popped vertex u'], ['frontier', 'in the queue'], ['visited', 'done'], ['path', 'diameter path'], ['e:tree', 'BFS tree edge'], ['e:path', 'diameter']],
  adjSig: 'vector<vector<int>> adj',
  code: (o) => diaCode(o).text,
  notes: `
<h4>Key idea</h4>
<p>The diameter is the number of edges on the longest path. In the TREE preset it is 6, along 7 − 5 − 2 − 1 − 3 − 6 − 9.</p>
<ol><li>BFS from any vertex, find the farthest vertex <code>a</code>.</li><li>BFS from <code>a</code>, find the farthest vertex <code>b</code>.</li><li><code>dist(a, b)</code> is the diameter.</li></ol>
<p><b>Why it works:</b> the farthest vertex from <em>any</em> start is always an endpoint of some diameter. If the search from s ended at some x that is not an endpoint, you could splice the path s..x into the diameter and get something longer, a contradiction.</p>
<h4>Method 2: one DFS, bottom-up</h4>
<pre><code>int best = 0;
int height(int u, int p, vector&lt;vector&lt;int&gt;&gt;&amp; adj) {
    int top1 = 0, top2 = 0;   // two largest child heights
    for (int v : adj[u]) {
        if (v == p) continue;
        int h = height(v, u, adj) + 1;
        if (h &gt; top1) { top2 = top1; top1 = h; }
        else if (h &gt; top2) { top2 = h; }
    }
    best = max(best, top1 + top2);   // path turning at u
    return top1;                     // value for the parent
}</code></pre>
<p><code>top1 + top2</code> is recorded (the path that turns here), <code>top1</code> is returned (what the parent can extend). Use method 1 in a contest; use method 2 when the tree is weighted or you need information at every vertex.</p>
<h4>Common mistakes</h4>
<ul><li>Applying the two-BFS trick to a general graph. Trees only: with cycles the farthest vertex is not a diameter end.</li>
<li>Returning <code>b</code> instead of <code>d[b]</code>, or counting vertices instead of edges.</li>
<li>Forgetting that ties do not matter: any farthest vertex works for the first BFS.</li></ul>
<h4>Check yourself</h4>
<ol><li>State the two-BFS method and the reason it works.</li><li>Start the first BFS from 4 (option above). Which <code>a</code> do you get? Is the diameter the same?</li><li>Why does the method fail on a cycle of length 5?</li></ol>`,
  problems: [
    { id: '455C', name: 'Civilization', note: 'diameters plus DSU merging' },
    { id: '1000E', name: 'We Need More Bosses', note: 'bridges → bridge tree → diameter (Parts 12 + 13)' },
    { id: '1092F', name: 'Tree with Maximum Cost', note: 'rerooting, the same family of tree DP' },
  ],
  validate: treeErr,
  run({ g, adj, opts }) {
    const n = g.n, s0 = opts.src;
    const { L } = diaCode(opts);
    const R = rec();
    let A = null, B = null, D = null;
    const res = () => R.panel('res', { type: 'text', title: 'answer so far', html: `a = ${A ?? '?'} &nbsp; b = ${B ?? '?'} &nbsp; diameter = ${D ?? '?'}` });
    const bfs = (s, phase) => {
      const d = Array(n + 1).fill(-1);
      const q = [s]; d[s] = 0; let best = s;
      R.clearNodes(); for (let v = 1; v <= n; v++) R.label(v, null).top(v, null);
      R.clearEdges();
      const tag = phase === 1 ? 's' : 'a';
      const tops = () => { for (let v = 1; v <= n; v++) R.top(v, null); R.top(s, best === s ? tag + ', best' : tag); if (best !== s) R.top(best, 'best'); };
      R.node(s, 'frontier').label(s, 'd=0'); tops();
      const P = (hiQ, chg) => {
        R.panel('q', { type: 'queue', title: 'queue&lt;int&gt; q', items: q.slice(), hi: hiQ || [] });
        R.panel('d', { type: 'array', title: 'd[]  (BFS ' + phase + ' from ' + s + ')', values: d.slice(1), chg: chg || [], hi: [best - 1] });
        res();
      };
      P([0], [s - 1]);
      R.adj(null).line(phase === 1 ? [L.a, L.init, L.push, L.best0] : [L.b, L.init, L.push, L.best0]).S(phase === 1
        ? `BFS 1 from <b>${s}</b> (any vertex works). d[] = −1 everywhere, d[${s}] = 0, push ${s}, best = ${s}.`
        : `BFS 2 from <b>a = ${s}</b>. Reset d[] to −1, d[${s}] = 0, push ${s}. The farthest vertex from a is the other end of a diameter.`);
      while (q.length) {
        const u = q.shift();
        R.node(u, 'cur');
        const prev = best, upd = d[u] > d[best];
        if (upd) { best = u; tops(); }
        P([], []);
        R.adj(u, -1).line([L.pop, L.best]).S(`Pop ${u} (d[${u}] = ${d[u]}). ` + (upd
          ? `d[${u}] = ${d[u]} &gt; d[best = ${prev}] = ${d[prev]}, so <b>best = ${u}</b>.`
          : `d[${u}] = ${d[u]} is not &gt; d[best = ${best}] = ${d[best]}; best stays ${best}.`));
        const done = [];
        adj[u].forEach(({ v, e }, i) => {
          R.adj(u, i, done.slice());
          if (d[v] === -1) {
            d[v] = d[u] + 1; q.push(v);
            R.node(v, 'frontier').label(v, 'd=' + d[v]).edge(e, 'tree');
            P([q.length - 1], [v - 1]);
            R.line(L.scan).S(`Neighbour ${v}: d[${v}] == −1, so d[${v}] = d[${u}] + 1 = <b>${d[v]}</b> and push ${v}.`);
          } else {
            P([], []);
            R.line(L.scan).S(`Neighbour ${v} already has d = ${d[v]} (it is where ${u} was reached from). Skip.`);
          }
          done.push(i);
        });
        R.node(u, 'visited');
      }
      const far = []; for (let v = 1; v <= n; v++) if (d[v] === d[best]) far.push(v);
      R.adj(null); P([], []);
      R.line(L.ret).S(`Queue empty. Distances from ${s}: ${d.slice(1).join(', ')}. Farthest distance ${d[best]}${far.length > 1 ? ` (reached by ${far.join(', ')}; strict &gt; keeps the first one popped)` : ''}. Return {${best}, ${d[best]}}.`);
      return { best, d };
    };
    const r1 = bfs(s0, 1);
    A = r1.best;
    R.line(L.a).S(`<code>a = bfsFar(${s0}).first = ${A}</code>. ${A} is an endpoint of some diameter, whatever vertex we started from.`);
    const r2 = bfs(A, 2);
    B = r2.best; D = r2.d[B];
    // trace the path b -> a
    const path = [B], pe = [];
    let x = B;
    while (x !== A) {
      const nx = adj[x].find(({ v }) => r2.d[v] === r2.d[x] - 1);
      pe.push(nx.e); x = nx.v; path.push(x);
    }
    path.reverse();
    R.clearEdges(); pe.forEach((e) => R.edge(e, 'path'));
    for (let v = 1; v <= n; v++) R.node(v, 'dim');
    path.forEach((v) => R.node(v, 'path'));
    for (let v = 1; v <= n; v++) R.top(v, null);
    R.top(A, 'a').top(B, 'b');
    R.panel('q', null);
    res();
    R.panel('res', { type: 'text', title: 'answer', html: `a = ${A}, b = ${B}<br>diameter = d[${B}] = <b>${D}</b> edges<br>path: <code>${seqStr(path)}</code>` });
    R.adj(null).line(L.b).S(`<code>return bfsFar(${A}).second = ${D}</code>. Diameter = <b>${D}</b>, along ${seqStr(path)} (traced back from ${B} through d − 1 neighbours).`, true);
    return R.frames;
  },
});

/* ============================================================
   3. LCA by binary lifting
   ============================================================ */
const lcaCode = mk([
  ['LOG', 'const int LOG = 18;                    // 2^18 > 2*10^5'],
  ['decl', 'int up[N][LOG], dep[N];'],
  [null, ''],
  ['fn', 'void dfs(int u, int p, vector<vector<int>>& adj) {'],
  ['up0', '    up[u][0] = p;'],
  ['kfor', '    for (int k = 1; k < LOG; k++)'],
  ['upk', '        up[u][k] = up[ up[u][k-1] ][k-1];'],
  [null, ''],
  ['vfor', '    for (int v : adj[u])'],
  ['child', '        if (v != p) { dep[v] = dep[u] + 1; dfs(v, u, adj); }'],
  [null, '}'],
  [null, ''],
  ['lca', 'int lca(int u, int v) {'],
  ['swap', '    if (dep[u] < dep[v]) swap(u, v);'],
  [null, ''],
  ['diff', '    int diff = dep[u] - dep[v];'],
  ['lfor', '    for (int k = 0; k < LOG; k++)          // lift u to v\'s depth'],
  ['lift', '        if (diff >> k & 1) u = up[u][k];'],
  ['eq', '    if (u == v) return u;'],
  [null, ''],
  ['bfor', '    for (int k = LOG - 1; k >= 0; k--)     // lift both as high'],
  ['cmp', '        if (up[u][k] != up[v][k]) {        // ... without meeting'],
  ['mu', '            u = up[u][k];'],
  ['mv', '            v = up[v][k];'],
  [null, '        }'],
  ['ret', '    return up[u][0];              // one more step, and they meet'],
  [null, '}'],
  [null, ''],
  ['main', '// dfs(1, 0, adj);  up[0][k] = 0: 0 is a self-parent sentinel'],
  ['dist', '// dist(u, v) = dep[u] + dep[v] - 2 * dep[lca(u, v)]'],
]);

GV.registerTopic({
  id: 'lca', part: 12, order: 3,
  title: 'LCA by binary lifting',
  blurb: 'Precompute <code>up[v][k]</code>, the ancestor 2<sup>k</sup> steps above v. A query lifts the deeper vertex by the bits of the depth difference, then lifts both while their ancestors differ.',
  complexity: 'O(n log n) build · O(log n) query',
  chips: ['up[v][k]', 'dist = dep[u] + dep[v] − 2·dep[lca]'],
  graph: { preset: 'TREE', directed: false, weighted: false, tree: true },
  options: [{ id: 'u', type: 'vertex', label: 'u', default: 4 }, { id: 'v', type: 'vertex', label: 'v', default: 8 }],
  legend: [['cur', 'current u / v'], ['visited', 'already passed'], ['path', 'LCA'], ['e:cur', 'jump just made'], ['e:path', 'climbed so far'], ['e:tree', 'tree edge']],
  adjSig: 'vector<vector<int>> adj',
  code: lcaCode.text,
  notes: `
<h4>Key idea</h4>
<p>The <b>lowest common ancestor</b> of u and v (tree rooted at 1) is the deepest vertex that is an ancestor of both. In the TREE preset <code>LCA(4, 8) = 2</code> and <code>LCA(7, 9) = 1</code>. It matters because
<code>dist(u, v) = dep[u] + dep[v] − 2·dep[LCA(u, v)]</code>; check: dist(4, 8) = 2 + 3 − 2·1 = 3, path 4 − 2 − 5 − 8.</p>
<p><code>up[v][0]</code> is the parent; <code>up[v][k] = up[ up[v][k−1] ][k−1]</code> because two jumps of 2<sup>k−1</sup> make one of 2<sup>k</sup>.</p>
<h4>Why the second loop moves only when the ancestors differ</h4>
<p>If <code>up[u][k] == up[v][k]</code> that vertex is a common ancestor, but maybe not the lowest, so jumping could overshoot. Going from the largest power down, we end <b>just below</b> the LCA, and one more step <code>up[u][0]</code> lands on it.</p>
<h4>Cost</h4><p>Preprocessing O(n log n), query O(log n), memory O(n log n): with n = 2·10⁵ and LOG = 18 that is 3.6·10⁶ ints, about 14 MB. This page shows only the columns k &lt; ⌈log₂ n⌉ that matter for the current tree.</p>
<h4>Alternatives</h4><ul><li>Euler tour + sparse table: O(1) queries after O(n log n).</li><li>Offline Tarjan LCA with DSU: almost O(n + q), queries known in advance.</li><li>Few queries: just walk up one step at a time, O(n) per query.</li></ul>
<h4>Common mistakes</h4>
<ul><li><code>LOG</code> too small: with n = 2·10⁵ you need at least 18.</li>
<li>Not handling <code>up[root][k]</code>: point it at the sentinel 0 (and <code>up[0][k] = 0</code>).</li>
<li>Forgetting to swap so that u is the deeper one.</li>
<li>Moving when the ancestors are <em>equal</em> instead of when they differ.</li>
<li>Recursion depth on a path-shaped tree.</li></ul>
<h4>Check yourself</h4>
<ol><li>Compute <code>dist(7, 9)</code> using depths and the LCA.</li><li>Why do we move only when <code>up[u][k] != up[v][k]</code>?</li><li>Your LCA answers are wrong only for deep vertices. What is the first thing you check?</li></ol>`,
  problems: [
    { id: '519E', name: 'A and B and Lecture Rooms', note: 'LCA plus subtree sizes' },
    { id: '161D', name: 'Distance in Tree', note: 'distances in a tree' },
    { id: '580C', name: 'Kefa and Park', note: 'rooting warm-up' },
  ],
  validate: treeErr,
  run({ g, adj, opts }) {
    const n = g.n, L = lcaCode.L;
    const R = rec();
    let LOG = 1; while ((1 << LOG) < n) LOG++;           // 2^(LOG-1) >= n-1
    const up = Array.from({ length: n + 1 }, () => Array(LOG).fill(null));
    up[0] = Array(LOG).fill(0);
    const dep = Array(n + 1).fill(null), pe = Array(n + 1).fill(-1);
    const rows = Array.from({ length: n }, (_, i) => i + 1), cols = Array.from({ length: LOG }, (_, k) => k);
    const M = (hi, chg, via) => R.panel('up', { type: 'matrix', title: 'up[v][k]', note: `2<sup>k</sup> steps above v · LOG = ${LOG} is enough here (course: 18)`, rowLabels: rows, colLabels: cols, cells: up.slice(1).map((r) => r.slice()), hi: hi || [], chg: chg || [], via: via || [] });
    const Dp = (chg) => R.panel('dep', { type: 'array', title: 'dep[]', values: dep.slice(1), chg: chg || [] });
    const climb = (x, s) => { const es = []; for (let i = 0; i < s && x; i++) { es.push(pe[x]); x = up[x][0]; } return es; };
    dep[1] = 0;
    M(); Dp([0]);
    R.line(L.main).S(`Root at 1: <code>dfs(1, 0)</code>, dep[1] = 0. Vertex 0 is the sentinel above the root: <code>up[0][k] = 0</code> for every k, so jumps never fall off. We show k = 0..${LOG - 1} (2<sup>${LOG - 1}</sup> = ${1 << (LOG - 1)} ≥ n − 1).`);
    const dfs = (u, p) => {
      R.node(u, 'cur');
      up[u][0] = p;
      M([], [[u - 1, 0]]); Dp();
      R.adj(u, -1).line(L.up0).S(`<code>dfs(${u}, ${p})</code>: up[${u}][0] = ${p}${p ? ', the parent (2⁰ = 1 step up)' : ': the root points at the sentinel 0'}.`);
      for (let k = 1; k < LOG; k++) {
        const mid = up[u][k - 1];
        if (mid === 0) {
          for (let j = k; j < LOG; j++) up[u][j] = 0;
          M([], cols.slice(k).map((j) => [u - 1, j]));
          R.line([L.kfor, L.upk]).S(`up[${u}][${k - 1}] = 0 is the sentinel, so up[${u}][${k}${k < LOG - 1 ? '..' + (LOG - 1) : ''}] = up[0][…] = 0: 2<sup>${k}</sup> steps go above the root.`);
          break;
        }
        up[u][k] = up[mid][k - 1];
        const es = climb(u, 1 << k);
        es.forEach((e) => R.edge(e, 'cur'));
        if (up[u][k]) R.ring(up[u][k]);
        M([[mid - 1, k - 1]], [[u - 1, k]], [[u - 1, k - 1]]);
        R.line(L.upk).S(`k = ${k}: up[${u}][${k}] = up[ up[${u}][${k - 1}] = ${mid} ][${k - 1}] = <b>${up[u][k]}</b>. Two jumps of 2<sup>${k - 1}</sup> = one jump of ${1 << k}.`);
        es.forEach((e) => R.edge(e, 'tree'));
        if (up[u][k]) R.ring(up[u][k], false);
      }
      const done = [];
      adj[u].forEach(({ v, e }, i) => {
        if (v === p) { done.push(i); return; }
        dep[v] = dep[u] + 1; pe[v] = e;
        R.edge(e, 'tree').node(u, 'gray').label(v, 'd=' + dep[v]);
        M(); Dp([v - 1]);
        R.adj(u, i, done.slice()).line(L.child).S(`adj[${u}][${i}] = ${v} ≠ parent: dep[${v}] = dep[${u}] + 1 = ${dep[v]}, then <code>dfs(${v}, ${u})</code>.`);
        dfs(v, u);
        R.node(u, 'cur');
        done.push(i);
      });
      R.node(u, 'visited');
    };
    R.label(1, 'd=0');
    dfs(1, 0);
    M(); Dp();
    R.adj(null).line(L.decl).S(`Table built: ${n} × ${LOG} entries, O(n log n). Now the query.`);

    // ----- query -----
    let u = opts.u, v = opts.v;
    const u0 = u, v0 = v;
    for (let x = 1; x <= n; x++) R.node(x, 'idle');
    R.clearEdges(); for (let x = 2; x <= n; x++) if (pe[x] >= 0) R.edge(pe[x], 'dim');
    R.ring(u0).ring(v0).node(u, 'cur').node(v, 'cur');
    const Q = (html) => R.panel('q', { type: 'text', title: 'query', html });
    const st = () => `u = <b>${u}</b> (dep ${dep[u]}), v = <b>${v}</b> (dep ${dep[v]})`;
    Q(`lca(${u0}, ${v0})<br>${st()}`); M(); Dp();
    let sw = false;
    if (dep[u] < dep[v]) { [u, v] = [v, u]; sw = true; }
    Q(`lca(${u0}, ${v0})<br>${st()}`);
    R.top(u, 'u').top(v, u === v ? 'u=v' : 'v');
    R.line(L.swap).S(`Query <code>lca(${u0}, ${v0})</code>: dep[${u0}] = ${dep[u0]}, dep[${v0}] = ${dep[v0]}. ${sw ? `${u0} is shallower, so swap: u = ${u}, v = ${v}.` : 'u is already at least as deep as v, no swap.'}`);
    const diff = dep[u] - dep[v];
    Q(`${st()}<br>diff = ${diff} = <code>${diff.toString(2)}</code>₂`);
    R.line(L.diff).S(`diff = dep[u] − dep[v] = ${dep[u]} − ${dep[v]} = ${diff}, binary <code>${diff.toString(2)}</code>. Lift u by exactly the powers of two whose bit is set.`);
    const pathE = new Set();
    const move = (x, k) => {
      const es = climb(x, 1 << k);
      es.forEach((e) => R.edge(e, 'cur'));
      R.node(x, 'visited');
      const y = up[x][k];
      return { y, es };
    };
    if (diff === 0) {
      R.line(L.lfor).S('diff = 0: both are already on the same depth, nothing to lift.');
    } else {
      for (let k = 0; (diff >> k) > 0; k++) {
        if (diff >> k & 1) {
          const from = u;
          const { y, es } = move(u, k);
          R.top(from, null);
          u = y; R.node(u, 'cur').top(u, 'u');
          M([[from - 1, k]]);
          Q(`${st()}<br>diff = <code>${diff.toString(2)}</code>₂, bit ${k} = 1`);
          R.line(L.lift).S(`k = ${k}: bit ${k} of ${diff} is 1, so u = up[${from}][${k}] = <b>${u}</b> (${1 << k} step${k ? 's' : ''} up).`);
          es.forEach((e) => { R.edge(e, 'path'); pathE.add(e); });
        } else {
          M();
          R.line(L.lift).S(`k = ${k}: bit ${k} of ${diff} is 0, do not jump.`);
        }
      }
    }
    Q(`${st()}`); M();
    if (u === v) {
      R.node(u, 'path').top(u, 'LCA');
      const dd = dep[u0] + dep[v0] - 2 * dep[u];
      Q(`lca(${u0}, ${v0}) = <b>${u}</b><br>dist = dep[${u0}] + dep[${v0}] − 2·dep[${u}] = ${dep[u0]} + ${dep[v0]} − 2·${dep[u]} = <b>${dd}</b>`);
      R.line(L.eq).S(`u == v == ${u}: ${v} was an ancestor of the deeper vertex. <b>LCA(${u0}, ${v0}) = ${u}</b>, dist = ${dep[u0]} + ${dep[v0]} − 2·${dep[u]} = ${dd}.`, true);
      return R.frames;
    }
    R.line(L.eq).S(`Same depth ${dep[u]} now, but u = ${u} ≠ v = ${v}. Lift both, largest power first, as long as they do not meet.`);
    let k = LOG - 1;
    while (k >= 0) {
      if (up[u][k] === 0 && up[v][k] === 0) {
        let k2 = k; while (k2 >= 0 && up[u][k2] === 0 && up[v][k2] === 0) k2--;
        const ks = []; for (let j = k; j > k2; j--) ks.push(j);
        M(ks.flatMap((j) => [[u - 1, j], [v - 1, j]]));
        R.line([L.bfor, L.cmp]).S(`k = ${ks.join(', ')}: up[${u}][k] = up[${v}][k] = 0 (above the root). Equal, do not move.`);
        k = k2; continue;
      }
      const a = up[u][k], b = up[v][k];
      M([[u - 1, k], [v - 1, k]]);
      if (a === b) {
        R.ring(a);
        R.line(L.cmp).S(`k = ${k}: up[${u}][${k}] = ${a}, up[${v}][${k}] = ${b}. <b>Equal</b>: ${a} is a common ancestor but maybe too high. Do not move.`);
        R.ring(a, a === u0 || a === v0);
      } else {
        const fu = u, fv = v;
        const m1 = move(u, k), m2 = move(v, k);
        R.top(fu, null).top(fv, null);
        u = a; v = b;
        R.node(u, 'cur').node(v, 'cur').top(u, 'u').top(v, 'v');
        Q(`${st()}`);
        R.line([L.cmp, L.mu, L.mv]).S(`k = ${k}: up[${fu}][${k}] = ${a} ≠ up[${fv}][${k}] = ${b}. <b>Different</b>, so the LCA is higher: jump both, u = ${a}, v = ${b}.`);
        m1.es.concat(m2.es).forEach((e) => R.edge(e, 'path'));
      }
      k--;
    }
    const lca = up[u][0];
    [pe[u], pe[v]].forEach((e) => R.edge(e, 'path'));
    R.node(u, 'visited').node(v, 'visited').top(u, null).top(v, null).node(lca, 'path').top(lca, 'LCA');
    const dd = dep[u0] + dep[v0] - 2 * dep[lca];
    M([[u - 1, 0], [v - 1, 0]]);
    Q(`lca(${u0}, ${v0}) = <b>${lca}</b><br>dist(${u0}, ${v0}) = dep[${u0}] + dep[${v0}] − 2·dep[${lca}]<br>= ${dep[u0]} + ${dep[v0]} − 2·${dep[lca]} = <b>${dd}</b>`);
    R.line([L.ret, L.dist]).S(`u = ${u} and v = ${v} sit just below the LCA. One more step: <b>LCA(${u0}, ${v0}) = up[${u}][0] = ${lca}</b>. dist = ${dep[u0]} + ${dep[v0]} − 2·${dep[lca]} = ${dd}.`, true);
    return R.frames;
  },
});

/* ============================================================
   4. Euler tour: subtree becomes a range
   ============================================================ */
const etCode = mk([

  ['range', '// subtree of v = ord[tin[v] .. tout[v]], sz = tout - tin + 1'],

<p>That turns "add x to every vertex in the subtree of v" and "sum the subtree of v" into range update / range query on an array, which a Fenwick tree or segment tree handles in O(log n). It is the standard bridge from trees to data structures.</p>
<h4>Two clocks, same idea</h4>
<p>Part 3 ticks the timer on entry <em>and</em> exit (<code>tout[u] = timer++</code>), giving nested brackets. Here the timer ticks only on entry and <code>tout[u] = timer − 1</code> is the last <em>position</em> inside the subtree, so <code>[tin, tout]</code> indexes <code>ord[]</code> directly. The ancestor test <code>tin[u] ≤ tin[v] &amp;&amp; tout[v] ≤ tout[u]</code> works with both.</p>
<h4>Common mistakes</h4>

    const n = g.n, L = etCode.L, q = opts.q;

    const ord = Array(n).fill(null);

      R.panel('tin', { type: 'array', title: 'tin[]', values: tin.slice(1), hi: u ? [u - 1] : [], chg: chg.tin || [] });
      R.panel('tout', { type: 'array', title: 'tout[]', values: tout.slice(1), hi: u ? [u - 1] : [], chg: chg.tout || [] });
      R.panel('st', { type: 'stack', title: 'recursion stack', items: stack.map((a, i) => ({ t: a, s: i === stack.length - 1 ? 'cur' : 'gray' })) });

    };
    P(null);
    R.line([L.t, L.main]).S('timer = 0. Call <code>dfs(1, 0)</code>. Each vertex gets the next position when it is <b>entered</b>.');

      stack.push(u);
      tin[u] = timer; ord[timer] = u; timer++;

    R.line(L.range).S(`Subtree of <b>${q}</b> = positions ${a}..${b} = {${mem.join(', ')}}: one contiguous block of size ${b - a + 1} = sz[${q}]. A Fenwick / segment tree over ord[] now answers subtree queries in O(log n).`, true);
    return R.frames;
  },
});
})();

<script>/* 22-dfstree.js */
/* Part 13: the DFS tree. Bridges + articulation points (tin / low), strongly connected components (Kosaraju) + condensation. */
(function () {
const GV = window.GV;

const CAP = 580;
function rec() {
  const R = GV.recorder();
  R.S = (msg, must) => {
    if (must || R.frames.length < CAP) R.snap(msg);
    else if (!R._capped) { R._capped = true; R.snap('<i>Large input: the remaining intermediate steps are skipped. Jump to the end for the result.</i>'); }
    return R;
  };
  return R;
}
function mk(parts) {
  const P = parts.filter(Boolean), L = {};
  P.forEach(([k], i) => { if (k) L[k] = i + 1; });
  return { text: P.map((x) => x[1]).join('\n'), L };
}
const setStr = (a) => '{' + a.join(', ') + '}';

GV.addPreset('BR1', {
  name: 'BR1 · two triangles + bridge (Part 13)', directed: false, weighted: false, n: 6,

  edges: [[1, 2], [2, 3], [1, 3], [3, 4], [4, 5], [5, 6], [4, 6]],

});
GV.addPreset('BR2', {

/* ============================================================
   5. Bridges and articulation points
   ============================================================ */
function brCode(o) {
  const id = o.skip === 'id';
  return mk([
    ['t', 'int timer = 0;'],
    ['decl', 'vector<int> tin, low;'],
    ['vis', 'vector<bool> vis;'],
    ['out', 'vector<pair<int,int>> bridges;  set<int> aps;'],
    [null, ''],
    ['fn', id ? 'void dfs(int u, int pe, vector<vector<pair<int,int>>>& adj) {'
      : 'void dfs(int u, int p, vector<vector<int>>& adj) {'],
    ['v', '    vis[u] = true;'],
    ['tin', '    tin[u] = low[u] = timer++;'],
    ['ch0', '    int children = 0;'],
    ['for', id ? '    for (auto [v, id] : adj[u]) {' : '    for (int v : adj[u]) {'],
    ['skip', id ? '        if (id == pe) continue;          // skip only THAT edge'
      : '        if (v == p) continue;            // skip the edge to the parent'],
    ['isv', '        if (vis[v]) {'],
    ['back', '            low[u] = min(low[u], tin[v]);    // back edge: tin'],
    [null, '        } else {'],
    ['call', id ? '            dfs(v, id, adj);' : '            dfs(v, u, adj);'],
    ['low', '            low[u] = min(low[u], low[v]);    // tree edge: low'],
    ['br', '            if (low[v] >  tin[u]) bridges.push_back({u, v});'],
    ['ap', id ? '            if (low[v] >= tin[u] && pe != -1) aps.insert(u);'
      : '            if (low[v] >= tin[u] && p != 0) aps.insert(u);'],
    ['chp', '            children++;'],
    [null, '        }'],
    [null, '    }'],
    ['root', id ? '    if (pe == -1 && children > 1) aps.insert(u);   // root rule'
      : '    if (p == 0 && children > 1) aps.insert(u);      // root rule'],
    [null, '}'],
    [null, ''],
    ['main', id ? '// for (int i = 1; i <= n; i++) if (!vis[i]) dfs(i, -1, adj);'
      : '// for (int i = 1; i <= n; i++) if (!vis[i]) dfs(i, 0, adj);'],
  ]);
}

/** draw the DFS forest (tree edges straight, non-tree edges as arcs) into el */
function drawDfsForest(f, el, g, opts = {}) {
  el.innerHTML = '';
  const x = f.extra;
  if (!x || !x.pos) return;
  const svg = GV.s('svg', { class: 'gsvg' });
  el.append(svg);
  const r = 16;
  const g2 = { n: g.n, directed: g.directed, weighted: false, pos: x.pos, edges: g.edges.map((e) => ({ ...e })) };
  const nodes = {}, edges = {};
  for (let v = 1; v <= g.n; v++) nodes[v] = x.seen[v] ? (f.nodes || {})[v] || {} : { s: 'hidden' };
  const arcs = [];
  g.edges.forEach((e, i) => {
    const st = (f.edges || {})[i];
    const isTree = x.treeE.includes(i);

<p>In a directed graph "connected" splits in two: <b>weakly</b> connected (connected if you ignore directions) and <b>strongly</b> connected (every vertex reaches every other along the arrows).
A strongly connected component is a maximal set of vertices that all reach each other. SCC1: {1,2,3}, {4,5,6}, {7}.</p>

<p><b>Why it works (intuition):</b> the vertex that finishes last lies in a <em>source</em> SCC of the condensation. In the reversed graph, edges to other components point away, so a DFS from it stays inside its own SCC. Peel it off and repeat.</p>
<h4>The condensation</h4>
<p>Shrink each SCC to one vertex: the result is <b>always a DAG</b> (a cycle among components would merge them). Typical uses: minimum edges to make everything strongly connected = <code>max(#indegree-0, #outdegree-0)</code> (0 if one component); "from how few vertices can we reach everything" = #indegree-0 components (999E); longest path with cycles = condense, then DP on the DAG.</p>
<p>Tarjan's algorithm does the same in one pass using <code>low</code> values, like bridges. Faster by a constant, harder to recall under pressure. Learn Kosaraju first.</p>

      R.panel('st', { type: 'stack', title: stack.length && stack[0].startsWith('dfs2') ? 'dfs2 stack' : 'dfs1 stack', items: stack.map((a, i) => ({ t: a, s: i === stack.length - 1 ? 'cur' : 'gray' })) });
      R.panel('ord', { type: 'list', title: 'order[]', note: 'vertices in finish order (index 0 first)', items: order.map((v, i) => ({ t: v, s: comp[v] >= 0 ? 'c' + (comp[v] % 8) : undefined })), hi: hiOrd != null ? [hiOrd] : [] });
      R.panel('comp', { type: 'array', title: 'comp[]', values: comp.slice(1).map((c) => (c === -1 ? -1 : c)), chg: chgComp || [], cellState: Object.fromEntries(comp.slice(1).map((c, i) => [i, c >= 0 ? 'c' + (c % 8) : null]).filter((x) => x[1])) });
      ex();
    };
    P();
    R.line([L.init1, L.loop1]).S('<b>Pass 1</b> on the original graph: DFS from every unvisited vertex, and push each vertex onto <code>order</code> at the moment it <b>finishes</b>.');
    const dfs1 = (u) => {
      vis[u] = true; stack.push(`dfs1(${u})`);
      R.node(u, 'cur').adj(u, -1); P();
      R.line(L.v1).S(`<code>dfs1(${u})</code>: vis[${u}] = true.`);
      const done = [];
      adj[u].forEach(({ v, e }, i) => {
        R.adj(u, i, done.slice());
        if (vis[v]) {
          const pr = R.getEdge(e);
          R.edge(e, 'cur'); P();
          R.line(L.s1).S(`adj[${u}][${i}] = ${v} is already visited${order.includes(v) ? ' and finished' : ' (still on the stack)'}. Skip.`);
          R.edge(e, pr === 'idle' ? null : pr);
        } else {
          R.edge(e, 'tree').node(u, 'gray'); P();
          R.line(L.s1).S(`adj[${u}][${i}] = ${v} is not visited: go deeper, <code>dfs1(${v})</code>.`);
          dfs1(v);
          R.node(u, 'cur');
        }
        done.push(i);
      });
      order.push(u); stack.pop();
      R.node(u, 'done').label(u, 'fin ' + (order.length - 1)).adj(null); P(order.length - 1);
      R.line(L.push).S(`${u} has no unvisited neighbours left: it <b>finishes</b>. order.push_back(${u}) → order = [${order.join(', ')}].`);
    };
    for (let i = 1; i <= n; i++) {
      if (vis[i]) continue;
      R.adj(null); P();
      R.line(L.loop1).S(`Outer loop: i = ${i} is not visited → <code>dfs1(${i})</code>.`);
      dfs1(i);
    }
    // pass 2
    const radjRows = radj.slice(1).map((l, i) => ({ u: i + 1, items: l.map((x) => ({ v: x.v })) }));
    R.adjList({ note: '<b>reverse graph radj[]</b>: for every edge u → v, u is stored in radj[v]', rows: radjRows });
    R.clearEdges();
    for (let v = 1; v <= n; v++) R.node(v, 'idle');
    R.adj(null); P();
    R.line([L.init2, L.c0]).S(`Pass 1 done: order = [${order.join(', ')}]. <b>Pass 2</b> works on the <b>reversed graph</b>: the adjacency panel now shows <code>radj[]</code>. comp[] = −1, c = 0. We read order from the back: ${order.slice().reverse().join(', ')}.`);
    const dfs2 = (u, c) => {
      comp[u] = c; stack.push(`dfs2(${u},${c})`);
      R.node(u, 'c' + (c % 8)).label(u, 'C' + c).ring(u).adj(u, -1); P(order.indexOf(u), [u - 1]);
      R.line(L.c2).S(`<code>dfs2(${u}, ${c})</code>: comp[${u}] = ${c}.`);
      const done = [];
      radj[u].forEach(({ v, e }, i) => {
        R.adj(u, i, done.slice());
        if (comp[v] !== -1) {
          P(order.indexOf(u));
          R.line(L.s2).S(`radj[${u}][${i}] = ${v} (original edge ${v} → ${u}): comp[${v}] = ${comp[v]}${comp[v] === c ? ', already in this component' : ', a component peeled off earlier'}. Skip.`);
        } else {
          R.edge(e, 'c' + (c % 8)); P(order.indexOf(u));
          R.line(L.s2).S(`radj[${u}][${i}] = ${v} (original edge ${v} → ${u}): ${v} reaches ${u} in the original graph and comp[${v}] == −1, so ${v} is in the same SCC. <code>dfs2(${v}, ${c})</code>.`);
          R.ring(u, false);
          dfs2(v, c);
          R.ring(u);
        }
        done.push(i);
      });
      R.ring(u, false);
      stack.pop();
    };
    for (let i = n - 1; i >= 0; i--) {
      const u = order[i];
      R.adj(null);
      if (comp[u] !== -1) {
        P(i);
        R.line([L.loop2, L.u2, L.start2]).S(`i = ${i}: u = order[${i}] = ${u} already has comp = ${comp[u]}. Skip.`);
        continue;
      }
      const c = found;
      P(i);
      R.ring(u).line([L.loop2, L.u2, L.start2]).S(`i = ${i}: u = order[${i}] = ${u}, comp[${u}] == −1. It finished latest among the rest, so it lies in a <b>source</b> component. Start <code>dfs2(${u}, ${c})</code>.`);
      R.ring(u, false);
      dfs2(u, c);
      found++;
      const mem = members[c];
      g.edges.forEach((e, j) => { if (comp[e.u] === c && comp[e.v] === c) R.edge(j, 'c' + (c % 8)); });
      R.adj(null); P(i);
      R.line(L.start2).S(`dfs2 cannot leave the component in the reversed graph. <b>SCC C${c} = ${setStr(mem)}</b>. c → ${c + 1}.`);
    }
    // final
    g.edges.forEach((e, j) => R.edge(j, comp[e.u] === comp[e.v] ? 'c' + (comp[e.u] % 8) : 'dim'));
    const a = indeg.filter((d) => d === 0).length, b = outdeg.filter((d) => d === 0).length;
    R.adjList(null).adj(null);
    stack.length = 0; P();
    R.panel('st', null);
    R.panel('res', { type: 'text', title: 'answer', html: `${C} SCC${C > 1 ? 's' : ''}: ${members.map((m, c) => `C${c} = ${setStr(m)}`).join(', ')}<br>condensation: ${cedges.length ? cedges.map(([x, y]) => `C${x} → C${y}`).join(', ') : 'no edges'}<br>indegree-0: ${a}, outdegree-0: ${b} → edges needed to make it strongly connected: <b>${C === 1 ? 0 : Math.max(a, b)}</b>` });
    R.line([L.ret, L.cond, L.cf, L.cadj]).S(`<code>return c = ${C}</code>. SCCs: ${members.map((m) => setStr(m)).join(' ')}. Shrink each to one vertex: the condensation (below) is a DAG${cedges.length ? ', ' + cedges.map(([x, y]) => `C${x} → C${y}`).join(', ') : ''}.`, true);
    return R.frames;
  },
});
})();

</script>

  cycle:        { opts: [], presets: ['K4', 'G1', 'G2', 'CY-dia', 'CY-d'] },
  components:   { opts: [], presets: ['G1', 'CC-4', 'K4'], drop: /^components$|^answers/ },
  'flood-fill': { opts: ['sample'] },
  bipartite:    { opts: [], presets: ['G1', 'BP-sq', 'BP-yes', 'K4'] },
  topo:         { presets: ['G2', 'TOPO-lex', 'TOPO-cyc'] },
  'dag-dp':     { presets: ['G2', 'DAG-w'] },
  dsu:          { presets: ['G1', 'G3', 'DSU-chain'] },

  'bellman-ford': { presets: ['SP-neg', 'SP-negcyc', 'G3d'] },

  'euler-tour': { drop: /^(tin|tout)\[\]/ },
  bridges:      { opts: [], presets: ['BR1', 'G1'], noExtra: true, drop: /tree edge checks/ },
  scc:          { presets: ['SCC1', 'G2'] },
};
for (const t of GV.topics) {
  const c = CFG[t.id];
  if (!c) continue;
  if (c.opts) (t.options || []).forEach((o) => { if (!c.opts.includes(o.id)) o.hidden = true; });
  if (c.defaults) (t.options || []).forEach((o) => { if (o.id in c.defaults) o.default = c.defaults[o.id]; });

}
